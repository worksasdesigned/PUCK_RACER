<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Domination Live</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-info { background: var(--card-bg); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px; border: 1px solid var(--border-color);}
        .big-time { font-size: 4rem; font-family: monospace; color: var(--text-main); font-weight: bold;}
        .status-txt { font-size: 1.2rem; color: var(--text-muted); text-transform: uppercase; margin-top:5px; font-weight:bold;}

        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; }

        .arena-box { background: var(--card-bg); border-radius: 8px; margin-bottom: 20px; padding: 15px; border: 1px solid var(--border-color);}
        .arena-title { font-size: 1.2rem; font-weight:bold; margin-bottom: 15px; text-align:center; color:var(--text-muted); border-bottom:1px solid var(--border-color); padding-bottom:5px;}
        
        .duel-board { display:flex; justify-content: space-between; align-items: center; margin-bottom:15px; background:var(--bg-color); padding:10px; border-radius:6px;}
        .team-col { display:flex; flex-direction:column; align-items:center; width:40%;}
        .t-name { font-size:1.1rem; font-weight:bold; margin-bottom:5px; text-align:center;}
        .t-score { font-family:monospace; font-size:3rem; font-weight:bold; line-height:1; transition: color 0.3s; color:var(--text-main); }
        .vs-txt { font-size:1.5rem; font-weight:bold; color:var(--text-muted); }
        
        .puck-grid { display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
        .puck-btn { 
            width:45px; height:45px; border-radius:50%; border:2px solid var(--border-color); 
            background:var(--bg-color); cursor:pointer; display:flex; align-items:center; justify-content:center;
            font-size:0.8rem; font-weight:bold; color:var(--text-main); transition:0.1s; padding:0;
        }
        .puck-btn:active { transform:scale(0.9); }
        .locked { border:2px solid #fff !important; box-shadow:0 0 10px #fff; }
        .wait-icon { font-size:2rem; margin-top:5px;}

        .bottom-nav { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_domination">Domination ⚔️</div>
     <div class="status-bar">
    <div class="status-dot dot-green" id="cnt-green">0</div>
    <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
    <div class="status-dot dot-red" id="cnt-red">0</div>
</div>
    </header>

    <main>
        <div class="top-info">
            <div class="big-time" id="globalTime">00:00</div>
            <div class="status-txt" id="stateInfo">WAITING</div>
        </div>

        <div class="controls">
            <button onclick="goBack()" class="btn-warn btn-ctrl" data-i18n="btn_back">⬅</button>
            <button onclick="doAction('start')" class="btn-primary btn-ctrl" id="btnStart" data-i18n="btn_start">START</button>
            <button onclick="doAction('stop')" class="btn-danger btn-ctrl" data-i18n="btn_stop">STOP</button>
        </div>

        <div id="arenaList"></div>

        <div class="bottom-nav">
            <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
<script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        const T1_COLORS = ['#FF0000', '#00FF00']; 
        const T2_COLORS = ['#FFFF00', '#0000FF']; 

        document.getElementById('arenaList').addEventListener('click', function(e) {
            let btn = e.target.closest('.puck-btn');
            if(btn) {
                let cmd = btn.getAttribute('data-cmd');
                if(cmd) fetch(`/api/game/action?cmd=${cmd}`);
            }
        });

        setInterval(update, 400); 

        function update() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                 
                render(data);
            }).catch(e => {});
        }

        function formatTime(ms) {
            let sec = Math.ceil(ms / 1000); 
            let m = Math.floor(sec / 60);
            let s = sec % 60;
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function render(data) {
            document.getElementById('globalTime').innerText = formatTime(data.t);
            
            // Text via Dictionary auflösen
            let stKeys = ['dom_st_setup', 'dom_st_hold', 'dom_st_ready', 'dom_st_false', 'dom_st_run', 'dom_st_fin'];
            let stTxt = getTranslation(stKeys[data.st]) || "UNKNOWN";
            let stCol = "var(--warning)";
            
            if(data.st === 3) stCol = "var(--danger)";
            if(data.st === 4) { stCol = "var(--success)"; }
            if(data.st === 5) { stCol = "gold"; }
            
            document.getElementById('stateInfo').innerText = stTxt;
            document.getElementById('stateInfo').style.color = stCol;
            
            let btn = document.getElementById('btnStart');
            if (data.st === 0 || data.st === 5 || data.st === 3) { 
                btn.innerText = (data.st === 3) ? getTranslation('btn_reset') : getTranslation('btn_start'); 
                btn.style.background = "var(--primary)"; 
            } else { 
                btn.innerText = getTranslation('btn_running'); 
                btn.style.background = "var(--card-hover)"; 
            }

            renderArenas(data);
        }

        function renderArenas(data) {
            let container = document.getElementById('arenaList');
            if (!data.grps) return;
            
            let vsTxt = getTranslation('dom_run_vs');

            data.grps.forEach((g, i) => {
                let rowId = `arena-${i}`;
                let rowEl = document.getElementById(rowId);
                
                let aName = sessionStorage.getItem(`dom_gname_${i}`) || `Arena ${i+1}`;
                let t1Name = sessionStorage.getItem(`dom_t1name_${i}`) || `Team Red`;
                let t2Name = sessionStorage.getItem(`dom_t2name_${i}`) || `Team Yellow`;
                
                let c1 = T1_COLORS[i];
                let c2 = T2_COLORS[i];

                if (!rowEl) {
                    container.insertAdjacentHTML('beforeend', `
                    <div id="${rowId}" class="arena-box">
                        <div class="arena-title">${aName}</div>
                        <div class="duel-board">
                            <div class="team-col">
                                <div class="t-name" style="color:${c1}">${t1Name}</div>
                                <div id="s1-${i}" class="t-score" style="text-shadow:0 0 10px ${c1}">${g.t1s}</div>
                            </div>
                            <div class="vs-txt">${vsTxt}</div>
                            <div class="team-col">
                                <div class="t-name" style="color:${c2}">${t2Name}</div>
                                <div id="s2-${i}" class="t-score" style="text-shadow:0 0 10px ${c2}">${g.t2s}</div>
                            </div>
                        </div>
                        <div id="pucks-${i}" class="puck-grid"></div>
                    </div>`);
                } else {
                    document.getElementById(`s1-${i}`).innerText = g.t1s;
                    document.getElementById(`s2-${i}`).innerText = g.t2s;
                    
                    let pucksContainer = document.getElementById(`pucks-${i}`);
                    
                    if(data.st >= 4) { 
                        if (!pucksContainer.classList.contains('rendered')) {
                            let phtml = "";
                            g.pucks.forEach((p, idx) => {
                                phtml += `<button id="pb-${p.gIdx}" class="puck-btn" data-cmd="neut&val=${p.gIdx}">${idx+1}</button>`;
                            });
                            pucksContainer.innerHTML = phtml;
                            pucksContainer.classList.add('rendered');
                        }
                        
                        g.pucks.forEach(p => {
                            let btn = document.getElementById(`pb-${p.gIdx}`);
                            if(btn) {
                                let bg = "var(--bg-color)"; let border = "var(--border-color)";
                                if (p.o === 1) { bg = c1; border = c1; }
                                else if (p.o === 2) { bg = c2; border = c2; }
                                
                                if(btn.style.backgroundColor !== bg) btn.style.backgroundColor = bg;
                                if(btn.style.borderColor !== border) btn.style.borderColor = border;
                                
                                if (p.l === 1) {
                                    if(!btn.classList.contains("locked")) btn.classList.add("locked");
                                } else {
                                    if(btn.classList.contains("locked")) btn.classList.remove("locked");
                                }
                            }
                        });
                    } 
                    else if (data.st === 1 || data.st === 2 || data.st === 3) {
                        pucksContainer.classList.remove('rendered');
                        pucksContainer.innerHTML = `
                            <div style="text-align:center; width:100%; color:var(--text-muted);">
                                <p>Start Pucks:</p>
                                <span class="wait-icon" style="color:${g.h1?c1:'var(--text-muted)'};">${g.h1?'🖐️':'⌛'}</span>
                                <span class="wait-icon" style="color:${g.h2?c2:'var(--text-muted)'}; margin-left:20px;">${g.h2?'🖐️':'⌛'}</span>
                            </div>`;
                    }
                    else {
                        pucksContainer.classList.remove('rendered');
                        pucksContainer.innerHTML = "";
                    }
                }
            });
        }

        function doAction(cmd) { fetch(`/api/game/action?cmd=${cmd}`); }
        function goBack() { doAction('reset'); location.href = 'game_domination_names.html'; }
        function goHome() { fetch('/api/game/action?cmd=exit').then(() => location.href = '/'); }
    </script>
</body>
</html>
