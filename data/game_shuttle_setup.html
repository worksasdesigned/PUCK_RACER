<!DOCTYPE html>
<html lang="en">
<head>
	<script src="tour.js"></script> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Setup - Shuttle Run</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <header><div class="logo" data-i18n="g_shuttle">Shuttle Run</div></header>
    <main>
        <div class="card">
            <div class="slider-header">
                <h3 data-i18n="sr_setup_players" style="margin:0;">🏃 Players</h3>
                <span id="playerDisplay" class="slider-val">1</span>
            </div>
            <input type="range" id="playerSlider" min="1" max="5" value="1" oninput="updatePlayers(this.value)">
            
            <p id="puckInfo" class="info-txt" data-i18n="loading">Loading...</p>
        </div>

        <div class="card">
            <div class="slider-header">
                <h3 data-i18n="sr_setup_rounds" style="margin:0;">🔁 Rounds</h3>
                <span id="roundDisplay" class="slider-val">5</span>
            </div>
            <input type="range" id="roundSlider" min="1" max="20" value="5" oninput="updateRounds(this.value)">
        </div>

        <button id="btnNext" onclick="nextStep()" class="btn-primary" style="font-size:1.5rem; margin-top:20px;" data-i18n="btn_next">NEXT ➡</button>
        <button onclick="cancelSetup()" class="btn-back" style="margin-top:20px;" data-i18n="btn_cancel">Cancel</button>
    </main>

    <script src="lang.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        let players = 1;
        let rounds = 5;
        let connectedPucks = 0;

        fetch('/api/game/load?id=1');
        fetch('/api/status').then(r=>r.json()).then(data => {
            connectedPucks = data.filter(p => p.active).length;
            updatePlayers(1); 
        });

        function updatePlayers(val) {
            players = parseInt(val);
            document.getElementById('playerDisplay').innerText = players;
            
            let needed = players * 2;
            let infoEl = document.getElementById('puckInfo');
            let btn = document.getElementById('btnNext');

            infoEl.innerHTML = `${getTranslation('req_pucks')} ${needed} | ${getTranslation('conn_pucks')} ${connectedPucks}`;
            
            if (needed > connectedPucks) {
                infoEl.classList.add('warn-txt');
                btn.style.opacity = 0.5;
            } else {
                infoEl.classList.remove('warn-txt');
                btn.style.opacity = 1;
            }
        }

        function updateRounds(val) {
            rounds = val;
            document.getElementById('roundDisplay').innerText = val;
        }

        function nextStep() {
            if (players * 2 > connectedPucks) {
                if(!confirm("Not enough pucks connected! Continue anyway?")) return;
            }
            sessionStorage.setItem('sr_players', players);
            sessionStorage.setItem('sr_rounds', rounds);
            location.href = 'game_shuttle_names.html';
        }

        function cancelSetup() {
            fetch('/api/game/action?cmd=exit').then(() => location.href = '/').catch(() => location.href = '/');
        }
    </script>
    <script>
    window.TRAINING_FIELDS = [
        { key:'playerSlider', el:'playerSlider' },
        { key:'roundSlider',  el:'roundSlider' }
    ];
    </script>
    <script src="training_config.js"></script>
</body>
</html>
