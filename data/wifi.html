<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Wi-Fi Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo" style="font-size: 1rem;" data-i18n="set_wifi">Wi-Fi Settings</div>
        <div class="status-bar">
            <div class="status-dot dot-green" id="cnt-green">0</div>
            <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
            <div class="status-dot dot-red" id="cnt-red">0</div>
        </div>
    </header>

    <main>
        <button onclick="nav('/settings.html')" class="btn btn-back" data-i18n="btn_back">&#11013; BACK</button>

        <div class="card" style="border: 1px solid var(--primary);">
            <h3 data-i18n="set_wifi">Wi-Fi Security</h3>
            <p style="font-size:0.8rem; color:#aaa;" data-i18n="set_wifi_desc">Changes require reboot. Pucks will receive new credentials automatically on update.</p>
            <form method="POST" action="/api/wifi_config">
                <input type="text" id="ssid_input" name="ssid" placeholder="SSID Name (max 16)" required maxlength="16" data-i18n="wifi_ssid_ph" style="width:100%; padding:10px; margin-bottom:5px; background:#333; color:white; border:none; border-radius:4px;">
                <input type="password" name="pw" placeholder="Password (max 10, leave empty for Open)" maxlength="10" data-i18n="wifi_pw_ph" style="width:100%; padding:10px; background:#333; color:white; border:none; border-radius:4px;">
                <input type="submit" value="Save & Reboot AP" class="btn-warn" data-i18n="wifi_save_btn">
            </form>
        </div>
    </main>

    <footer>by WorksAsDesigned</footer>
    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script>startStatusLoop();</script>
    <script>
        fetch('/api/wifi_info').then(r => r.json()).then(d => {
            if(d.ssid) document.getElementById('ssid_input').value = d.ssid;
        });
    </script>
</body>
</html>
