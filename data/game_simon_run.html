<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Simon Says Live</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; }
        .bottom-nav { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 15px; }

        .group-card { background: var(--card-bg); border-radius: 10px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #fff; }
        .g-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .g-name { font-size: 1.5rem; font-weight: bold; color: var(--text-main); }
        .g-stars { color: gold; font-size: 1.2rem; }
        .g-ctrl { display: flex; gap: 5px; margin-bottom: 10px; }
        .seq-row { display: flex; gap: 4px; height: 20px; background: var(--bg-color); border-radius: 4px; padding: 2px; overflow: hidden; }
        .seq-dot { flex: 1; height: 100%; opacity: 0.3; border-radius: 2px; transition: opacity 0.1s; }
        .seq-active { opacity: 1; box-shadow: 0 0 5px white; border: 1px solid #fff; }
        .status-badge { background: var(--card-hover); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; color: var(--text-main);}
        
        .action-btns { display: flex; gap: 10px;}
        .ctrl-row { display: flex; gap: 10px; margin-top: 8px; }
        .ctrl-row button, .group-card .action-btn { width: auto; padding: 5px 12px; margin-top: 0; font-size: 0.8rem; }
        .btn-action { flex:1; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-action:active { transform: scale(0.95); }
        .btn-start { background: var(--success); color: black; }
        .btn-stop { background: var(--danger); color: white; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_simon">Simon Says</div>
     <div class="status-bar">
    <div class="status-dot dot-green" id="cnt-green">0</div>
    <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
    <div class="status-dot dot-red" id="cnt-red">0</div>
</div>
    </header>
    <main>
        <div class="controls">
            <button onclick="goBack()" class="btn-warn btn-ctrl" data-i18n="btn_back">⬅</button>
            <button onclick="doAction('start_all')" class="btn-primary btn-ctrl" data-i18n="btn_start_all">START ALL</button>
            <button onclick="doAction('stop_all')" class="btn-danger btn-ctrl" data-i18n="btn_stop_all">STOP ALL</button>
        </div>
        
        <div id="gameContainer">
            <div style="text-align:center; color:var(--text-muted); padding:20px;" data-i18n="loading">Loading Game...</div>
        </div>

        <div class="bottom-nav">
            <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        // --- STATS LOGIK ---
        let savedStats = {}; 
        let personalBests = {};
        let sessionRecords = {};
        let targetLvl = sessionStorage.getItem('sim_len') || 5;

        async function loadPersonalBests() {
            let numP = parseInt(sessionStorage.getItem('sim_groups') || 1);
            for (let i = 0; i < numP; i++) {
                let pid = sessionStorage.getItem(`p_id_${i}`);
                if (pid && pid !== "0") {
                    try {
                        let r = await fetch('/s_' + pid + '.csv?_t=' + Date.now());
                        if (r.ok) {
                            let text = await r.text();
                            let lines = text.split(/\r?\n/);
                            let bestScore = 0; // Simon Says: Höher = Besser
                            lines.forEach(line => {
                                let parts = line.split(';');
                                if (parts.length >= 4 && parts[1] === "4") { // GameID 4 = Simon Says
                                    let score = parseInt(parts[2]); 
                                    if (score > bestScore) bestScore = score;
                                }
                            });
                            if (bestScore > 0) personalBests[i] = bestScore;
                        }
                    } catch(e) {}
                }
            }
        }
        loadPersonalBests();

        function savePlayerStat(playerIndex, score, extra) {
            let pid = sessionStorage.getItem(`p_id_${playerIndex}`);
            if (!pid || pid === "0") return; 

            let formData = new URLSearchParams();
            formData.append('pid', pid);
            formData.append('game', 4); // GameID 4
            formData.append('score', score); // Max. erreichte Länge
            formData.append('extra', extra); // Hier packen wir die "Stars" rein
            formData.append('ts', Date.now()); 

            fetch('/api/stats/player_save', { method: 'POST', body: formData })
                .catch(e => console.log("Fehler beim Speichern"));
        }
        // --- ENDE STATS LOGIK ---

        document.getElementById('gameContainer').addEventListener('click', function(e) {
            let btn = e.target.closest('.action-btn');
            if(btn) {
                let cmd = btn.getAttribute('data-cmd');
                if(cmd) doAction(cmd);
            }
        });

        setInterval(update, 400);
        
        function update() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                if (!data.groups || data.groups.length === 0) {
                     return;
                }
                render(data.groups); // Bugfix: Funktion heißt render(), nicht renderGroups()
            }).catch(e => {
                let cs = document.getElementById('conn-stat');
                if(cs) cs.style.opacity = 0.2;
            });
        }
        
        function render(groups) {
            let container = document.getElementById('gameContainer');
            if(container.innerHTML.includes('Loading')) container.innerHTML = '';
            
            let tLvl = getTranslation('simr_run_lvl') || "Level";
            let tDisq = getTranslation('simr_btn_disq') || "Disqualify";
            let tRej = getTranslation('simr_btn_rejoin') || "Restart";

            const TEAM_COLORS = ['#FF0000', '#0000FF', '#FFFF00'];

            // Bugfix: C++ JSON schickt keine "id", daher iterieren wir mit Index (gid)
            groups.forEach((g, gid) => {
                let teamCol = TEAM_COLORS[gid % 3]; 

                // Bugfix: Variablen an das C++ JSON anpassen
                let lvl = g.len || 0;
                let prog = g.step || 0;

                let stTxt = "UNK";
                let stCol = "#fff"; 
                let badgeBg = "var(--bg-color)";
                
                if(g.state == 0) { stTxt = getTranslation("sim_st_setup") || "SETUP"; stCol = "var(--text-muted)";}
                if(g.state == 1) { stTxt = getTranslation("sim_st_ready") || "READY"; stCol = "#ff0"; }
                if(g.state == 3) { stTxt = getTranslation("sim_st_watch") || "WATCH"; stCol = "#0af"; }
                if(g.state == 4) { stTxt = getTranslation("sim_st_turn") || "YOUR TURN"; stCol = "var(--success)"; badgeBg="#004400"; }
                if(g.state == 6) { stTxt = getTranslation("sim_st_vic") || "VICTORY"; stCol = "gold"; badgeBg="#444400"; }
                if(g.state == 7) { stTxt = getTranslation("sim_st_fail") || "FAILED"; stCol = "var(--danger)"; badgeBg="#440000"; }
                if(g.state == 5) { stTxt = getTranslation("sim_st_wait") || "WAIT"; stCol = "#fa0"; badgeBg="#442200"; }
                
                if (g.state == 3 && g.locked) {
                    stTxt = getTranslation("sim_st_mis") || "MISTAKE"; stCol = "#fff"; badgeBg="var(--danger)";
                }

                // --- STATS ABGLEICH ---
                if (g.state <= 2) {
                    savedStats[gid] = false;
                    sessionRecords[gid] = false;
                }

                if ((g.state == 6 || g.state == 7) && !savedStats[gid]) {
                    // Score = Level (bei Gewinn) oder Level-1 (bei Fail)
                    let finalScore = (g.state == 6) ? lvl : Math.max(0, lvl - 1);
                    
                    if (!personalBests[gid] || finalScore > personalBests[gid]) {
                        sessionRecords[gid] = true;
                        personalBests[gid] = finalScore;
                    }
                    
                    savedStats[gid] = true;
                    savePlayerStat(gid, finalScore, g.stars || 0);
                }
                // --- ENDE STATS ---

                let name = sessionStorage.getItem(`p_name_${gid}`) || `Group ${gid+1}`; 
                let recordIcon = sessionRecords[gid] ? " <span title='Neuer Rekord!'>📈</span>" : "";
                
                let timeStr = ""; // Bei Simon Says gibt es keine laufende Zeit pro Gruppe im Backend
                
                let seqHtml = "";
                for(let i=0; i<lvl; i++) { 
                    let col = (g.seq && g.seq[i]) ? g.seq[i] : "var(--border-color)";
                    let isDone = i <= prog;
                    let style = `background:${col};`;
                    if(isDone) style += "opacity:1; border:1px solid #fff;";
                    else style += "opacity:0.3;";
                    seqHtml += `<div class="seq-dot" style="${style}"></div>`;
                }
                
                let btnHtml = "";
                if(g.state == 0 || g.state == 6 || g.state == 7) {
                     btnHtml = `<button class="btn-primary action-btn" data-cmd="start_${gid}" style="padding:5px; font-size:0.8rem; margin-top:0;">${tRej}</button>`;
                }

                let rowId = `sr-grp-${gid}`;
                let rowEl = document.getElementById(rowId);

                if (!rowEl) {
                    container.insertAdjacentHTML('beforeend', `
                    <div id="${rowId}" class="group-card" style="border-left-color:${teamCol}">
                        <div class="g-head">
                            <div class="g-name" id="name-${gid}">${name}${recordIcon}</div>
                            <div id="time-${gid}" class="g-time">${timeStr}</div>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <span id="badge-${gid}" class="g-badge status-badge" style="color:${stCol}; background:${badgeBg}">${stTxt}</span>
                            <span style="color:var(--text-muted);">${tLvl} <span id="lvl-${gid}">${lvl}</span> / ${targetLvl}</span>
                        </div>
                        <div id="seq-${gid}" class="seq-row">${seqHtml}</div>
                        <div id="ctrl-${gid}" class="ctrl-row">${btnHtml}</div>
                    </div>`);
                } else {
                    rowEl.style.borderLeftColor = teamCol; 
                    document.getElementById(`name-${gid}`).innerHTML = `${name}${recordIcon}`;
                    
                    let badge = document.getElementById(`badge-${gid}`);
                    badge.innerText = stTxt;
                    badge.style.color = stCol;
                    badge.style.background = badgeBg;
                    
                    document.getElementById(`lvl-${gid}`).innerText = lvl;
                    document.getElementById(`seq-${gid}`).innerHTML = seqHtml;
                    document.getElementById(`ctrl-${gid}`).innerHTML = btnHtml;
                }
            });
        }
        
        function doAction(cmd) { fetch(`/api/game/action?cmd=${cmd}`); }
        function goBack() { nav('game_simon_names.html'); }
        function goHome() { doAction('exit'); setTimeout(() => nav('/'), 100); }
    </script>
</body>
</html>
