<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Test</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .timer-box { text-align: center; margin-bottom: 20px; }
        .big-time { font-size: 5rem; font-weight: bold; color: var(--text-main); font-family: 'Courier New', monospace; line-height: 1; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        
        .status-box { 
            text-align: center; margin-bottom: 20px; 
            border: 2px solid var(--border-color); background: var(--card-hover); 
            padding: 15px; border-radius: 10px;
        }
        .big-status { 
            font-size: 1.5rem; font-weight: bold; color: var(--text-main); 
            text-transform:uppercase; letter-spacing: 2px;
        }
        
        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; height: 100%; }
        
        .info-txt { text-align:center; color: var(--text-muted); margin-top: 20px; font-size: 0.9rem; line-height: 1.5; }
    </style>
</head>
<body>
    <header>
        <div class="logo">MP3 TEST</div>
    </header>

    <main>
        <div class="timer-box">
            <div class="big-time" id="timer">00:00.0</div>
        </div>

        <div class="status-box">
            <div class="big-status" id="statusText">READY</div>
        </div>

        <div class="controls">
            <button onclick="goBack()" class="btn-warn btn-ctrl">BACK</button>
            <button onclick="startTest()" class="btn-primary btn-ctrl" id="btnStart">START</button>
            <button onclick="stopTest()" class="btn-danger btn-ctrl" id="btnStop">STOP</button>
        </div>

        <div class="info-txt">
            <b>Ablauf:</b><br>
            Drücke Start. Die Stoppuhr läuft los.<br>
            Audio spielt 5 Sekunden, pausiert 3 Sekunden, spielt 5 Sekunden...
        </div>

        <audio id="testAudio" src="test.mp3" preload="auto" loop></audio>
    </main>

    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        const audio = document.getElementById('testAudio');
        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('statusText');

        let isRunning = false;
        let globalStartTime = 0;
        let cycleStartTime = 0;
        let audioState = 'stopped'; // 'playing' oder 'paused'
        let timerInterval;

        function startTest() {
            if (isRunning) return;

            // WICHTIG FÜR iOS: Play muss zwingend innerhalb dieses User-Click-Events gestartet werden!
            audio.play().then(() => {
                console.log("Audio erfolgreich gestartet (iOS Unlocked).");
            }).catch(e => {
                console.error("Audio blockiert:", e);
                statusEl.innerText = "AUDIO ERROR (Blocked)";
                statusEl.style.color = "var(--danger)";
            });

            isRunning = true;
            globalStartTime = Date.now();
            cycleStartTime = Date.now();
            audioState = 'playing';

            statusEl.innerText = "🎵 PLAYING (5s)";
            statusEl.style.color = "var(--success)";

            // Starte den Loop für Stoppuhr und Audio-Steuerung
            timerInterval = setInterval(updateLoop, 50);
        }

        function stopTest() {
            if (!isRunning) return;
            
            isRunning = false;
            clearInterval(timerInterval);

            // Audio hart stoppen und zurückspulen
            audio.pause();
            audio.currentTime = 0;
            audioState = 'stopped';

            statusEl.innerText = "STOPPED";
            statusEl.style.color = "var(--danger)";
        }

        function updateLoop() {
            let now = Date.now();
            
            // 1. Stoppuhr aktualisieren
            let elapsed = now - globalStartTime;
            timerEl.innerText = formatTime(elapsed);

            // 2. Audio State Machine (5s an, 3s aus)
            let cycleElapsed = now - cycleStartTime;

            if (audioState === 'playing' && cycleElapsed >= 5000) {
                // Nach 5 Sekunden: Pausieren
                audio.pause();
                audioState = 'paused';
                cycleStartTime = now;
                
                statusEl.innerText = "⏸️ PAUSED (3s)";
                statusEl.style.color = "var(--warning)";
                
            } else if (audioState === 'paused' && cycleElapsed >= 3000) {
                // Nach 3 Sekunden Pause: Wieder abspielen
                audio.play().catch(e => console.error("Resume failed:", e));
                audioState = 'playing';
                cycleStartTime = now;
                
                statusEl.innerText = "🎵 PLAYING (5s)";
                statusEl.style.color = "var(--success)";
            }
        }

        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let m = Math.floor(totalSec / 60);
            let s = totalSec % 60;
            let z = Math.floor((ms % 1000) / 100); 
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${z}`;
        }

        function goBack() {
            stopTest();
            location.href = '/'; 
        }
    </script>
</body>
</html>
