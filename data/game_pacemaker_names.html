<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Track - Pacemaker</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .player-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background:var(--card-bg); padding:10px; border-radius:8px; border-left: 5px solid #fff;}
        .color-box { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; transition: all 0.3s;}
        input[type=text] { flex-grow: 1; padding: 12px; font-size: 1.1rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main); }
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
        .start-badge { position: absolute; top: -15px; background: #fff; color: #000; font-size: 0.7rem; padding: 2px 5px; border-radius: 4px; font-weight:bold; z-index:10; white-space:nowrap;}
        
        .stat-icon { font-size: 1.3rem; opacity: 0.2; transition: all 0.3s; cursor: help; user-select: none; filter: grayscale(100%); margin-left: 5px; }
        .stat-icon.active { opacity: 1; filter: none; text-shadow: 0 0 8px rgba(13, 110, 253, 0.5); }
        
        .btn-icon { background:var(--card-hover); border:1px solid var(--border-color); color:var(--text-main); font-size:1.4rem; border-radius:6px; padding:0 12px; height:45px; cursor:pointer; font-weight:bold;}
        .btn-icon:hover { background:var(--primary); color:#fff; }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="pm_track_title">Build the Track</div>
    <div class="status-bar">
        <div class="status-dot dot-green" id="cnt-green">0</div>
        <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
        <div class="status-dot dot-red" id="cnt-red">0</div>
    </div>
    </header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="pm_track_loading">Analyzing Pucks...</div>
        
        <div id="content" style="display:none;">
            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span data-i18n="pm_track_layout">Streckenaufbau</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody">
                    <div style="text-align:center; width:100%;">
                        <p style="font-size:1rem; color:var(--text-main); font-weight:bold; margin-bottom:5px;" id="modeInst"></p>
                        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;" id="distHint">Achte auf einen gleichmäßigen Abstand!</p>
                        <div id="arenaContainer" style="overflow-x: auto; margin-bottom:20px; overflow-y:visible;"></div>
                    </div>
                </div>
            </div>
            
            <div id="pickerBar" style="margin-bottom:15px;">
                <button onclick="loadFromPicker()" class="btn-primary" style="font-size:1.1rem; background:var(--card-hover); border:1px dashed var(--primary); color:var(--primary);">
                    👥 <span data-i18n="pp_load_players">Load Players from List</span>
                </button>
            </div>
            
            <div id="playerList"></div>

            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="pm_btn_run">TO RUN SCREEN 🏁</button>
                <button onclick="nav('game_pacemaker_setup.html')" class="btn-back" data-i18n="btn_back">⬅ BACK</button>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script>startStatusLoop();</script>
    <script src="player_picker.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const PM_LAYOUTS = {
            4:  ["C1", "E3", "C5", "A3"], 5:  ["C1", "E2", "E4", "C5", "A3"], 6:  ["B1", "D1", "E3", "D5", "B5", "A3"],
            7:  ["B1", "D1", "E2", "E4", "D5", "B5", "A3"], 8:  ["B1", "D1", "E2", "E4", "D5", "B5", "A4", "A2"],
            9:  ["B1", "C1", "D1", "E2", "E4", "D5", "C5", "B5", "A3"], 10: ["B1", "C1", "D1", "E2", "E4", "D5", "C5", "B5", "A4", "A2"],
            11: ["B1", "C1", "D1", "E2", "E3", "E4", "D5", "C5", "B5", "A4", "A2"], 12: ["B1", "C1", "D1", "E2", "E3", "E4", "D5", "C5", "B5", "A4", "A3", "A2"]
        };
        
        let p2StartIdx = -1;
        let numGroups = parseInt(sessionStorage.getItem('pm_grp') || 1);
        let isShuttle = false; 
        
        // Zähler für dynamische Felder
        let pCounts = [1, 1];
        
        const delay = ms => new Promise(res => setTimeout(res, ms));
        
        document.addEventListener("DOMContentLoaded", () => {
            // Restore counts from session if available
            pCounts[0] = parseInt(sessionStorage.getItem('pm_g0_count') || 1);
            if(numGroups > 1) pCounts[1] = parseInt(sessionStorage.getItem('pm_g1_count') || 1);
            setTimeout(initList, 500);
        });

        function renderInputs() {
            let html = '';
            for(let g=0; g<numGroups; g++) {
                let col = (g===0) ? '#00FF00' : '#FF00FF';
                html += `<div class="card" style="margin-bottom:15px; padding:15px;">
                            <h4 style="color:${col}; margin:0 0 10px 0;">Gruppe ${g+1}</h4>`;
                
                for(let p=0; p<pCounts[g]; p++) {
                    let pName = sessionStorage.getItem(`pm_g${g}_name_${p}`) || '';
                    let pId = sessionStorage.getItem(`pm_g${g}_id_${p}`) || '0';
                    let statClass = (pId !== "0") ? "active" : "";
                    
                    let btn = (p===0) ? `<button class="btn-icon" onclick="addPlayer(${g})">+</button>` : `<button class="btn-icon" onclick="remPlayer(${g}, ${p})">-</button>`;

                    html += `<div class="player-row" style="border-left-color:${col}">
                        <div class="color-box" id="cb_${g}_${p}" style="background:${col}; box-shadow:0 0 10px ${col}"></div>
                        <input type="text" id="name_${g}_${p}" value="${pName}" placeholder="Player Name" oninput="saveName(${g}, ${p}); clearPlayerId(${g}, ${p})">
                        <span class="stat-icon ${statClass}" id="stat_icon_${g}_${p}">📊</span>
                        ${btn}
                    </div>`;
                }
                html += `</div>`;
            }
            document.getElementById('playerList').innerHTML = html;
        }

        function saveName(g, p) {
            sessionStorage.setItem(`pm_g${g}_name_${p}`, document.getElementById(`name_${g}_${p}`).value);
        }

        function clearPlayerId(g, p) {
            sessionStorage.setItem(`pm_g${g}_id_${p}`, 0);
            let icon = document.getElementById(`stat_icon_${g}_${p}`);
            if(icon) { icon.classList.remove('active'); icon.title = "Gastspieler (Keine Statistik)"; }
        }

        function addPlayer(g) {
            pCounts[g]++;
            sessionStorage.setItem(`pm_g${g}_count`, pCounts[g]);
            renderInputs();
        }

        function remPlayer(g, pIndex) {
            // Shift alle nachrückenden Spieler in der Session eins nach oben
            for(let i=pIndex; i<pCounts[g]-1; i++) {
                sessionStorage.setItem(`pm_g${g}_name_${i}`, sessionStorage.getItem(`pm_g${g}_name_${i+1}`) || "");
                sessionStorage.setItem(`pm_g${g}_id_${i}`, sessionStorage.getItem(`pm_g${g}_id_${i+1}`) || "0");
            }
            pCounts[g]--;
            sessionStorage.setItem(`pm_g${g}_count`, pCounts[g]);
            renderInputs();
        }

        function loadFromPicker() {
            let total = pCounts[0] + (numGroups > 1 ? pCounts[1] : 0);
            openPlayerPicker(total, function(selected) {
                let selIdx = 0;
                for(let g=0; g<numGroups; g++) {
                    for(let p=0; p<pCounts[g]; p++) {
                        if(selIdx < selected.length) {
                            let pl = selected[selIdx++];
                            let inp = document.getElementById(`name_${g}_${p}`);
                            if (inp) {
                                inp.value = pl.name;
                                sessionStorage.setItem(`pm_g${g}_name_${p}`, pl.name);
                            }
                            sessionStorage.setItem(`pm_g${g}_id_${p}`, pl.id);
                            let icon = document.getElementById(`stat_icon_${g}_${p}`);
                            if(icon) { icon.classList.add('active'); icon.title = "Statistik wird gespeichert"; }
                        }
                    }
                }
            });
        }

        async function initList() {
            try {
                await fetch('/api/game/load?id=18');
                let pace = sessionStorage.getItem('pm_pace') || 150;
                let dist = sessionStorage.getItem('pm_dist') || 10;
                let dur = sessionStorage.getItem('pm_dur') || 120;
                let shut = sessionStorage.getItem('pm_shut') || 0;
                let hold = sessionStorage.getItem('pm_hold') || 1;
                let inpt = sessionStorage.getItem('pm_inpt') || 0;
                let lapt = sessionStorage.getItem('pm_lapt') || 60;

                await fetch(`/api/game/action?cmd=cfg_pace&val=${pace}`);
                await fetch(`/api/game/action?cmd=cfg_dist&val=${dist}`);
                await fetch(`/api/game/action?cmd=cfg_dur&val=${dur}`);
                await fetch(`/api/game/action?cmd=cfg_shut&val=${shut}`);
                await fetch(`/api/game/action?cmd=cfg_hold&val=${hold}`);
                await fetch(`/api/game/action?cmd=cfg_inpt&val=${inpt}`);
                await fetch(`/api/game/action?cmd=cfg_lapt&val=${lapt}`);
                await fetch(`/api/game/action?cmd=cfg_grp&val=${numGroups}`);
                await fetch('/api/game/action?cmd=setup');
                await fetch('/api/game/action?cmd=show_track'); 
                
                let res = await fetch('/api/status');
                let data = await res.json();
                let pCount = data.filter(p => p.active).length;
                
                if(pCount < 4) {
                    let errTxt = (typeof getTranslation === 'function') ? getTranslation('pm_track_err') : 'Zu wenige Pucks!';
                    document.getElementById('loading').innerHTML = `<span style='color:var(--danger)'>${errTxt}</span>`;
                    return;
                }
                
                p2StartIdx = Math.floor(pCount / 2);
                isShuttle = shut === '1'; 
                let isLapMode = inpt === '1';
                let distTxt = (dist && !isLapMode) ? ` (${dist}m)` : "";
                
                let tShuttle = (typeof getTranslation === 'function') ? getTranslation('pm_inst_shuttle') : "Shuttle Lauf";
                let tCircle = (typeof getTranslation === 'function') ? getTranslation('pm_inst_circle') : "Rundkurs";
                let tDistHint = (typeof getTranslation === 'function') ? getTranslation('pm_inst_dist') : "Achte auf einen gleichmäßigen Abstand";
                
                document.getElementById('modeInst').innerHTML = isShuttle ? (tShuttle || "Shuttle Lauf") : (tCircle || "Rundkurs");
                document.getElementById('distHint').innerHTML = tDistHint + distTxt + ".";
                
                let tableHtml = `<table class="arena-table">`;
                const cols = ['A', 'B', 'C', 'D', 'E'];
                for(let r = 1; r <= 5; r++) {
                    tableHtml += `<tr>`;
                    for(let c = 0; c < 5; c++) tableHtml += `<td id="cell-${cols[c]}${r}"></td>`;
                    tableHtml += `</tr>`;
                }
                tableHtml += `</table>`;
                document.getElementById('arenaContainer').innerHTML = tableHtml;

                let activeLayout = [];
                if (isShuttle) activeLayout = ["A1", "A2", "A3", "A4", "A5", "C1", "C2", "C3", "C4", "C5", "E1", "E2"];
                else activeLayout = PM_LAYOUTS[pCount] || PM_LAYOUTS[12];

                for(let i = 0; i < pCount && i < activeLayout.length; i++) {
                    let coord = activeLayout[i];
                    let cell = document.getElementById(`cell-${coord}`);
                    let startHtml = "";
                    if(i === 0) startHtml = `<div class="start-badge">START 1</div>`;
                    if(!isShuttle && numGroups === 2 && i === p2StartIdx) startHtml = `<div class="start-badge" style="background:var(--warning)">START 2</div>`;
                    if(cell) cell.innerHTML = `<div class="puck-icon" id="puck_vis_${i}">${startHtml}${i+1}</div>`;
                }

                renderInputs();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                setInterval(pollPuckEffects, 1500);

            } catch (error) { console.error("Fehler:", error); }
        }

        async function pollPuckEffects() {
            try {
                let r = await fetch('/api/effects');
                let data = await r.json();
                data.forEach(eff => {
                    const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                    
                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                        if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                        if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                        if(eff.eff == 9) vis.classList.add('eff-rainbow');
                        
                        if(eff.eff == 18) {
                            let percent = Math.round(eff.dur / 2.55);
                            vis.style.background = `conic-gradient(${rgb} ${percent}%, var(--border-color) ${percent}%)`;
                            vis.style.border = `2px solid ${rgb}`;
                        } else {
                            vis.style.background = rgb;
                            vis.style.border = `2px solid #fff`;
                        }
                        vis.style.boxShadow = `0 0 15px ${rgb}`;
                    }

                    // Synce die Farben auf die dynamischen Boxen
                    if(eff.id === 0) {
                        for(let p=0; p<pCounts[0]; p++) {
                            let cb = document.getElementById(`cb_0_${p}`);
                            if(cb) { cb.style.background = rgb; cb.style.boxShadow = `0 0 10px ${rgb}`; }
                        }
                    }
                    if(!isShuttle && numGroups === 2 && eff.id === p2StartIdx) {
                        for(let p=0; p<pCounts[1]; p++) {
                            let cb = document.getElementById(`cb_1_${p}`);
                            if(cb) { cb.style.background = rgb; cb.style.boxShadow = `0 0 10px ${rgb}`; }
                        }
                    }
                });
            } catch(e) {}
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }

        function startGame() {
            // Namen sind dank oninput bereits im sessionStorage.
            setTimeout(() => { nav('game_pacemaker_run.html'); }, 200);
        }
    </script>
</body>
</html>
