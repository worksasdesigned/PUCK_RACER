<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Names - RLGL</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .player-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background:var(--card-bg); padding:10px; border-radius:8px; border-left:5px solid #fff;}
        .color-box { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; transition: all 0.3s;}
        input[type=text] { flex-grow: 1; padding: 12px; font-size: 1.1rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main); }
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="rg_names_title">Groups Setup</div>
    <div class="status-bar">
        <div class="status-dot dot-green" id="cnt-green">0</div>
        <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
        <div class="status-dot dot-red" id="cnt-red">0</div>
    </div>
    </header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initializing...</div>
        
        <div id="content" style="display:none;">
            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span>Streckenaufbau</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody" style="flex-direction: column; align-items: center; gap: 20px;">
                    <p style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin:0;">
                        Die Läufer starten auf der Linie A. Baue die Pucks in Linie E auf.
                    </p>
                    <div id="arenaContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;"></div>
                </div>
            </div>

            <div style="margin-bottom:15px;">
                <button onclick="loadFromPicker()" class="btn-primary" style="font-size:1.1rem; background:var(--card-hover); border:1px dashed var(--primary); color:var(--primary);">
                    👥 <span data-i18n="pp_load_players">Load Players from List</span>
                </button>
            </div>
            
            <div id="playerList" class="card"></div>
            
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <button onclick="start()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game">START GAME 🏁</button>
                <button onclick="nav('game_redgreen_setup.html')" class="btn-back" data-i18n="btn_back">⬅ BACK</button>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script>startStatusLoop();</script>
    <script src="player_picker.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const COLORS = ['blue','magenta','cyan','orange','purple','pink','turquoise','white','lime','yellow'];
        
        const RG_LAYOUTS = {
            1: ["E3"], 2: ["E2","E3"], 3: ["E2","E3","E4"], 4: ["E1","E2","E3","E4"], 5: ["E1","E2","E3","E4","E5"]
        };
        let grps = parseInt(sessionStorage.getItem('rg_groups')||1);
        
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initList, 500);
        });

        async function initList() {
            try {
                await fetch('/api/game/load?id=9');

                grps = parseInt(sessionStorage.getItem('rg_groups') || 1);
                let speed = parseInt(sessionStorage.getItem('rg_speed') || 50);
                let time = parseInt(sessionStorage.getItem('rg_time') || 120);

                await fetch(`/api/game/action?cmd=cfg_groups&val=${grps}`);
                await fetch(`/api/game/action?cmd=cfg_speed&val=${speed}`);
                await fetch(`/api/game/action?cmd=cfg_time&val=${time}`);
                await fetch('/api/game/action?cmd=setup');

                // Pucks per Gruppe via Round-Robin zuweisen (spiegelt Backend-Logik exakt)
                let res = await fetch('/api/status');
                let data = await res.json();
                let activePucks = data.filter(p => p.active);

                let groupPucks = [];
                for (let g = 0; g < grps; g++) groupPucks[g] = [];
                activePucks.forEach((puck, idx) => {
                    groupPucks[idx % grps].push(puck);
                });

                let maxPpg = Math.max(...groupPucks.map(g => g.length));

                let arenaContainer = document.getElementById('arenaContainer');
                let listContainer = document.getElementById('playerList');
                arenaContainer.innerHTML = "";
                listContainer.innerHTML = "";

                let layoutKey = [1, 2, 3, 4, 5].find(n => n >= maxPpg) || 5;
                let activeLayout = RG_LAYOUTS[layoutKey];

                for(let i=0; i<grps; i++) {
                    let n = sessionStorage.getItem(`p_name_${i}`) || `Group ${i+1}`;
                    let colorName = COLORS[i % COLORS.length];

                    // 1. Liste aufbauen
                    listContainer.innerHTML += `
                    <div class="player-row" style="border-color:${colorName}">
                        <div class="color-box" id="cb_${i}" style="background:${colorName}; box-shadow:0 0 10px ${colorName}"></div>
                        <input type="text" id="name_${i}" value="${n}" placeholder="Name">
                    </div>`;

                    // 2. Arena aufbauen
                    let tableHtml = `<div><h4 style="margin:0 0 10px 0; text-align:center; color:${colorName}">Group ${i+1}</h4><table class="arena-table">`;
                    const cols = ['A', 'B', 'C', 'D', 'E'];
                    for(let r = 1; r <= 5; r++) {
                        tableHtml += `<tr>`;
                        for(let c = 0; c < 5; c++) {
                            tableHtml += `<td id="cell-${i}-${cols[c]}${r}"></td>`;
                        }
                        tableHtml += `</tr>`;
                    }
                    tableHtml += `</table></div>`;
                    arenaContainer.innerHTML += tableHtml;
                }

                // 3. Pucks & Läufer in Arenen einsetzen
                for(let i=0; i<grps; i++) {
                    let colorName = COLORS[i % COLORS.length];

                    // Läufer immer in A1 bis A5
                    for(let r=1; r<=5; r++) {
                        let cellRun = document.getElementById(`cell-${i}-A${r}`);
                        if(cellRun) cellRun.innerHTML = `<div style="font-size:1.5rem; display:inline-block;">🏃‍♂️</div>`;
                    }

                    // Pucks in E-Reihe (Round-Robin Zuweisung wie Backend)
                    for(let p = 0; p < groupPucks[i].length && p < activeLayout.length; p++) {
                        let coord = activeLayout[p];
                        let cell = document.getElementById(`cell-${i}-${coord}`);
                        let actualPuckId = groupPucks[i][p].id;
                        if(cell) {
                            cell.innerHTML = `<div class="puck-icon" id="puck_vis_${actualPuckId}" style="background:${colorName}">${p+1}</div>`;
                        }
                    }
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                setInterval(pollPuckEffects, 1500);
            } catch (e) { console.error(e); }
        }

        async function pollPuckEffects() {
            try {
                let r = await fetch('/api/effects');
                let data = await r.json();
                data.forEach(eff => {
                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                        vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                        if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                        if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                        if(eff.eff == 9) vis.classList.add('eff-rainbow');
                        
                        if(eff.eff == 18) {
                            let percent = Math.round(eff.dur / 2.55);
                            vis.style.background = `conic-gradient(${rgb} ${percent}%, var(--border-color) ${percent}%)`;
                            vis.style.border = `2px solid ${rgb}`;
                        } else {
                            vis.style.background = rgb;
                            vis.style.border = `2px solid #fff`;
                        }
                        vis.style.boxShadow = `0 0 15px ${rgb}`;
                    }
                });
            } catch(e) {}
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }

        function loadFromPicker() {
            openPlayerPicker(grps, function(selected) {
                selected.forEach((p, i) => {
                    let inp = document.getElementById('name_' + i);
                    if (inp) { inp.value = p.name; sessionStorage.setItem('p_name_' + i, p.name); }
                });
            });
        }

        function start() {
            for(let i=0; i<grps; i++) sessionStorage.setItem(`p_name_${i}`, document.getElementById(`name_${i}`).value);
            nav('game_redgreen_run.html');
        }
    </script>
</body>
</html>
