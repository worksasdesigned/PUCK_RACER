<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Prellen Live</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-info { background: var(--card-bg); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px; border: 1px solid var(--border-color);}
        .big-time { font-size: 4rem; font-family: monospace; color: var(--text-main); font-weight: bold;}
        .target-time { font-size: 0.9rem; color: var(--text-muted); font-weight: normal; margin-top: 5px;}

        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; }

        .grp-row { display: flex; align-items: center; justify-content: space-between; background: var(--card-hover); padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color); border-left: 5px solid #fff; transition: box-shadow 0.2s; }
        
        .grp-info { display: flex; flex-direction: column; width: 30%; }
        .grp-name { font-weight: bold; font-size: 1.1rem; color:var(--text-main); }
        .grp-score { font-family: monospace; font-size: 2rem; color: var(--text-main); font-weight: bold;}
        
        .grp-btns { display: flex; gap: 5px; width: 45%; justify-content: center; }
        .btn-mini { padding: 10px; font-size: 0.85rem; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; color: white; width: 48%; }
        .btn-mini-start { background: var(--success); color: #000; }
        .btn-mini-stop { background: var(--danger); color: #fff; }
        .btn-mini:active { transform: scale(0.9); }

        .grp-time { font-family: monospace; font-size: 1.2rem; color: var(--text-muted); width: 25%; text-align: right; }
        .bottom-nav { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_ball">Ball Prellen 🏀</div>
     <div class="status-bar">
    <div class="status-dot dot-green" id="cnt-green">0</div>
    <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
    <div class="status-dot dot-red" id="cnt-red">0</div>
</div>
    </header>

    <main>
        <div class="top-info">
            <div style="color:var(--text-muted); font-size:0.9rem; text-transform:uppercase;" data-i18n="bal_run_global">Global Elapsed Time</div>
            <div class="big-time" id="globalTime">00:00</div>
            <div class="target-time" id="targetInfo" data-i18n="bal_run_target">Target: --:--</div>
        </div>

        <div class="controls">
            <button onclick="goBack()" class="btn-warn btn-ctrl" data-i18n="btn_back">⬅</button>
            <button onclick="doAction('start')" class="btn-primary btn-ctrl" id="btnStart" data-i18n="btn_start_all">START ALL</button>
            <button onclick="doAction('stop')" class="btn-danger btn-ctrl" data-i18n="btn_stop_all">STOP ALL</button>
        </div>

        <div id="groupList"></div>

        <div class="bottom-nav">
            <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
<script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        const COLORS = ['#FF0000', '#0000FF', '#00FF00', '#FFFF00', '#FF00FF', '#00FFFF'];
        
        document.getElementById('groupList').addEventListener('click', function(e) {
            let btn = e.target.closest('.btn-mini');
            if(btn) {
                let cmd = btn.getAttribute('data-cmd');
                if(cmd) fetch(`/api/game/action?cmd=${cmd}`);
            }
        });

        setInterval(update, 400); 

        function update() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                 
                render(data);
            }).catch(e => {});
        }

        function formatTime(ms) {
            let sec = Math.floor(ms / 1000); 
            let m = Math.floor(sec / 60);
            let s = sec % 60;
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function render(data) {
            document.getElementById('globalTime').innerText = formatTime(data.gT);
            
            let lm = Math.floor(data.lim / 1000 / 60);
            let ls = Math.floor(data.lim / 1000) % 60;
            document.getElementById('targetInfo').innerText = `${getTranslation('bal_run_target')} ${lm}m ${ls.toString().padStart(2,'0')}s`;
            
            let btn = document.getElementById('btnStart');
            if (data.st === 0 || data.st === 3) { 
                btn.innerText = (data.st === 3) ? getTranslation('btn_reset') : getTranslation('btn_start_all'); 
                btn.style.background = "var(--primary)"; 
            } else { 
                btn.innerText = getTranslation('btn_running'); 
                btn.style.background = "var(--card-hover)"; 
            }

            renderGroups(data);
        }

        function renderGroups(data) {
            let container = document.getElementById('groupList');
            if (!data.grps) return;

            data.grps.forEach((g) => {
                if(g.act === 0) return;
                
                let rowId = `grp-${g.id}`;
                let rowEl = document.getElementById(rowId);
                let col = COLORS[g.id];

                if (!rowEl) {
                    container.insertAdjacentHTML('beforeend', `
                    <div id="${rowId}" class="grp-row" style="border-left-color:${col}">
                        <div class="grp-info">
                            <div class="grp-name" style="color:${col}">Group ${g.id+1}</div>
                            <div class="grp-score" id="sc-${g.id}">${g.sc}</div>
                        </div>
                        <div class="grp-btns">
                            <button class="btn-mini btn-mini-start" data-cmd="g_start&val=${g.id}">${getTranslation('btn_start')}</button>
                            <button class="btn-mini btn-mini-stop" data-cmd="g_stop&val=${g.id}">${getTranslation('btn_stop')}</button>
                        </div>
                        <div class="grp-time" id="t-${g.id}">00:00</div>
                    </div>`);
                } else {
                    document.getElementById(`sc-${g.id}`).innerText = g.sc;
                    document.getElementById(`t-${g.id}`).innerText = formatTime(g.t);
                    
                    if (g.st === 2) rowEl.style.boxShadow = `0 0 10px ${col}40`; 
                    else if (g.st === 4) rowEl.style.boxShadow = `0 0 10px rgba(255, 170, 0, 0.4)`; 
                    else rowEl.style.boxShadow = "none";
                }
            });
        }

        function doAction(cmd) { fetch(`/api/game/action?cmd=${cmd}`); }
        function goBack() { doAction('reset'); location.href = 'game_ball_setup.html'; }
        function goHome() { fetch('/api/game/action?cmd=exit').then(() => location.href = '/'); }
    </script>
</body>
</html>
