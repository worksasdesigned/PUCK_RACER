<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Setup - Target Touch</title>
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        .mode-tabs { display:flex; gap:10px; margin-bottom:15px; }
        .mode-tab { flex:1; padding:10px; text-align:center; background:var(--bg-color); border-radius:6px; cursor:pointer; font-weight:bold; border:2px solid transparent;}
        .mode-tab.active { background: var(--primary); color:white; border-color:#fff;}
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="g_target">Target Touch 🎯</div></header>
    <main>
        <div class="card">
            <h3 data-i18n="tgt_setup_target">🎯 Game Target</h3>
            <div class="mode-tabs">
                <div id="tabTime" class="mode-tab active" onclick="setMode(0)" data-i18n="tgt_tab_time">⏱️ Time</div>
                <div id="tabRounds" class="mode-tab" onclick="setMode(1)" data-i18n="tgt_tab_rounds">🔄 Rounds</div>
            </div>
            
            <div id="boxTime">
                <div class="slider-header">
                    <span data-i18n="lbl_time_limit">Time Limit:</span>
                    <span id="timeDisp" class="slider-val">2m 00s</span>
                </div>
                <input type="range" id="timeSlider" min="3" max="60" value="12" oninput="updateTime()">
            </div>
            
            <div id="boxRounds" style="display:none;">
                <div class="slider-header">
                    <span data-i18n="tgt_lbl_target_rnd">Target Rounds:</span>
                    <span id="rndDisp" class="slider-val">30</span>
                </div>
                <input type="range" id="rndSlider" min="1" max="200" value="30" oninput="updateRounds()">
            </div>
        </div>

        <div class="card">
            <h3 data-i18n="tgt_setup_pause">⏱️ Pause Delay</h3>
            <div class="slider-header">
                <span data-i18n="tgt_lbl_delay">Delay before next Puck:</span>
                <span id="delayDisp" class="slider-val">2.0s</span>
            </div>
            <input type="range" id="delaySlider" min="0" max="60" value="4" oninput="updateDelay()">
        </div>

        <div class="card">
            <h3 data-i18n="tgt_setup_pucks">👥 Pucks & Groups</h3>
            <div class="slider-header">
                <span data-i18n="tgt_lbl_pucks_grp">Pucks per Group:</span>
                <span id="puckDisp" class="slider-val">3</span>
            </div>
            <input type="range" id="puckSlider" min="2" max="10" value="3" oninput="calcPucks()">
            
            <div class="slider-header" style="margin-top:15px;">
                <span data-i18n="tgt_lbl_num_grp">Number of Groups:</span>
                <span id="grpDisp" class="slider-val">1</span>
            </div>
            <input type="range" id="grpSlider" min="1" max="5" value="1" oninput="calcPucks()">
            <p id="puckInfo" class="info-txt" data-i18n="loading">Loading...</p>
        </div>

        <div class="card">
            <h3 data-i18n="tgt_setup_rules">⚙️ Rules</h3>
            <div class="toggle-row">
                <span data-i18n="tgt_lbl_seq">Sequence Mode</span>
                <select id="selSeq" style="width:50%; margin-top:0;">
                    <option value="0" data-i18n="tgt_opt_random">Random 🎲</option>
                    <option value="1" data-i18n="tgt_opt_seq">Sequence (1,2,3...)</option>
                </select>
            </div>
            <div class="toggle-row">
                <span data-i18n="tgt_lbl_grpstart">Group Start (Hold Start Puck)</span>
                <label class="switch">
                    <input type="checkbox" id="chkGroupStart">
                    <span class="slider-bg"></span>
                </label>
            </div>
        </div>

        <button id="btnNext" onclick="nextStep()" class="btn-primary" style="font-size:1.5rem; margin-top:20px;" data-i18n="btn_next">NEXT ➡</button>
        <button onclick="cancelSetup()" class="btn-back" style="margin-top:20px;" data-i18n="btn_cancel">Cancel</button>
    </main>

    <script src="lang.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        let connectedPucks = 0;
        let currentMode = 0;

        fetch('/api/game/load?id=15'); 
        fetch('/api/status').then(r=>r.json()).then(data => {
            connectedPucks = data.filter(p => p.active).length;
            calcPucks(); 
        });

        function setMode(m) {
            currentMode = m;
            document.getElementById('tabTime').className = (m === 0) ? "mode-tab active" : "mode-tab";
            document.getElementById('tabRounds').className = (m === 1) ? "mode-tab active" : "mode-tab";
            document.getElementById('boxTime').style.display = (m === 0) ? "block" : "none";
            document.getElementById('boxRounds').style.display = (m === 1) ? "block" : "none";
        }

        function updateTime() {
            let val = parseInt(document.getElementById('timeSlider').value) * 10;
            let m = Math.floor(val / 60);
            let s = val % 60;
            document.getElementById('timeDisp').innerText = `${m}m ${s.toString().padStart(2,'0')}s`;
            return val;
        }

        function updateRounds() {
            let val = parseInt(document.getElementById('rndSlider').value);
            if (val > 25 && val <= 100) val = Math.round(val / 5) * 5;
            else if (val > 100) val = Math.round(val / 10) * 10;
            document.getElementById('rndSlider').value = val;
            document.getElementById('rndDisp').innerText = val;
            return val;
        }

        function updateDelay() {
            let val = parseInt(document.getElementById('delaySlider').value) * 0.5;
            document.getElementById('delayDisp').innerText = val.toFixed(1) + "s";
            return val;
        }

        function calcPucks() {
            let pGrp = parseInt(document.getElementById('puckSlider').value);
            let nGrp = parseInt(document.getElementById('grpSlider').value);
            document.getElementById('puckDisp').innerText = pGrp;
            document.getElementById('grpDisp').innerText = nGrp;
            
            let needed = pGrp * nGrp;
            let infoEl = document.getElementById('puckInfo');
            let btn = document.getElementById('btnNext');

            infoEl.innerHTML = `${getTranslation('req_pucks')} ${needed} | ${getTranslation('conn_pucks')} ${connectedPucks}`;
            if (needed > connectedPucks) {
                infoEl.classList.add('warn-txt');
                btn.style.opacity = 0.5;
            } else {
                infoEl.classList.remove('warn-txt');
                btn.style.opacity = 1;
            }
        }

        function nextStep() {
            let pGrp = parseInt(document.getElementById('puckSlider').value);
            let nGrp = parseInt(document.getElementById('grpSlider').value);
            if (pGrp * nGrp > connectedPucks) {
                if(!confirm("Not enough pucks connected! Continue anyway?")) return;
            }
            
            sessionStorage.setItem('targ_groups', nGrp);
            sessionStorage.setItem('targ_pucks', pGrp);
            sessionStorage.setItem('targ_mode', currentMode);
            sessionStorage.setItem('targ_time', updateTime());
            sessionStorage.setItem('targ_rounds', updateRounds());
            sessionStorage.setItem('targ_delay', updateDelay());
            sessionStorage.setItem('targ_seq', document.getElementById('selSeq').value);
            sessionStorage.setItem('targ_grpstart', document.getElementById('chkGroupStart').checked ? 1 : 0);
            location.href = 'game_target_names.html';
        }

        function cancelSetup() {
            fetch('/api/game/action?cmd=exit').then(() => location.href = '/').catch(() => location.href = '/');
        }
    </script>
    <script>
    window.TRAINING_FIELDS = [
        { key:'mode',          get:function(){return currentMode;}, set:function(v){setMode(parseInt(v));} },
        { key:'timeSlider',    el:'timeSlider' },
        { key:'rndSlider',     el:'rndSlider' },
        { key:'delaySlider',   el:'delaySlider' },
        { key:'puckSlider',    el:'puckSlider' },
        { key:'grpSlider',     el:'grpSlider' },
        { key:'selSeq',        el:'selSeq',        type:'select' },
        { key:'chkGroupStart', el:'chkGroupStart', type:'check' }
    ];
    </script>
    <script src="training_config.js"></script>
</body>
</html>
