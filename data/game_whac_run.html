<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Whac-A-Mole Live</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-info { background: var(--card-bg); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px; border: 1px solid var(--border-color);}
        .big-time { font-size: 4.5rem; font-family: monospace; color: var(--text-main); font-weight: bold; line-height:1;}
        .status-txt { font-size: 1.2rem; color: var(--warning); text-transform: uppercase; margin-top:5px; font-weight:bold;}

        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; }

        .target-bar { background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; margin-bottom: 15px; font-weight: bold; color: var(--text-muted); }
        .tgt-dot { display: inline-block; width: 18px; height: 18px; border-radius: 50%; margin: 0 5px; border: 1px solid #fff; vertical-align: middle; box-shadow: 0 0 8px rgba(255,255,255,0.3);}

        .grp-card { background: var(--card-hover); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; border-left: 5px solid #444; transition: box-shadow 0.2s;}
        .grp-title { font-weight: bold; font-size: 1.3rem; color: var(--text-main); margin-bottom: 5px; }
        
        .score-box { text-align: center; background: var(--bg-color); border-radius: 6px; padding: 10px; min-width: 70px;}
        .score-val { font-size: 2.2rem; font-weight: bold; color: var(--success); font-family: monospace; line-height: 1;}
        .score-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;}
        
        .miss-val { font-size: 2.2rem; font-weight: bold; color: var(--danger); font-family: monospace; line-height: 1;}
        
        .avg-box { text-align: center; background: var(--bg-color); border-radius: 6px; padding: 10px; min-width: 80px; border: 1px solid var(--primary);}
        .avg-val { font-size: 1.8rem; font-weight: bold; color: var(--primary); font-family: monospace; line-height: 1;}

        .bottom-nav { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_whac">Whac-A-Mole 🔨</div>
     <div class="status-bar">
    <div class="status-dot dot-green" id="cnt-green">0</div>
    <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
    <div class="status-dot dot-red" id="cnt-red">0</div>
</div>
    </header>

    <main>
        <div class="top-info">
            <div class="big-time" id="globalTime">00:00</div>
            <div class="status-txt" id="stateInfo">WAITING</div>
        </div>

        <div class="controls">
            <button onclick="goBack()" class="btn-warn btn-ctrl" data-i18n="btn_back">⬅</button>
            <button onclick="doAction('start')" class="btn-primary btn-ctrl" id="btnStart" data-i18n="btn_start">START</button>
            <button onclick="doAction('stop')" class="btn-danger btn-ctrl" data-i18n="btn_stop">STOP</button>
        </div>

        <div class="target-bar" id="targetColorsBox">Target Colors: Loading...</div>

        <div id="groupList"></div>

        <div class="bottom-nav">
            <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
<script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        const GAME_COLORS = ['#FF0000', '#0000FF', '#00FF00', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#FF1493', '#800080', '#00FF7F'];
        const ARENA_COLORS_HEX = ['#800080', '#00FFFF', '#FFA500'];
        
        let tgtMask = parseInt(sessionStorage.getItem('whac_tgt_mask') || 1);
        let numCol = parseInt(sessionStorage.getItem('whac_col') || 2);
        
        let tgtHtml = getTranslation('whac_run_target');
        if (numCol === 1) {
            tgtHtml += `<span class='tgt-dot' style='background:#FF0000;'></span> <span style="font-size:0.8rem; font-weight:normal;">${getTranslation('whac_run_single')}</span>`;
        } else {
            for(let i=0; i<numCol; i++) {
                if(tgtMask & (1<<i)) {
                    tgtHtml += `<span class="tgt-dot" style="background:${GAME_COLORS[i]};"></span>`;
                }
            }
        }
        document.getElementById('targetColorsBox').innerHTML = tgtHtml;

        setInterval(update, 400); 

        function update() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                 
                render(data);
            }).catch(e => {});
        }

        function formatTime(ms) {
            let sec = Math.ceil(ms / 1000); 
            let m = Math.floor(sec / 60);
            let s = sec % 60;
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function render(data) {
            document.getElementById('globalTime').innerText = formatTime(data.gT);
            
            let stTxt = getTranslation(`whac_st_${data.st}`);
            let stCol = "var(--text-muted)";
            if (data.st >= 2 && data.st <= 3) stCol = "var(--warning)"; 
            if (data.st === 4) stCol = "var(--success)"; 
            if (data.st >= 5) stCol = "gold"; 
            
            let infoEl = document.getElementById('stateInfo');
            infoEl.innerText = stTxt;
            infoEl.style.color = stCol;
            
            let btn = document.getElementById('btnStart');
            if (data.st <= 1 || data.st >= 5) { 
                btn.innerText = (data.st >= 5) ? getTranslation('btn_reset') : getTranslation('btn_start'); 
                btn.style.background = "var(--primary)"; 
            } else { 
                btn.innerText = getTranslation('btn_running'); 
                btn.style.background = "var(--card-bg)"; 
            }

            renderGroups(data);
        }

        function renderGroups(data) {
            let container = document.getElementById('groupList');
            if (!data.grps) return;
            
            let lblHits = getTranslation('whac_run_hits');
            let lblMiss = getTranslation('whac_run_miss');
            let lblH10 = getTranslation('whac_run_h10');

            data.grps.forEach((g) => {
                if(g.act === 0) return;
                
                let rowId = `grp-${g.id}`;
                let rowEl = document.getElementById(rowId);
                let aName = sessionStorage.getItem(`whac_aname_${g.id}`) || `Arena ${g.id+1}`;
                let h10Formatted = (g.h10 / 10).toFixed(1);

                if (!rowEl) {
                    container.insertAdjacentHTML('beforeend', `
                    <div id="${rowId}" class="grp-card" style="border-left-color:${ARENA_COLORS_HEX[g.id]}">
                        <div class="grp-title">${aName}</div>
                        <div style="display:flex; gap:8px;">
                            <div class="score-box">
                                <div class="score-val" id="sc-${g.id}">${g.sc}</div>
                                <div class="score-lbl">${lblHits}</div>
                            </div>
                            <div class="score-box">
                                <div class="miss-val" id="ms-${g.id}">${g.m}</div>
                                <div class="score-lbl">${lblMiss}</div>
                            </div>
                            <div class="avg-box">
                                <div class="avg-val" id="h10-${g.id}">${h10Formatted}</div>
                                <div class="score-lbl">${lblH10}</div>
                            </div>
                        </div>
                    </div>`);
                } else {
                    document.getElementById(`sc-${g.id}`).innerText = g.sc;
                    document.getElementById(`ms-${g.id}`).innerText = g.m;
                    document.getElementById(`h10-${g.id}`).innerText = h10Formatted;
                    
                    if (data.st === 4) rowEl.style.boxShadow = `0 0 10px rgba(0,255,0,0.2)`; 
                    else rowEl.style.boxShadow = "none";
                }
            });
        }

        function doAction(cmd) { fetch(`/api/game/action?cmd=${cmd}`); }
        function goBack() { doAction('reset'); location.href = 'game_whac_names.html'; }
        function goHome() { fetch('/api/game/action?cmd=exit').then(() => location.href = '/'); }
    </script>
</body>
</html>
