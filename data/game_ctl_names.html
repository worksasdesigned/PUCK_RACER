<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Catch the Light Pro Aufbau - PuckRacer</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
        .stat-icon { font-size: 1.3rem; opacity: 0.2; transition: all 0.3s; cursor: help; user-select: none; filter: grayscale(100%); margin-left: 10px; }
        .stat-icon.active { opacity: 1; filter: none; text-shadow: 0 0 8px rgba(13, 110, 253, 0.5); }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="ctl_names_title">Catch the Light Pro</div>
    </header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initialisierung...</div>
        
        <div id="content" style="display:none;">
            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span data-i18n="bat_layout_title">Puck-Wandaufbau</span>
                    <span id="toggleIcon">▼</span>
                </div>
                
                <div class="layout-body" id="layoutBody">
                    <div style="text-align:center; width:100%;">
                        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;" data-i18n="bat_layout_desc">
                            Befestige die Pucks im angezeigten Muster an der Wand.
                        </p>
                        <div id="arenaContainer" style="overflow-x: auto;"></div>
                    </div>
                </div>
            </div>

            <div id="pickerBar" style="margin-top:15px; margin-bottom:15px;">
                <button onclick="loadFromPicker()" class="btn-primary" style="font-size:1.1rem; background:var(--card-hover); border:1px dashed var(--primary); color:var(--primary);" data-i18n="pp_load_players">
                    👥 Load Players from List
                </button>
            </div>
            
            <div id="playerList" class="card">
                <div class="player-row" style="border-left: 5px solid var(--primary); padding:10px; display:flex; align-items:center; background:var(--bg-color); border-radius:8px;">
                    <div class="color-box" style="width:20px; height:20px; border-radius:50%; background:var(--primary); box-shadow:0 0 10px var(--primary); margin-right:15px;"></div>
                    <input type="text" id="name_0" value="Player 1" placeholder="Name" style="flex:1; padding: 10px; font-size:1.1rem; border-radius:5px; border:1px solid var(--border-color); background:transparent; color:var(--text-main);" oninput="clearPlayerId()">
                    <span class="stat-icon" id="stat_icon_0" title="Gastspieler (Keine Statistik)">📊</span>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game">START 🏁</button>
                <button onclick="location.href='game_ctl_setup.html'" class="btn-back" data-i18n="btn_back">⬅ ZURÜCK</button>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="player_picker.js"></script>
    <script>
        const LAYOUTS = {
            12: ["A1","C1","E1","B2","D2","A3","E3","B4","D4","A5","C5","E5"],
            10: ["A1","C1","E1","B2","D2","A3","E3","A5","C5","E5"],
            9:  ["A1","C1","E1","A3","C3","E3","A5","C5","E5"],
            8:  ["A1","C1","E1","A3","E3","A5","C5","E5"],
            7:  ["A1","C1","E1","C3","A5","C5","E5"],
            6:  ["A1","C1","E1","A5","C5","E5"],
            5:  ["A1","E1","C3","A5","E5"], 
            4:  ["A1","E1","A5","E5"],
            3:  ["A3","C3","E3"]
        };

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initList, 500);
        });

        function clearPlayerId() {
            sessionStorage.setItem(`p_id_0`, 0);
            let icon = document.getElementById(`stat_icon_0`);
            if(icon) {
                icon.classList.remove('active');
                icon.title = "Gastspieler (Keine Statistik)";
            }
        }

        function loadFromPicker() {
            openPlayerPicker(1, function(selected) {
                if(selected.length > 0) {
                    let p = selected[0];
                    document.getElementById('name_0').value = p.name; 
                    sessionStorage.setItem('p_name_0', p.name); 
                    sessionStorage.setItem('p_id_0', p.id); 
                    
                    let icon = document.getElementById('stat_icon_0');
                    if(icon) { 
                        icon.classList.add('active'); 
                        icon.title = "Statistik wird gespeichert"; 
                    }
                }
            });
        }

        async function initList() {
            if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
            
            await fetch('/api/game/load?id=21');

            let numPucks = parseInt(sessionStorage.getItem('ctl_pucks') || 4);
            let holdStart = sessionStorage.getItem('ctl_hold') == '1';
            
            await fetch(`/api/game/action?cmd=cfg_pucks&val=${numPucks}`);
            await fetch(`/api/game/action?cmd=cfg_time&val=${sessionStorage.getItem('ctl_time')}`);
            await fetch(`/api/game/action?cmd=cfg_diff&val=${sessionStorage.getItem('ctl_diff')}`);
            await fetch(`/api/game/action?cmd=cfg_hold&val=${holdStart ? 1 : 0}`);
            await fetch(`/api/game/action?cmd=cfg_speedup&val=${sessionStorage.getItem('ctl_speedup') || '1'}`);
            await fetch(`/api/game/action?cmd=cfg_color&val=${sessionStorage.getItem('ctl_color') || '2'}`);
            await fetch(`/api/game/action?cmd=cfg_sound&val=${sessionStorage.getItem('ctl_sound') || '1'}`);
            await fetch(`/api/game/action?cmd=cfg_fake&val=${sessionStorage.getItem('ctl_fake') || '0'}`);
            
            await fetch('/api/game/action?cmd=setup'); 
            await fetch('/api/game/action?cmd=show_layout'); 

            let tableHtml = `<table class="arena-table">`;
            const cols = ['A', 'B', 'C', 'D', 'E'];
            for(let r = 1; r <= 5; r++) {
                tableHtml += `<tr>`;
                for(let c = 0; c < 5; c++) {
                    tableHtml += `<td id="cell-${cols[c]}${r}"></td>`;
                }
                tableHtml += `</tr>`;
            }
            tableHtml += `</table>`;
            document.getElementById('arenaContainer').innerHTML = tableHtml;
            
            let layoutKey = [3, 4, 5, 6, 7, 8, 9, 10, 12].find(n => n >= numPucks) || 12;
            let activeLayout = LAYOUTS[layoutKey];

            for(let i = 0; i < numPucks; i++) {
                let coord = activeLayout[i] || "C3"; 
                let startHtml = (i === 0 && holdStart) ? `<div class="start-badge" style="position: absolute; top: -15px; background: #fff; color: #000; font-size: 0.7rem; padding: 2px 5px; border-radius: 4px; font-weight:bold; z-index:10;">START</div>` : "";
                let targetCell = document.getElementById(`cell-${coord}`);
                if(targetCell) {
                    targetCell.innerHTML = `<div class="puck-icon" id="puck_vis_${i}">${startHtml}${i+1}</div>`;
                }
            }

            let ph = (typeof getTranslation === 'function') ? getTranslation('cd_ph_player') : "Spieler";
            if(!ph) ph = "Spieler";

            let pName = sessionStorage.getItem('p_name_0') || `${ph} 1`;
            document.getElementById('name_0').value = pName;
            
            let pId = sessionStorage.getItem('p_id_0');
            if (pId && pId !== "0") {
                let icon = document.getElementById('stat_icon_0');
                if(icon) {
                    icon.classList.add('active');
                    icon.title = "Statistik wird gespeichert";
                }
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            setInterval(pollPuckEffects, 1500);
        }

        async function pollPuckEffects() {
            try {
                let r = await fetch('/api/effects');
                let data = await r.json();
                data.forEach(eff => {
                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                    
                        vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                        if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                        if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                        if(eff.eff == 9) vis.classList.add('eff-rainbow');
 
                        if(eff.eff == 18) {
                            let percent = Math.round(eff.dur / 2.55);
                            vis.style.background = `conic-gradient(${rgb} ${percent}%, var(--border-color) ${percent}%)`;
                            vis.style.border = `2px solid ${rgb}`;
                        } else {
                            vis.style.background = rgb;
                            vis.style.border = `2px solid #fff`;
                        }
                        vis.style.boxShadow = `0 0 15px ${rgb}`;
                    }
                });
            } catch(e) {}
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }

        function startGame() { 
            sessionStorage.setItem('p_name_0', document.getElementById('name_0').value);
            setTimeout(() => { location.href = 'game_ctl_run.html'; }, 200);
        }
    </script>
</body>
</html>
