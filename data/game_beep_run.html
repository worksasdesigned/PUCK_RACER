<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luc Léger Live</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-info { background: var(--card-bg); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px; border: 1px solid var(--border-color);}
        .big-time { font-size: 3.5rem; font-family: monospace; color: var(--text-main); font-weight: bold;}
        .level-info { font-size: 1.5rem; color: var(--primary); font-weight:bold; margin-top:5px; }
        .speed-info { font-size: 1rem; color: var(--text-muted); }

        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; }

        .b-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; background: var(--card-hover); margin-bottom: 8px; padding: 12px; border-radius: 8px; border-left: 8px solid var(--border-color); transition: background 0.3s, opacity 0.3s;}
        .b-name { font-size: 1.2rem; font-weight: bold; color: var(--text-main);}
        .b-stats { display: flex; gap: 15px; font-size: 0.9rem; color: var(--text-muted); margin-top: 5px;}
        .b-val { font-family: monospace; font-size: 1.1rem; color: var(--text-main); font-weight:bold; }
        
        .row-eliminated { opacity: 0.4; border-color: var(--border-color) !important; background: var(--bg-color); filter: grayscale(100%);}
        .row-fail { background: rgba(220, 53, 69, 0.2) !important; border-color: var(--danger) !important; }

        .action-btns { display: flex; gap: 10px; align-items:center; justify-content: flex-end;}
        .btn-action { border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-action:active { transform: scale(0.95); }
        .btn-yellow { background: var(--warning); color: black; }
        .btn-stop { background: var(--danger); color: white; }
        
        .bottom-nav { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_beep">Luc Léger Test ⏱️</div>
     <div class="status-bar">
    <div class="status-dot dot-green" id="cnt-green">0</div>
    <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
    <div class="status-dot dot-red" id="cnt-red">0</div>
</div>
    </header>

    <main>
        <div class="top-info">
            <div class="big-time" id="totalTime">00:00.0</div>
            <div class="level-info" id="levelInfo">Level 1</div>
            <div class="speed-info" id="speedInfo">8.5 km/h</div>
        </div>

        <div class="controls">
            <button onclick="goBack()" class="btn-warn btn-ctrl" data-i18n="btn_back">⬅</button>
            <button onclick="doAction('start')" class="btn-primary btn-ctrl" id="btnStart" data-i18n="btn_start">START GAME</button>
            <button onclick="doAction('stop')" class="btn-danger btn-ctrl" data-i18n="btn_stop">STOP</button>
        </div>

        <div id="gameBoard"></div>

        <div class="bottom-nav">
            <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
<script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        const COLORS = ['#FF0000', '#0000FF', '#00FF00', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#FFFFFF', '#00FF00', '#FFC0CB'];
        let isSetupState = true;

        document.getElementById('gameBoard').addEventListener('click', function(e) {
            let btn = e.target.closest('.action-btn');
            if(btn) {
                let cmd = btn.getAttribute('data-cmd');
                if(cmd) doAction(cmd);
            }
        });

        setInterval(updateStatus, 400); 

        function updateStatus() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                 
                
                if (data.tT !== undefined) {
                    let t = Math.floor(data.tT / 1000);
                    let m = Math.floor(t / 60);
                    let s = t % 60;
                    let ms = Math.floor((data.tT % 1000) / 100);
                    document.getElementById('totalTime').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${ms}`;
                }
                if (data.lvl) document.getElementById('levelInfo').innerText = "Level " + data.lvl;
                if (data.spd) document.getElementById('speedInfo').innerText = data.spd.toFixed(1) + " km/h";

                isSetupState = (data.st === 0);
                let btnStart = document.getElementById('btnStart');
                
                if (isSetupState) {
                    btnStart.innerText = getTranslation('btn_start');
                    btnStart.style.background = "var(--primary)";
                } else if (data.st === 1 || data.st === 2 || data.st === 3) {
                    btnStart.innerText = getTranslation('bp_hold');
                    btnStart.style.background = "var(--warning)";
                } else {
                    btnStart.innerText = getTranslation('btn_reset');
                    btnStart.style.background = "var(--success)";
                }

                renderTable(data.players, data.st);
                
            }).catch(e => {
                document.getElementById('conn-stat').style.opacity = 0.2;
            });
        }

        function renderTable(players, globalState) {
            let container = document.getElementById('gameBoard');
            if (!players) return;

            players.forEach((p, i) => {
                let rowId = `b-row-${i}`;
                let rowEl = document.getElementById(rowId);
                
                let name = sessionStorage.getItem(`p_name_${i}`) || `Lane ${i+1}`;
                let color = COLORS[i % 10];
                
                let rowClass = "b-row";
                let statusIcon = "";

                if (p.elim === 1) {
                    rowClass += " row-eliminated";
                } else {
                    if (globalState === 1 || globalState === 2) {
                        statusIcon = p.hld ? "🖐️" : "⌛";
                    }
                    if (p.fs === 1) {
                        rowClass += " row-fail";
                        statusIcon = "⚠️";
                    }
                }

                if (!rowEl) {
                    container.insertAdjacentHTML('beforeend', `
                    <div id="${rowId}" class="${rowClass}" style="border-left-color: ${color}">
                        <div>
                            <div class="b-name">${name} <span id="st-icon-${i}">${statusIcon}</span></div>
                            <div class="b-stats">
                                <div>Dist: <span id="dist-${i}" class="b-val">${p.dist}m</span></div>
                                <div>VO2Max: <span id="vo2-${i}" class="b-val">${p.vo2}</span></div>
                            </div>
                        </div>
                        <div class="action-btns" id="btns-${i}">
                            <button id="btn-yc-${i}" class="btn-action btn-yellow action-btn" data-cmd="clear_card&val=${p.id}" style="display:none;">🟨 0</button>
                            <button id="btn-stop-${i}" class="btn-action btn-stop action-btn" data-cmd="elim_player&val=${p.id}">STOP</button>
                            <span id="lbl-out-${i}" style="color:var(--danger); font-weight:bold; display:none;">OUT ☠️</span>
                        </div>
                    </div>`);
                } else {
                    if (rowEl.className !== rowClass) rowEl.className = rowClass;
                    
                    let iconEl = document.getElementById(`st-icon-${i}`);
                    if (iconEl.innerText !== statusIcon) iconEl.innerText = statusIcon;

                    document.getElementById(`dist-${i}`).innerText = p.dist + "m";
                    document.getElementById(`vo2-${i}`).innerText = p.vo2;
                    
                    let btnYc = document.getElementById(`btn-yc-${i}`);
                    let btnStop = document.getElementById(`btn-stop-${i}`);
                    let lblOut = document.getElementById(`lbl-out-${i}`);

                    if (p.elim === 0) {
                        lblOut.style.display = "none";
                        btnStop.style.display = "inline-block";
                        
                        if (p.yc > 0) {
                            btnYc.style.display = "inline-block";
                            btnYc.innerText = "🟨 " + p.yc;
                        } else {
                            btnYc.style.display = "none";
                        }
                    } else {
                        btnYc.style.display = "none";
                        btnStop.style.display = "none";
                        lblOut.style.display = "inline-block";
                    }
                }
            });
        }

        function doAction(act) { fetch(`/api/game/action?cmd=${act}`); }
        function goBack() { doAction('reset'); location.href = 'game_beep_names.html'; }
        function goHome() { fetch('/api/game/action?cmd=exit').then(() => location.href = '/'); }
    </script>
</body>
</html>
