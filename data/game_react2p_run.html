<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>React 2P Live</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-info { background: var(--card-bg); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px; border: 1px solid var(--border-color);}
        .big-time { font-size: 3.5rem; font-family: monospace; color: var(--text-main); font-weight: bold;}
        .target-time { font-size: 1.2rem; color: var(--text-muted); margin-top:5px; }

        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; }

        .grp-box { background: var(--card-hover); border-radius: 8px; margin-bottom: 15px; padding: 10px; border-left: 8px solid var(--border-color); transition: background 0.3s;}
        .grp-head { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:5px; margin-bottom:10px; }
        .g-name { font-size:1.2rem; font-weight:bold; color:var(--text-main);}
        .g-badge { background:var(--bg-color); padding:3px 8px; border-radius:4px; font-size:0.8rem; font-weight:bold; }

        .duel-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
        .p-box { text-align:center; padding:10px; background:var(--bg-color); border-radius:6px; position:relative; }
        .p-name { font-size:1.1rem; margin-bottom:5px; color:var(--text-main); }
        .p-score { font-size:2.5rem; font-weight:bold; font-family:monospace; color:var(--text-main); }
        .p-avg { font-size:0.85rem; color:var(--text-muted); }
        .vs-text { font-weight:bold; color:var(--text-muted); font-size:1.5rem; text-align:center;}

        .color-dot { width: 12px; height: 12px; border-radius: 50%; display:inline-block; border:1px solid #fff;}

        .g-timer { font-family: monospace; font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        .g-timer.urgent { color: var(--danger); }

        .action-btns { display: flex; gap: 10px; margin-top: 10px;}
        .btn-action { flex:1; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-action:active { transform: scale(0.95); }
        .btn-stop { background: var(--danger); color: white; }
        .btn-start { background: var(--success); color: black; }
        
        .bottom-nav { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 15px; }
        
        .rec-icon { position:absolute; top:5px; right:5px; font-size:1.1rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_react2p">React 2-Player ⚡</div>
        <div class="status-bar">
            <div class="status-dot dot-green" id="cnt-green">0</div>
            <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
            <div class="status-dot dot-red" id="cnt-red">0</div>
        </div>
    </header>

    <main>
        <div class="top-info">
            <div class="big-time" id="globalTime">00:00.0</div>
            <div class="target-time" id="limitTime">Limit: 90s</div>
        </div>

        <div class="controls">
            <button onclick="goBack()" class="btn-warn btn-ctrl" data-i18n="btn_back">⬅</button>
            <button onclick="doAction('start')" class="btn-primary btn-ctrl" id="btnStart" data-i18n="btn_start_all">START ALL</button>
            <button onclick="doAction('stop')" class="btn-danger btn-ctrl" data-i18n="btn_stop_all">STOP ALL</button>
        </div>

        <div id="gameBoard"></div>

        <div class="bottom-nav">
            <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const GRP_COLORS = ['#800080', '#40E0D0', '#FF7F50', '#7FFFD4', '#9370DB'];
        const STATES = ["SETUP", "GET READY", "COUNTDOWN", "WAITING...", "GO!", "ROUND OVER", "FINISHED"];

        function fmtGrpTime(gT, limit) {
            if (!gT || gT <= 0) return '--:--';
            let remaining = Math.max(0, limit - gT);
            let s = Math.floor(remaining / 1000);
            let m = Math.floor(s / 60);
            s = s % 60;
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
        
        let nGrp = parseInt(sessionStorage.getItem('r2_groups') || 1);

        function t(key, fallback) {
            if (typeof getTranslation !== 'function') return fallback;
            let val = getTranslation(key);
            return (val && val !== key) ? val : fallback;
        }

        // --- STATS LOGIK ---
        let groupSaved = {};
        let personalBests = {};
        let sessionRecords = {};

        async function loadPersonalBests() {
            for(let i=0; i<nGrp; i++) {
                let ids = [
                    {key: `p1_${i}`, val: sessionStorage.getItem(`r2_p1_id_${i}`)},
                    {key: `p2_${i}`, val: sessionStorage.getItem(`r2_p2_id_${i}`)}
                ];
                
                for(let p of ids) {
                    personalBests[p.key] = 0;
                    if (p.val && p.val !== "0") {
                        try {
                            let r = await fetch('/s_' + p.val + '.csv?_t=' + Date.now());
                            if (r.ok) {
                                let text = await r.text();
                                let lines = text.split(/\r?\n/);
                                let best = 99999999;
                                lines.forEach(line => {
                                    let parts = line.split(';');
                                    if (parts.length >= 4 && parts[1] === "13") { 
                                        let sc = parseInt(parts[2]); // Score = Reaktionszeit
                                        if (sc > 0 && sc < best) best = sc;
                                    }
                                });
                                if (best < 99999999) personalBests[p.key] = best;
                            }
                        } catch(e) {}
                    }
                }
            }
        }
        loadPersonalBests();

        function savePlayerStat(idKey, timeMs, winBool) {
            let pid = sessionStorage.getItem(idKey);
            if (!pid || pid === "0") return;
            let fd = new URLSearchParams();
            fd.append('pid', pid);
            fd.append('game', 13); // Game ID 13 = React 2P
            fd.append('score', timeMs); 
            fd.append('ex1', winBool); // 1 = Win, 0 = Loss
            fd.append('ts', Date.now());
            fetch('/api/stats/player_save', { method: 'POST', body: fd }).catch(e => console.log(e));
        }

        document.getElementById('gameBoard').addEventListener('click', function(e) {
            let btn = e.target.closest('.action-btn');
            if(btn) {
                let cmd = btn.getAttribute('data-cmd');
                if(cmd) doAction(cmd);
            }
        });

        setInterval(updateStatus, 400); 

		function updateStatus() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                
                if (data.time !== undefined) {
                    let tVal = Math.floor(data.time / 1000);
                    let m = Math.floor(tVal / 60);
                    let s = tVal % 60;
                    let ms = Math.floor((data.time % 1000) / 100);
                    document.getElementById('globalTime').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${ms}`;
                }
                if (data.limit) {
                    document.getElementById('limitTime').innerText = t('lbl_time_limit', 'Limit:') + ` ${data.limit/1000}s`;
                }
                
                let btn = document.getElementById('btnStart');
                if (data.groups && data.groups.length > 0) {
                    let firstSt = data.groups[0].st;
                    if (firstSt === 0 || firstSt === 6) { 
                        btn.innerText = (firstSt === 6) ? t('btn_reset', 'RESET') : t('btn_start_all', 'START ALL'); 
                        btn.style.background = "var(--primary)"; 
                        btn.style.color = "white";
                    } else { 
                        btn.innerText = t('btn_running', 'RUNNING');
                        btn.style.background = "var(--card-hover)"; 
                        btn.style.color = "var(--text-muted)";
                    }
                }

                // Statistiken prüfen & mit Warteschlange speichern
                if (data.groups) {
                    let saveDelay = 0;
                    data.groups.forEach((g, i) => {
                        if (g.st < 6) { 
                            groupSaved[i] = false; 
                            sessionRecords['p1_'+i] = false; 
                            sessionRecords['p2_'+i] = false; 
                        }
                        
                        if (g.st === 6 && !groupSaved[i]) {
                            
                            // Check persönliche Rekorde (niedriger ist besser)
                            if (g.p1s > 0 && (personalBests['p1_'+i] === 0 || g.p1a < personalBests['p1_'+i])) {
                                personalBests['p1_'+i] = g.p1a;
                                sessionRecords['p1_'+i] = true;
                            }
                            if (g.p2s > 0 && (personalBests['p2_'+i] === 0 || g.p2a < personalBests['p2_'+i])) {
                                personalBests['p2_'+i] = g.p2a;
                                sessionRecords['p2_'+i] = true;
                            }

                            // Speichern
                            let p1Win = g.p1s > g.p2s ? 1 : 0;
                            let p2Win = g.p2s > g.p1s ? 1 : 0;
                            
                            // Nur speichern, wenn sie auch wirklich mitgespielt haben
                            if (g.p1s > 0 || g.p2s > 0) {
                                setTimeout(() => savePlayerStat(`r2_p1_id_${i}`, g.p1a, p1Win), saveDelay);
                                saveDelay += 200;
                                setTimeout(() => savePlayerStat(`r2_p2_id_${i}`, g.p2a, p2Win), saveDelay);
                                saveDelay += 200;
                            }
                            groupSaved[i] = true;
                        }
                    });
                }

                renderTable(data.groups, data.limit);
            }).catch(e => {
                document.getElementById('cnt-green').style.opacity = 0.2;
            });
        }
		
        function renderTable(groups, limit) {
            let container = document.getElementById('gameBoard');
            if (!groups) return;

            let tRestart = t('r2_run_restart_grp', 'RESTART');
            let tStop = t('r2_run_stop_grp', 'STOP');

            groups.forEach((g, i) => {
                let rowId = `r2-grp-${i}`;
                let rowEl = document.getElementById(rowId);
                
                let phP1 = t('r2_names_p1', 'Player 1');
                let phP2 = t('r2_names_p2', 'Player 2');

                let p1Name = sessionStorage.getItem(`r2_p1name_${i}`) || phP1;
                let p2Name = sessionStorage.getItem(`r2_p2name_${i}`) || phP2;
                let color = GRP_COLORS[i];
                
                let stateTxt = STATES[g.st] || "UNK";
                let badgeColor = "var(--text-main)";
                let badgeBg = "var(--bg-color)";
                let glowClass = "";

                if (g.st === 4) { badgeColor = "#000"; badgeBg = "var(--success)"; glowClass = "rgba(0,255,0,0.1)"; }
                if (g.st === 6) { badgeColor = "#fff"; badgeBg = "var(--danger)"; }
                
                let p1ColsHtml = g.p1c.map(c => `<div class="color-dot" style="background:${c}"></div>`).join('');
                let p2ColsHtml = g.p2c.map(c => `<div class="color-dot" style="background:${c}"></div>`).join('');
                
                let p1AvgStr = (g.p1a > 0) ? `Ø ${(g.p1a/1000).toFixed(2)}s` : "--";
                let p2AvgStr = (g.p2a > 0) ? `Ø ${(g.p2a/1000).toFixed(2)}s` : "--";

                let recTitle = t('bat_new_pers', 'Neuer Persönlicher Rekord!');
                let recP1 = sessionRecords['p1_'+i] ? `<div class="rec-icon" title="${recTitle}">📈</div>` : "";
                let recP2 = sessionRecords['p2_'+i] ? `<div class="rec-icon" title="${recTitle}">📈</div>` : "";

                let grpTimeTxt = fmtGrpTime(g.gT, limit);
                let isUrgent = (g.gT > 0 && (limit - g.gT) < 15000 && g.st !== 6);

                if (!rowEl) {
                    container.insertAdjacentHTML('beforeend', `
                    <div id="${rowId}" class="grp-box" style="border-left-color: ${color}">
                        <div class="grp-head">
                            <span class="g-name">Duell ${i+1}</span>
                            <span id="grptime-${i}" class="g-timer${isUrgent ? ' urgent' : ''}">${grpTimeTxt}</span>
                            <span id="badge-${i}" class="g-badge" style="background:${badgeBg}; color:${badgeColor};">${stateTxt}</span>
                        </div>
                        <div class="duel-row">
                            <div class="p-box" id="box-p1-${i}">
                                ${recP1}
                                <div class="p-name">${p1Name} ${p1ColsHtml}</div>
                                <div id="p1s-${i}" class="p-score">${g.p1s}</div>
                                <div id="p1a-${i}" class="p-avg">${p1AvgStr}</div>
                            </div>
                            <div class="vs-text">VS</div>
                            <div class="p-box" id="box-p2-${i}">
                                ${recP2}
                                <div class="p-name">${p2ColsHtml} ${p2Name}</div>
                                <div id="p2s-${i}" class="p-score">${g.p2s}</div>
                                <div id="p2a-${i}" class="p-avg">${p2AvgStr}</div>
                            </div>
                        </div>
                        <div class="action-btns">
                            <button id="btn-restart-${i}" class="btn-action btn-start action-btn" data-cmd="grp_start&val=${i}">${tRestart}</button>
                            <button id="btn-stop-${i}" class="btn-action btn-stop action-btn" data-cmd="grp_stop&val=${i}">${tStop}</button>
                        </div>
                    </div>`);
                } else {
                    let badge = document.getElementById(`badge-${i}`);
                    if (badge.innerText !== stateTxt) {
                        badge.innerText = stateTxt;
                        badge.style.background = badgeBg;
                        badge.style.color = badgeColor;
                        rowEl.style.background = glowClass !== "" ? glowClass : "var(--card-hover)";
                    }
                    let timerEl = document.getElementById(`grptime-${i}`);
                    timerEl.innerText = grpTimeTxt;
                    timerEl.className = 'g-timer' + (isUrgent ? ' urgent' : '');

                    document.getElementById(`p1s-${i}`).innerText = g.p1s;
                    document.getElementById(`p2s-${i}`).innerText = g.p2s;
                    document.getElementById(`p1a-${i}`).innerText = p1AvgStr;
                    document.getElementById(`p2a-${i}`).innerText = p2AvgStr;

                    document.getElementById(`btn-restart-${i}`).innerText = tRestart;
                    document.getElementById(`btn-stop-${i}`).innerText = tStop;

                    // Update Rekord-Icons dynamisch
                    let boxP1 = document.getElementById(`box-p1-${i}`);
                    if (sessionRecords['p1_'+i] && !boxP1.innerHTML.includes('📈')) boxP1.innerHTML += `<div class="rec-icon" title="${recTitle}">📈</div>`;
                    else if (!sessionRecords['p1_'+i] && boxP1.innerHTML.includes('📈')) {
                        let recEl = boxP1.querySelector('.rec-icon');
                        if(recEl) recEl.remove();
                    }

                    let boxP2 = document.getElementById(`box-p2-${i}`);
                    if (sessionRecords['p2_'+i] && !boxP2.innerHTML.includes('📈')) boxP2.innerHTML += `<div class="rec-icon" title="${recTitle}">📈</div>`;
                    else if (!sessionRecords['p2_'+i] && boxP2.innerHTML.includes('📈')) {
                        let recEl = boxP2.querySelector('.rec-icon');
                        if(recEl) recEl.remove();
                    }
                }
            });
        }

        function doAction(act) { fetch(`/api/game/action?cmd=${act}`); }
        function goBack() { doAction('reset'); nav('game_react2p_names.html'); }
        function goHome() { fetch('/api/game/action?cmd=exit').then(() => nav('/')); }
    </script>
</body>
</html>
