<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Names - Cat Reflex</title>
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
        .arena-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .arena-table td { width: 20%; height: 50px; text-align: center; vertical-align: middle; }
        .puck-icon { 
            width: 30px; height: 30px; border-radius: 50%; background: #444; 
            margin: 0 auto; display: flex; align-items: center; justify-content: center; 
            color: white; font-weight: bold; font-size: 0.8rem; transition: background 0.2s, box-shadow 0.2s; 
        }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="g_cat">Katzenreflexe</div></header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initializing...</div>

        <div id="content" style="display:none;">
            <div class="card" id="layoutCard">
                <div class="layout-header" onclick="toggleLayout()" style="cursor:pointer; display:flex; justify-content:space-between; font-weight:bold;">
                    <span data-i18n="layout_title">Player Configuration & Layout</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody" style="margin-top:15px;">
                    <div id="arenaContainer" style="margin-bottom: 20px;"></div>
                    <div id="playerList"></div>
                </div>
            </div>

            <div class="action-bar" id="pickerBar" style="margin-top: 15px;">
                <button class="btn-secondary" onclick="loadFromPicker()" data-i18n="btn_load_players">👥 Load Players</button>
            </div>

            <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem; margin-top:20px;" data-i18n="btn_start_game">START GAME 🏁</button>
            <button onclick="location.href='game_cat_setup.html'" class="btn-back" style="margin-top:20px;" data-i18n="btn_back">Back</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="player_picker.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const COLORS = ['#FF0000', '#0000FF', '#00FF00', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#FFFFFF', '#800080', '#FFC0CB'];
        
        // Das Layout-Mapping
        const LAYOUTS = {
            3:  ["C1","A5","E5"],
            4:  ["A1","E1","A5","E5"],
            5:  ["C1","A3","E3","B5","D5"],
            6:  ["B1","D1","A3","E3","B5","D5"],
            7:  ["B1","C1","D1","A3","E3","B5","D5"],
            8:  ["B1","C1","D1","A3","E3","B5","C5","D5"],
            9:  ["B1","C1","D1","E2","A3","E3","B5","C5","D5"],
            10: ["B1","C1","D1","A2","E2","A3","E3","B5","C5","D5"],
            11: ["B1","C1","D1","A2","E2","A3","E3","A4","B5","C5","D5"],
            12: ["B1","C1","D1","A2","E2","A3","E3","A4","E4","B5","C5","D5"]
        };

        let numPlayers = parseInt(sessionStorage.getItem('cr_players') || 1);
        let neededPucks = numPlayers + 1; // Cat Reflex braucht immer Spieler + 1 (Zentraler Puck)

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initList, 500);
        });

        async function initList() {
            try {
                // 1. ESP32 Backend zurücksetzen
                await fetch('/api/game/load?id=25');

                // 2. Werte aus sessionStorage lesen
                numPlayers = parseInt(sessionStorage.getItem('cr_players') || 1);
                neededPucks = numPlayers + 1; 
                let highlander = parseInt(sessionStorage.getItem('cr_highlander') || 1);
                let time = parseInt(sessionStorage.getItem('cr_time') || 60);
                let diff = parseInt(sessionStorage.getItem('cr_diff') || 1000);
                let chaos = parseInt(sessionStorage.getItem('cr_chaos') || 0);

                // 3. Konfiguration ans Backend schicken
                await fetch(`/api/game/action?cmd=config_players&val=${numPlayers}`);
                await fetch(`/api/game/action?cmd=config_highlander&val=${highlander}`);
                await fetch(`/api/game/action?cmd=config_time&val=${time}`);
                await fetch(`/api/game/action?cmd=config_diff&val=${diff}`);
                await fetch(`/api/game/action?cmd=config_chaos&val=${chaos}`);

                // 4. Setup triggern
                await fetch('/api/game/action?cmd=setup');

                // 5. Arena aufbauen (Raster)
                buildArena();

                // 6. HTML Liste aufbauen
                let container = document.getElementById('playerList');
                container.innerHTML = "";
                let ph = (typeof getTranslation === 'function') ? getTranslation('cr_setup_players') : "Spieler";
                if(!ph) ph = "Spieler";

                for(let i=0; i<numPlayers; i++) {
                    let color = COLORS[i % COLORS.length];
                    let name = sessionStorage.getItem(`p_name_${i}`) || `${ph} ${i+1}`;
                    container.innerHTML += `
                    <div class="player-row" style="border-left: 5px solid ${color}; padding-left:10px; margin-bottom:10px; display:flex; align-items:center;">
                        <div class="color-box" id="cb_${i}" style="width:20px; height:20px; border-radius:50%; background:${color}; box-shadow:0 0 10px ${color}; margin-right:15px;"></div>
                        <input type="text" id="name_${i}" value="${name}" placeholder="${ph} ${i+1}" style="flex:1; padding: 10px; font-size:1.1rem; border-radius:5px; border:1px solid #ccc;">
                    </div>`;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                setInterval(pollPuckEffects, 1500);

            } catch (error) {
                console.error("Initialisierungsfehler:", error);
            }
        }

        function buildArena() {
            let arenaContainer = document.getElementById('arenaContainer');
            if(!arenaContainer) return;

            let tableHtml = `<table class="arena-table">`;
            const cols = ['A', 'B', 'C', 'D', 'E'];
            for(let r = 1; r <= 5; r++) {
                tableHtml += `<tr>`;
                for(let c = 0; c < 5; c++) {
                    tableHtml += `<td id="cell-${cols[c]}${r}"></td>`;
                }
                tableHtml += `</tr>`;
            }
            tableHtml += `</table>`;
            arenaContainer.innerHTML = tableHtml;

            // Finde das passende Layout, greife auf Default zurück falls keins existiert
            let layoutKey = Object.keys(LAYOUTS).find(k => parseInt(k) >= neededPucks) || 12;
            let activeLayout = LAYOUTS[layoutKey];

            for(let p=0; p<neededPucks && p<activeLayout.length; p++) {
                let coord = activeLayout[p];
                let cell = document.getElementById(`cell-${coord}`);
                if(cell) {
                    // Der Anzeigepuck (Zentraler Puck) bekommt vielleicht ein spezielles Icon oder bleibt neutral
                    cell.innerHTML = `<div class="puck-icon" id="puck_vis_${p}">P${p+1}</div>`;
                }
            }
        }

        async function pollPuckEffects() {
            try {
                let r = await fetch('/api/effects');
                let data = await r.json();
                data.forEach(eff => {
                    const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                    
                    // 1. Liste updaten
                    let cb = document.getElementById(`cb_${eff.id}`);
                    if(cb) {
                        cb.style.background = rgb;
                        cb.style.boxShadow = `0 0 10px ${rgb}`;
                    }

                    // 2. Arena Layout updaten
                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        vis.style.background = rgb;
                        vis.style.boxShadow = `0 0 15px ${rgb}`;
                        vis.style.border = (eff.r===0 && eff.g===0 && eff.b===0) ? "2px solid #444" : "2px solid #fff";
                    }
                });
            } catch(e) {}
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }

        function loadFromPicker() {
            openPlayerPicker(numPlayers, function(selected) {
                selected.forEach((p, i) => {
                    let inp = document.getElementById('name_' + i);
                    if (inp) { inp.value = p.name; sessionStorage.setItem('p_name_' + i, p.name); }
                });
            });
        }

        function startGame() {
            for(let i=0; i<numPlayers; i++) {
                let val = document.getElementById(`name_${i}`).value;
                sessionStorage.setItem(`p_name_${i}`, val);
            }
            location.href = 'game_cat_run.html';
        }
    </script>
</body>
</html>
