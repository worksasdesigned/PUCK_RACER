<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Player Manager</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .toolbar { display:flex; gap:10px; margin-bottom:20px; }
        .toolbar button { flex:1; font-size:1.1rem; }

        /* Gruppen-Cards */
        .grp-card {
            background:var(--card-bg); border:1px solid var(--border-color);
            border-radius:10px; margin-bottom:12px; overflow:hidden;
            transition:border-color 0.2s;
        }
        .grp-card.open { border-color:var(--primary); }
        .grp-header {
            display:flex; align-items:center; padding:14px 16px; cursor:pointer;
            gap:12px; user-select:none;
        }
        .grp-header:active { background:var(--card-hover); }
        .grp-arrow { font-size:1.2rem; transition:transform 0.2s; color:var(--text-muted); flex-shrink:0; }
        .grp-card.open .grp-arrow { transform:rotate(90deg); }
        .grp-name { flex:1; font-size:1.15rem; font-weight:bold; color:var(--text-main); }
        .grp-count {
            background:var(--bg-color); padding:3px 10px; border-radius:12px;
            font-size:0.85rem; color:var(--text-muted); flex-shrink:0;
        }
        
        .grp-export {
            background:none; border:none; color:var(--primary); font-size:1.3rem;
            cursor:pointer; padding:0 4px; margin:0 5px 0 0; width:auto; opacity:0.6;
            transition:opacity 0.2s;
        }
        .grp-export:hover { opacity:1; }
        
        .grp-del {
            background:none; border:none; color:var(--danger); font-size:1.3rem;
            cursor:pointer; padding:0 4px; margin:0; width:auto; opacity:0.6;
            transition:opacity 0.2s;
        }
        .grp-del:hover { opacity:1; }

        .grp-body { display:none; padding:0 16px 16px; }
        .grp-card.open .grp-body { display:block; }

        .grp-name-input {
            width:100%; padding:10px; font-size:1rem; margin-bottom:12px;
            background:var(--bg-color); color:var(--text-main);
            border:1px solid var(--border-color); border-radius:6px;
        }

        .player-item {
            display:flex; align-items:center; gap:10px;
            padding:10px 8px; border-bottom:1px solid var(--border-color);
        }
        .player-item:last-child { border-bottom:none; }
        .player-name-input {
            flex:1; padding:8px; font-size:1rem;
            background:transparent; color:var(--text-main);
            border:1px solid transparent; border-radius:4px; outline:none;
        }
        .player-name-input:focus { border-color:var(--primary); background:var(--bg-color); }
        
        .player-btn-stats {
            background:none; border:none; color:var(--primary); font-size:1.2rem;
            cursor:pointer; padding:4px 8px; margin:0; width:auto; transition:transform 0.2s;
        }
        .player-btn-stats:active { transform:scale(1.2); }

        .player-del {
            background:none; border:none; color:var(--danger); font-size:1.1rem;
            cursor:pointer; padding:4px 8px; margin:0; width:auto; opacity:0.5;
        }
        .player-del:active { opacity:1; }

        .add-row { display:flex; gap:8px; margin-top:10px; }
        .add-row input { flex:1; padding:10px; font-size:1rem; }
        .add-row button { width:auto; padding:10px 18px; flex-shrink:0; }

        .modal-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.85); backdrop-filter:blur(4px);
            z-index:5000; display:none; align-items:center; justify-content:center;
            padding:15px; box-sizing:border-box;
        }
        .modal-overlay.show { display:flex; }
        .modal-box {
            background:var(--card-bg); border:1px solid var(--border-color);
            border-radius:12px; width:100%; max-width:500px;
            max-height:90vh; overflow-y:auto;
        }
        .modal-header {
            padding:16px; border-bottom:1px solid var(--border-color);
            display:flex; justify-content:space-between; align-items:center;
        }
        .modal-header h3 { margin:0; color:var(--primary); }
        .modal-body { padding:16px; }
        
        .import-body textarea {
            width:100%; height:150px; padding:10px; font-size:0.95rem;
            font-family:monospace; background:var(--bg-color); color:var(--text-main);
            border:1px solid var(--border-color); border-radius:6px; resize:vertical;
            box-sizing:border-box;
        }
        .import-hint { font-size:0.85rem; color:var(--text-muted); margin:8px 0; line-height:1.4; }
        .import-drop {
            border:2px dashed var(--border-color); border-radius:8px;
            padding:25px; text-align:center; cursor:pointer; margin-bottom:12px;
            transition:border-color 0.2s, background 0.2s;
        }
        .import-drop:hover, .import-drop.dragover { border-color:var(--primary); background:rgba(13,110,253,0.05); }
        .import-drop input { display:none; }
        .import-preview {
            max-height:200px; overflow-y:auto; margin-top:12px;
            background:var(--bg-color); border-radius:6px; padding:8px;
            font-size:0.85rem; display:none;
        }
        .import-preview table { width:100%; }
        .import-preview td { padding:4px 8px; font-size:0.85rem; }
        .import-preview .col-grp { color:var(--primary); font-weight:bold; }
        .import-preview .col-name { color:var(--text-main); }
        
        .modal-footer { padding:12px 16px; display:flex; gap:10px; border-top:1px solid var(--border-color); }
        .modal-footer button { flex:1; }

        .toast {
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
            background:var(--success); color:#000; padding:10px 20px;
            border-radius:8px; font-weight:bold; font-size:0.9rem;
            z-index:9999; opacity:0; transition:opacity 0.3s;
            pointer-events:none;
        }
        .toast.show { opacity:1; }

        .empty-state { text-align:center; padding:50px 20px; color:var(--text-muted); }
        .empty-state .icon { font-size:3rem; margin-bottom:10px; display:block; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="pm_title">Player Manager</div>
        <div class="status-bar">
            <div class="status-dot dot-green" id="cnt-green">0</div>
            <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
            <div class="status-dot dot-red" id="cnt-red">0</div>
        </div>
    </header>

    <main>
        <div class="toolbar">
            <button onclick="addGroup()" class="btn-primary" data-i18n="pm_add_group">➕ Add Group</button>
            <button onclick="openImport()" class="btn-warn" data-i18n="pm_import">📋 Import</button>
            <button onclick="createFullBackup()" class="btn-warn" style="background:var(--card-bg); color:var(--text-main); border:1px solid var(--border-color);" data-i18n="pm_sys_backup">📦 Backup</button>
        </div>

        <div id="groupList"></div>

        <button onclick="location.href='/'" class="btn-back" style="margin-top:30px;" data-i18n="btn_home">🏠 Home</button>
    </main>

    <div class="modal-overlay" id="importOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 data-i18n="pm_import_title">📋 Import / Restore</h3>
                <button class="close-modal" onclick="closeImport()" style="width:auto;background:none;border:none;color:var(--text-main);font-size:1.5rem;padding:0;margin:0;">✕</button>
            </div>
            <div class="modal-body import-body">
                <div class="import-drop" id="importDrop" onclick="document.getElementById('importFile').click()">
                    <span style="font-size:2rem;">📂</span><br>
                    <span data-i18n="pm_import_drop">Drop JSON Backup or CSV here</span>
                    <input type="file" id="importFile" accept=".csv,.txt,.tsv,.json" onchange="handleImportFile(this.files[0])">
                </div>
                <p class="import-hint" id="importHintText" data-i18n="pm_import_hint">Or paste names below. Supports: Tab, semicolon, or comma as separator.<br>Format: <b>Group, Name</b> or just <b>Name</b> (one per line).</p>
                <textarea id="importText" placeholder="U12;Lena M.&#10;U12;Tim K.&#10;U14;Max S.&#10;&#10;or just:&#10;Lena M.&#10;Tim K."></textarea>
                <div class="import-preview" id="importPreview">
                    <table id="importTable"></table>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeImport()" class="btn-back" data-i18n="btn_cancel">Cancel</button>
                <button onclick="previewImport()" class="btn-warn" id="previewBtn" data-i18n="pm_preview">👁 Preview</button>
                <button onclick="executeImport()" class="btn-primary" id="importBtn" data-i18n="pm_do_import" disabled>Import</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="statsExportOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 data-i18n="pm_export_title">📊 Gruppen-Statistik Export</h3>
                <button class="close-modal" onclick="closeStatsExport()" style="width:auto;background:none;border:none;color:var(--text-main);font-size:1.5rem;padding:0;margin:0;">✕</button>
            </div>
            <div class="modal-body" id="statsExportBody"></div>
            <div class="modal-footer">
                <button onclick="closeStatsExport()" class="btn-back" data-i18n="btn_cancel">Abbrechen</button>
                <button onclick="executeStatsExport()" class="btn-primary" data-i18n="btn_download">Download</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        function t(key, fallback) {
            return (typeof getTranslation === 'function') ? (getTranslation(key) || fallback) : fallback;
        }

        const GAME_DICT = {
            1:  { name: t('g_1', "Shuttle Run"), lblScore: t('ps_time_s', "Zeit (s)"), lblExtra: t('ps_rounds', "Runden"), fmtS: "ms_to_s", fmtE: "num" },
            3:  { name: t('g_3', "Countdown"), lblScore: t('ps_time_s', "Zeit (s)"), lblExtra: t('ps_clicks', "Klicks"), fmtS: "ms_to_s1", fmtE: "num" },
            4:  { name: t('g_4', "Simon Says"), lblScore: t('ps_level', "Level"), lblExtra: t('ps_stars', "Sterne"), fmtS: "num", fmtE: "num" },
            6:  { name: t('g_6', "Simon Runs"), lblScore: t('ps_time_s', "Zeit (s)"), lblExtra: t('ps_level', "Level"), fmtS: "ms_to_s", fmtE: "num" },
            8:  { name: t('g_8', "Bomb Squad"), lblScore: t('ps_dev_avg_s', "Ø Abweichung (s)"), lblExtra: t('ps_best_s', "Beste Runde (s)"), fmtS: "ms_to_s", fmtE: "ms_to_s" },
            9:  { name: t('g_9', "Red/Green"), lblScore: t('ps_react_s', "Reaktion (s)"), lblExtra: t('ps_fails', "Fehlstarts"), fmtS: "ms_to_s", fmtE: "num" },
            11: { name: t('g_11', "Zombie"), lblScore: t('ps_survived_s', "Überlebt (s)"), lblExtra: "", fmtS: "ms_to_s", fmtE: "none" },
            12: { name: t('g_12', "Luc Léger"), lblScore: t('ps_dist', "Distanz (m)"), lblExtra: t('ps_vo2', "VO2Max"), lblEx2: t('ps_level', "Level"), lblEx3: t('ps_speed', "km/h"), fmtS: "num", fmtE: "num", fmtEx2: "num", fmtEx3: "num" },
            13: { name: t('g_13', "React 2P"), lblScore: t('ps_react_s', "Reaktion (s)"), lblExtra: t('ps_win_bool', "Sieg (1=Ja)"), fmtS: "ms_to_s", fmtE: "num" },
            14: { name: t('g_14', "T-Test"), lblScore: t('ps_time_s', "Zeit (s)"), lblExtra: t('ps_score', "Score"), fmtS: "ms_to_s", fmtE: "str" },
            15: { name: t('g_15', "Target Touch"), lblScore: t('ps_hits', "Treffer"), lblExtra: t('ps_time_s', "Zeit (s)"), fmtS: "num", fmtE: "ms_to_s" },
            18: { name: t('g_18', "Pacemaker"), lblScore: t('ps_time_s', "Dauer (s)"), lblExtra: t('ps_pace', "Target Pace"), lblEx2: t('ps_dist', "Distanz"), lblEx3: t('ps_mode', "Modus"), fmtS: "ms_to_s", fmtE: "str", fmtEx2: "str", fmtEx3: "str" },
            21: { name: t('g_21', "Batak Pro"), lblScore: t('ps_react_avg_s', "Ø Reaktion (s)"), lblExtra: t('ps_hits', "Treffer"), lblEx2: t('ps_miss', "Fehler"), lblEx3: t('ps_time_s', "Zeit (s)"), lblEx4: t('ps_level', "Level"), lblEx5: t('ps_pucks', "Pucks"), fmtS: "ms_to_s", fmtE: "num", fmtEx2: "num", fmtEx3: "num", fmtEx4: "num", fmtEx5: "num" },
            24: { name: t('g_24', "Whac-A-Mole"), lblScore: t('ps_hits', "Treffer"), lblExtra: t('ps_miss', "Fehler"), lblEx2: t('ps_colors', "Zielfarben"), fmtS: "num", fmtE: "num", fmtEx2: "num" },
            25: { name: t('g_25', "Katzenreflexe"), lblScore: t('ps_react_avg_s', "Ø Reaktion (s)"), lblExtra: t('ps_pts', "Punkte"), fmtS: "ms_to_s", fmtE: "num" }
        };

        let data = { groups: [] };
        let nextGroupId = 1;
        let nextPlayerId = 1;
        let saveTimer = null;
        
        let parsedImport = []; 
        let pendingFullBackup = null; // Speichert eingelesenes JSON Backup

        let knownStats = {}; 
        let checkingGroups = {};
        let currentExportData = {};
        let currentExportGroupName = "";

        loadData();

        function loadData() {
            fetch('/api/players')
                .then(r => r.json())
                .then(d => {
                    data = d || { groups: [] };
                    if (!data.groups) data.groups = [];
                    data.groups.forEach(g => {
                        if (g.id >= nextGroupId) nextGroupId = g.id + 1;
                        g.players.forEach(p => { if (p.id >= nextPlayerId) nextPlayerId = p.id + 1; });
                    });
                    renderGroups();
                })
                .catch(e => renderGroups());
        }

        function hasAnyStats(g) { return g.players.some(p => knownStats[p.id] === true); }

        async function checkGroupStats(gid) {
            if (checkingGroups[gid]) return; 
            checkingGroups[gid] = true;
            let grp = data.groups.find(g => g.id === gid);
            if (!grp) { checkingGroups[gid] = false; return; }

            let pidsToCheck = grp.players.filter(p => knownStats[p.id] === undefined).map(p => p.id);
            if (pidsToCheck.length > 0) {
                try {
                    let r = await fetch('/api/stats/check?pids=' + pidsToCheck.join(','));
                    if (r.ok) {
                        let result = await r.json();
                        for (let pid in result) knownStats[pid] = result[pid];
                    }
                } catch(e) {}
            }

            let grpHasStats = false;
            for (let p of grp.players) {
                if (knownStats[p.id]) {
                    grpHasStats = true;
                    let pBtn = document.getElementById(`btn-stat-${p.id}`);
                    if (pBtn) pBtn.style.display = 'inline-block';
                }
            }
            if (grpHasStats) {
                let gBtn = document.getElementById(`btn-grp-stat-${gid}`);
                if (gBtn) gBtn.style.display = 'inline-block';
            }
            checkingGroups[gid] = false;
        }

        function sanitize(str, maxLen) {
            if (typeof str !== 'string') return '';
            return str.replace(/[{}\[\]"'\\<>&`]/g, '').replace(/\s+/g, ' ').trim().substring(0, maxLen || 20);
        }
        function sanitizeGroupName(str) { return sanitize(str, 25); }
        function sanitizePlayerName(str) { return sanitize(str, 20); }

        function renderGroups() {
            let container = document.getElementById('groupList');
            if (data.groups.length === 0) {
                container.innerHTML = `<div class="empty-state"><span class="icon">👥</span><p data-i18n="pm_empty">No groups yet. Add a group or import players!</p></div>`;
                applyTranslations(); return;
            }

            let html = '';
            data.groups.forEach((g, gi) => {
                let isOpen = document.querySelector(`.grp-card[data-gid="${g.id}"]`)?.classList.contains('open');
                let grpStatDisplay = hasAnyStats(g) ? 'inline-block' : 'none';

                html += `
                <div class="grp-card ${isOpen ? 'open' : ''}" data-gid="${g.id}">
                    <div class="grp-header" onclick="toggleGroup(${g.id})">
                        <span class="grp-arrow">▶</span>
                        <span class="grp-name">${escHTML(g.name)}</span>
                        <span class="grp-count">${g.players.length} 👤</span>
                        <button id="btn-grp-stat-${g.id}" class="grp-export" onclick="event.stopPropagation(); openStatsExport(${g.id})" title="${t('pm_export_title', 'Statistik exportieren')}" style="display:${grpStatDisplay};">📊</button>
                        <button class="grp-del" onclick="event.stopPropagation(); deleteGroup(${g.id})" title="Delete Group">🗑</button>
                    </div>
                    <div class="grp-body">
                        <input class="grp-name-input" value="${escHTML(g.name)}" maxlength="25" placeholder="Group Name" onchange="renameGroup(${g.id}, this.value)" data-i18n-placeholder="pm_grp_name_ph">
                        <div id="players-${g.id}">`;

                g.players.forEach((p, pi) => {
                    let pStatDisplay = knownStats[p.id] ? 'inline-block' : 'none';
                    html += `
                            <div class="player-item">
                                <span style="color:var(--text-muted); font-size:0.8rem; width:24px;">${pi+1}.</span>
                                <input class="player-name-input" value="${escHTML(p.name)}" maxlength="20" onchange="renamePlayer(${g.id}, ${p.id}, this.value)">
                                <button id="btn-stat-${p.id}" class="player-btn-stats" onclick="location.href='player_stats.html?pid=${p.id}&name=${encodeURIComponent(p.name)}'" title="${t('pm_stat_view', 'Statistiken ansehen')}" style="display:${pStatDisplay};">📊</button>
                                <button class="player-del" onclick="deletePlayer(${g.id}, ${p.id})" title="Löschen">✕</button>
                            </div>`;
                });

                html += `
                        </div>
                        <div class="add-row">
                            <input type="text" id="newPlayer-${g.id}" maxlength="20" placeholder="New Player Name" onkeydown="if(event.key==='Enter') addPlayerFromInput(${g.id})" data-i18n-placeholder="pm_new_player_ph">
                            <button onclick="addPlayerFromInput(${g.id})" class="btn-primary">+</button>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            applyTranslations();
        }

        function escHTML(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        function toggleGroup(gid) {
            let card = document.querySelector(`.grp-card[data-gid="${gid}"]`);
            if (card) { card.classList.toggle('open'); if (card.classList.contains('open')) checkGroupStats(gid); }
        }

        function addGroup() {
            let name = prompt(getTranslation('pm_prompt_group') || 'Group name:');
            if (!name) return;
            name = sanitizeGroupName(name);
            if (!name) return;
            data.groups.push({ id: nextGroupId++, name: name, players: [] });
            renderGroups();
            scheduleSave();
            setTimeout(() => { let card = document.querySelector(`.grp-card[data-gid="${nextGroupId - 1}"]`); if (card) card.classList.add('open'); }, 50);
        }

        function deleteGroup(gid) {
            let grp = data.groups.find(g => g.id === gid);
            if (!grp) return;
            let msg = (getTranslation('pm_confirm_del_grp') || 'Delete group "{name}" and all {n} players?').replace('{name}', grp.name).replace('{n}', grp.players.length);
            if (!confirm(msg)) return;
            grp.players.forEach(p => { fetch('/api/stats/player_del?pid=' + p.id).catch(e=>{}); delete knownStats[p.id]; });
            data.groups = data.groups.filter(g => g.id !== gid);
            renderGroups();
            scheduleSave();
        }

        function renameGroup(gid, newName) {
            newName = sanitizeGroupName(newName);
            let grp = data.groups.find(g => g.id === gid);
            if (grp && newName) { grp.name = newName; scheduleSave(); }
        }

        function addPlayerFromInput(gid) {
            let inp = document.getElementById('newPlayer-' + gid);
            let name = sanitizePlayerName(inp.value);
            if (!name) return;
            let grp = data.groups.find(g => g.id === gid);
            if (!grp) return;
            if (grp.players.some(p => p.name.toLowerCase() === name.toLowerCase())) { showToast('⚠️ ' + name + ' exists!', true); return; }
            
            let newId = nextPlayerId++;
            grp.players.push({ id: newId, name: name });
            knownStats[newId] = false; 
            inp.value = '';
            renderGroups();
            scheduleSave();
            setTimeout(() => {
                let card = document.querySelector(`.grp-card[data-gid="${gid}"]`);
                if (card) card.classList.add('open');
                let newInp = document.getElementById('newPlayer-' + gid);
                if (newInp) newInp.focus();
            }, 50);
        }

        function deletePlayer(gid, pid) {
            let grp = data.groups.find(g => g.id === gid);
            if (!grp) return;
            grp.players = grp.players.filter(p => p.id !== pid);
            fetch('/api/stats/player_del?pid=' + pid).catch(e=>{});
            delete knownStats[pid];
            renderGroups();
            setTimeout(() => { let card = document.querySelector(`.grp-card[data-gid="${gid}"]`); if (card) card.classList.add('open'); }, 50);
            scheduleSave();
        }

        function renamePlayer(gid, pid, newName) {
            newName = sanitizePlayerName(newName);
            let grp = data.groups.find(g => g.id === gid);
            if (!grp) return;
            let player = grp.players.find(p => p.id === pid);
            if (player && newName) { player.name = newName; scheduleSave(); }
        }

        function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveData, 800); }

        function saveData() {
            fetch('/api/players', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
            .then(r => { if (r.ok) showToast('💾 Saved'); else showToast('❌ Save failed!', true); })
            .catch(e => showToast('❌ Connection error!', true));
        }

        function showToast(msg, isError) {
            let t = document.getElementById('toast');
            t.textContent = msg;
            t.style.background = isError ? 'var(--danger)' : 'var(--success)';
            t.style.color = isError ? '#fff' : '#000';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        // =====================================================================
        // CSV GRUPPEN-EXPORT LOGIK (Bleibt erhalten)
        // =====================================================================
        async function openStatsExport(gid) {
            let grp = data.groups.find(g => g.id === gid);
            if (!grp) return;
            currentExportGroupName = grp.name;
            currentExportData = {};
            showToast(t('pm_export_loading', 'Lade Daten vom ESP32...'), false);

            let promises = grp.players.map(async (p) => {
                if (knownStats[p.id]) {
                    try {
                        let r = await fetch('/s_' + p.id + '.csv?_t=' + Date.now());
                        if (r.ok) { let text = await r.text(); parsePlayerCSVForExport(p.name, text); }
                    } catch(e) {}
                }
            });

            await Promise.all(promises);
            let gameIds = Object.keys(currentExportData);
            if (gameIds.length === 0) { showToast(t('pm_export_empty', 'Keine Spieldaten gefunden.'), true); return; }

            let txtDesc = t('pm_export_desc', 'Wähle die Spiele, die du als CSV exportieren möchtest:');
            let txtEntries = t('pm_export_entries', 'Einträge');

            let html = `<p style="margin-top:0; color:var(--text-muted); font-size:0.9rem;">${txtDesc}</p><div style="text-align:left; margin-top:10px;">`;
            gameIds.forEach(gId => {
                let info = GAME_DICT[gId] || { name: "Game " + gId };
                let count = currentExportData[gId].length;
                html += `
                    <label style="display:flex; align-items:center; padding:12px; background:var(--card-hover); margin-bottom:8px; border-radius:6px; cursor:pointer; border:1px solid var(--border-color);">
                        <input type="checkbox" class="stats-export-cb" value="${gId}" checked style="width:20px; height:20px; margin:0 15px 0 0;">
                        <span style="flex:1; font-weight:bold; color:var(--text-main);">${info.name}</span>
                        <span style="color:var(--text-muted); font-size:0.85rem;">${count} ${txtEntries}</span>
                    </label>`;
            });
            html += `</div>`;
            document.getElementById('statsExportBody').innerHTML = html;
            document.getElementById('statsExportOverlay').classList.add('show');
        }

        function parsePlayerCSVForExport(playerName, text) {
            let lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
            lines.forEach(line => {
                let parts = line.split(';');
                if (parts.length >= 3) {
                    let ts = parseInt(parts[0]);
                    let gId = parseInt(parts[1]);
                    let score = parseInt(parts[2]);
                    let ex1 = parts.length >= 4 ? parts[3] : "0"; 
                    let ex2 = parts.length >= 5 ? parts[4] : "0"; 
                    let ex3 = parts.length >= 6 ? parts[5] : "0"; 
                    let ex4 = parts.length >= 7 ? parts[6] : "0"; 
                    let ex5 = parts.length >= 8 ? parts[7] : "0"; 
                    if (!currentExportData[gId]) currentExportData[gId] = [];
                    currentExportData[gId].push({ name: playerName, ts, score, ex1, ex2, ex3, ex4, ex5 });
                }
            });
        }

        function closeStatsExport() { document.getElementById('statsExportOverlay').classList.remove('show'); }

        function executeStatsExport() {
            let checkboxes = document.querySelectorAll('.stats-export-cb:checked');
            if (checkboxes.length === 0) return;
            let delay = 0;
            checkboxes.forEach(cb => { setTimeout(() => downloadGameCSV(cb.value), delay); delay += 400; });
            closeStatsExport();
            showToast(t('pm_export_started', 'Download gestartet...'), false);
        }

        function formatValueForExport(val, type) {
            if (type === "ms_to_s") return (parseInt(val) / 1000).toFixed(3).replace('.', ',');
            if (type === "ms_to_s1") return (parseInt(val) / 1000).toFixed(1).replace('.', ',');
            if (type === "bool") return parseInt(val) === 1 ? "1" : "0";
            return val;
        }

        function downloadGameCSV(gId) {
            let info = GAME_DICT[gId] || { name: "Game " + gId, lblScore: "Score", lblExtra: "Extra", fmtE: "num" };
            let entries = currentExportData[gId] || [];
            entries.sort((a, b) => b.ts - a.ts);

            let txtName = t('ps_name', 'Name');
            let txtDate = t('ps_date', 'Datum');
            let txtTime = t('ps_time_h', 'Uhrzeit');

            let header = `${txtName};${txtDate};${txtTime};${info.lblScore}`;
            if (info.fmtE !== "none") header += `;${info.lblExtra}`;
            if (info.lblEx2) header += `;${info.lblEx2}`;
            if (info.lblEx3) header += `;${info.lblEx3}`;
            if (info.lblEx4) header += `;${info.lblEx4}`;
            if (info.lblEx5) header += `;${info.lblEx5}`;
            let lines = [header];

            entries.forEach(e => {
                let d = new Date(e.ts);
                let dateStr = d.toLocaleDateString('de-DE');
                let timeStr = d.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                
                let line = `${e.name};${dateStr};${timeStr};${formatValueForExport(e.score, info.fmtS)}`;
                if (info.fmtE !== "none") line += `;${formatValueForExport(e.ex1, info.fmtE)}`;
                if (info.lblEx2) line += `;${formatValueForExport(e.ex2, info.fmtEx2)}`;
                if (info.lblEx3) line += `;${formatValueForExport(e.ex3, info.fmtEx3)}`;
                if (info.lblEx4) line += `;${formatValueForExport(e.ex4, info.fmtEx4)}`;
                if (info.lblEx5) line += `;${formatValueForExport(e.ex5, info.fmtEx5)}`;
                lines.push(line);
            });

            let csvStr = lines.join('\r\n');
            let blob = new Blob(['\uFEFF' + csvStr], { type: 'text/csv;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            let safeGrpName = currentExportGroupName.replace(/[^a-zA-Z0-9]/g, '_');
            let safeGameName = info.name.replace(/[^a-zA-Z0-9]/g, '_');
            let stamp = new Date().toISOString().split('T')[0];
            
            let a = document.createElement('a');
            a.href = url;
            a.download = `Stats_${safeGrpName}_${safeGameName}_${stamp}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // =====================================================================
        // FULL SYSTEM BACKUP (Spieler + Highscores + Alle Statistiken)
        // =====================================================================
        async function createFullBackup() {
            showToast(t('pm_backup_wait', 'Erstelle Backup... Bitte warten.'), false);
            let backup = {
                type: "puckracer_full_backup",
                version: 1,
                players: data, 
                stats: {},
                highscores: {}
            };

            let allPlayers = [];
            data.groups.forEach(g => g.players.forEach(p => allPlayers.push(p.id)));

            // 1. Lade alle CSVs aller Spieler
            for (let pid of allPlayers) {
                try {
                    let r = await fetch('/s_' + pid + '.csv?_t=' + Date.now());
                    if (r.ok) {
                        let text = await r.text();
                        if (text.trim().length > 0) backup.stats[pid] = text;
                    }
                } catch(e) {}
            }

            // 2. Lade alle möglichen Highscore JSONs (Anhand des GAME_DICT)
            for (let gId in GAME_DICT) {
                try {
                    let r = await fetch('/api/highscore/get?game=' + gId + '&_t=' + Date.now());
                    if (r.ok) {
                        let text = await r.text();
                        if (text && text.trim() !== "{}" && text.trim() !== "") {
                            backup.highscores[gId] = text;
                        }
                    }
                } catch(e) {}
            }

            // 3. Backup als Blob packen und herunterladen
            let blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            let url = URL.createObjectURL(blob);
            let dlAnchorElem = document.createElement('a');
            dlAnchorElem.href = url;
            let d = new Date();
            let stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
            dlAnchorElem.download = "PuckRacer_FullBackup_" + stamp + ".json";
            document.body.appendChild(dlAnchorElem);
            dlAnchorElem.click();
            document.body.removeChild(dlAnchorElem);
            URL.revokeObjectURL(url);

            showToast(t('pm_backup_done', '✅ System-Backup erfolgreich heruntergeladen!'));
        }

        // =====================================================================
        // IMPORT MANAGER (Full Restore & CSV)
        // =====================================================================
        function openImport() {
            parsedImport = [];
            pendingFullBackup = null;
            document.getElementById('importText').value = '';
            document.getElementById('importText').style.display = 'block';
            document.getElementById('importHintText').style.display = 'block';
            document.getElementById('importPreview').style.display = 'none';
            document.getElementById('previewBtn').style.display = 'inline-block';
            
            let btn = document.getElementById('importBtn');
            btn.innerText = t('pm_do_import', 'Import');
            btn.className = "btn-primary";
            btn.disabled = true;
            btn.onclick = executeImport;
            
            document.getElementById('importOverlay').classList.add('show');
        }

        function closeImport() { document.getElementById('importOverlay').classList.remove('show'); }

        (function() {
            let drop = document.getElementById('importDrop');
            if (!drop) return;
            drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
            drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
            drop.addEventListener('drop', e => {
                e.preventDefault(); drop.classList.remove('dragover');
                if (e.dataTransfer.files.length) handleImportFile(e.dataTransfer.files[0]);
            });
        })();

        function handleImportFile(file) {
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) { 
                let content = e.target.result; 
                
                // Prüfen ob es unser JSON Backup ist
                try {
                    let json = JSON.parse(content);
                    if (json.type === "puckracer_full_backup") {
                        pendingFullBackup = json;
                        document.getElementById('importText').style.display = 'none';
                        document.getElementById('importHintText').style.display = 'none';
                        document.getElementById('previewBtn').style.display = 'none';
                        
                        let pCount = json.players && json.players.groups ? json.players.groups.reduce((acc, g) => acc + g.players.length, 0) : 0;
                        let sCount = Object.keys(json.stats || {}).length;
                        let hCount = Object.keys(json.highscores || {}).length;

                        document.getElementById('importPreview').innerHTML = `
                            <div style="text-align:center; padding:20px;">
                                <div style="font-size:3rem; margin-bottom:10px;">📦</div>
                                <h3 style="color:var(--primary); margin-top:0;">${t('pm_res_title', 'Vollständiges Backup erkannt')}</h3>
                                <ul style="text-align:left; display:inline-block; margin:0 auto; color:var(--text-main);">
                                    <li>👥 ${pCount} Spieler</li>
                                    <li>📊 ${sCount} Statistiken (CSVs)</li>
                                    <li>👑 ${hCount} Highscores</li>
                                </ul>
                                <p style="color:var(--danger); font-weight:bold; margin-top:15px;">${t('pm_res_warn', 'Achtung: Ein Restore überschreibt alle aktuellen Daten auf dem ESP32!')}</p>
                            </div>
                        `;
                        document.getElementById('importPreview').style.display = 'block';
                        
                        let btn = document.getElementById('importBtn');
                        btn.innerText = t('pm_res_btn', "RESTORE STARTEN");
                        btn.className = "btn-danger";
                        btn.disabled = false;
                        btn.onclick = executeFullRestore;
                        return;
                    }
                } catch(err) {}

                // Fallback: Text Import
                pendingFullBackup = null;
                document.getElementById('importText').value = content; 
                previewImport(); 
            };
            reader.readAsText(file);
        }

        // --- FULL RESTORE STREAMING ---
        async function executeFullRestore() {
            if (!pendingFullBackup) return;
            if (!confirm(t('pm_res_confirm', "Bist du sicher? Alle bisherigen Spieler, Statistiken und Highscores werden gelöscht und mit dem Backup überschrieben!"))) return;

            let btn = document.getElementById('importBtn');
            btn.disabled = true;
            btn.innerText = "Wiederherstellen...";

            try {
                // 1. Restore Players
                showToast("Stelle Spieler wieder her...", false);
                await fetch('/api/players', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pendingFullBackup.players) });

                // 2. Restore Highscores
                showToast("Stelle Highscores wieder her...", false);
                for (let gId in pendingFullBackup.highscores) {
                    let fd = new URLSearchParams();
                    fd.append('game', gId);
                    fd.append('data', pendingFullBackup.highscores[gId]);
                    await fetch('/api/highscore/save', { method: 'POST', body: fd });
                }

                // 3. Restore Stats (Line by Line Streaming zum ESP32 RAM-Schutz)
                let statKeys = Object.keys(pendingFullBackup.stats);
                for (let i = 0; i < statKeys.length; i++) {
                    let pid = statKeys[i];
                    showToast(`Schreibe Statistik (${i+1}/${statKeys.length})...`, false);
                    
                    await fetch('/api/stats/player_del?pid=' + pid); // Alte löschen

                    let csv = pendingFullBackup.stats[pid];
                    let lines = csv.split(/\r?\n/).filter(l => l.trim().length > 0);
                    for (let line of lines) {
                        let parts = line.split(';');
                        if (parts.length >= 3) {
                            let fd = new URLSearchParams();
                            fd.append('pid', pid);
                            fd.append('ts', parts[0]);
                            fd.append('game', parts[1]);
                            fd.append('score', parts[2]);
                            if(parts.length > 3) fd.append('ex1', parts[3]);
                            if(parts.length > 4) fd.append('ex2', parts[4]);
                            if(parts.length > 5) fd.append('ex3', parts[5]);
                            if(parts.length > 6) fd.append('ex4', parts[6]);
                            if(parts.length > 7) fd.append('ex5', parts[7]);
                            await fetch('/api/stats/player_save', { method: 'POST', body: fd });
                            
                            await new Promise(r => setTimeout(r, 10)); // 10ms Atempause für den Webserver
                        }
                    }
                }

                showToast("✅ Restore komplett erfolgreich!", false);
                setTimeout(() => { location.reload(); }, 1500);

            } catch (e) {
                showToast("❌ Fehler beim Restore! Verbindung getrennt?", true);
                btn.disabled = false;
                btn.innerText = t('pm_res_btn', "RESTORE STARTEN");
            }
        }

        // --- OLD TEXT/CSV IMPORT ---
        function previewImport() {
            let text = document.getElementById('importText').value;
            parsedImport = parseImportText(text);
            let preview = document.getElementById('importPreview');
            let table = document.getElementById('importTable');
            let btn = document.getElementById('importBtn');

            if (parsedImport.length === 0) {
                preview.style.display = 'block';
                table.innerHTML = '<tr><td style="color:var(--danger)">No valid entries found.</td></tr>';
                btn.disabled = true;
                return;
            }

            let html = `<tr><th style="color:var(--text-muted);font-size:0.75rem;">GROUP</th><th style="color:var(--text-muted);font-size:0.75rem;">NAME</th></tr>`;
            parsedImport.forEach(e => { html += `<tr><td class="col-grp">${escHTML(e.group)}</td><td class="col-name">${escHTML(e.name)}</td></tr>`; });
            html += `<tr><td colspan="2" style="color:var(--success);padding-top:8px;font-weight:bold;">✓ ${parsedImport.length} entries</td></tr>`;
            table.innerHTML = html;
            preview.style.display = 'block';
            btn.disabled = false;
        }

        function parseImportText(text) {
            if (!text || !text.trim()) return [];
            if (text.charCodeAt(0) === 0xFEFF) text = text.substring(1);
            let lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length === 0) return [];
            let firstLower = lines[0].toLowerCase();
            if (firstLower.includes('name') && (firstLower.includes('group') || firstLower.includes('gruppe') || firstLower.includes('class') || firstLower.includes('klasse') || firstLower.includes('team'))) { lines.shift(); }
            
            let sample = lines.slice(0, 10).join('\n');
            let delim = null;
            if (sample.includes('\t')) delim = '\t';
            else if (sample.includes(';')) delim = ';';
            else {
                let commaLines = lines.filter(l => l.includes(',')).length;
                if (commaLines > lines.length * 0.5) delim = ',';
            }

            let entries = [];
            for (let line of lines) {
                if (delim) {
                    let parts = splitRespectingQuotes(line, delim);
                    if (parts.length >= 2) {
                        let group = sanitizeGroupName(parts[0]);
                        let name = sanitizePlayerName(parts[1]);
                        if (name) entries.push({ group: group || 'Import', name });
                    } else if (parts.length === 1) {
                        let name = sanitizePlayerName(parts[0]);
                        if (name) entries.push({ group: 'Import', name });
                    }
                } else {
                    let name = sanitizePlayerName(line);
                    if (name) entries.push({ group: 'Import', name });
                }
            }
            return entries;
        }

        function splitRespectingQuotes(line, delim) {
            let parts = []; let current = ''; let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                let ch = line[i];
                if (ch === '"') { inQuotes = !inQuotes; continue; }
                if (ch === delim && !inQuotes) { parts.push(current.trim()); current = ''; continue; }
                current += ch;
            }
            parts.push(current.trim());
            return parts;
        }

        function executeImport() {
            if (parsedImport.length === 0) return;
            let added = 0;
            parsedImport.forEach(entry => {
                let grp = data.groups.find(g => g.name.toLowerCase() === entry.group.toLowerCase());
                if (!grp) { grp = { id: nextGroupId++, name: entry.group, players: [] }; data.groups.push(grp); }
                if (!grp.players.some(p => p.name.toLowerCase() === entry.name.toLowerCase())) {
                    let newId = nextPlayerId++;
                    grp.players.push({ id: newId, name: entry.name }); 
                    knownStats[newId] = false; 
                    added++;
                }
            });
            closeImport();
            renderGroups();
            scheduleSave();
            showToast(`✓ ${added} players imported`);
        }
    </script>
</body>
