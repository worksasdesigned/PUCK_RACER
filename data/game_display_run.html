<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Display DJ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-ctrl { display:flex; gap:10px; margin-bottom:15px; }
        .mode-btn { flex:1; padding:12px; font-weight:bold; background:var(--card-hover); border:2px solid var(--border-color); color:var(--text-main); cursor:pointer; border-radius:6px;}
        .mode-active { background: var(--primary); border-color: #fff; box-shadow:0 0 10px var(--primary); color:white;}
        
        .dj-panel { display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px; margin-bottom:20px;}
        @media (max-width: 700px) { .dj-panel { grid-template-columns: 1fr; } }
        
        .panel-box { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);}
        .panel-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; color:var(--primary);}
        
        /* Parameter Controls */
        .param-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap:10px;}
        .target-sel { width: 100%; padding: 10px; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; font-size: 1rem; }
        input[type="color"] { width: 60px; height: 40px; border: none; cursor: pointer; background:none; }
        
        .speed-btns { display:flex; width:100%; gap:5px; }
        .speed-btn { flex:1; background:var(--card-hover); border:1px solid var(--border-color); padding:8px; color:var(--text-main); border-radius:4px; cursor:pointer; }
        .speed-btn.active { background:var(--text-main); color:var(--bg-color); border-color:var(--text-main);}
        
        /* Effects Grid */
        .eff-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap:8px; }
        .btn-eff { background: var(--card-hover); color:var(--text-main); border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.1s;}
        .btn-eff:active { transform: scale(0.95); background: var(--primary); color:white;}
        
        /* Live Monitor */
        .monitor-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:10px; }
        .m-card { background:var(--bg-color); border:1px solid var(--border-color); padding:10px; border-radius:6px; text-align:center; border-left:5px solid #fff;}
        .m-name { font-weight:bold; font-size:1.1rem; margin-bottom:5px; color:var(--text-main);}
        .m-eff { color:var(--text-muted); font-size:0.85rem; margin-bottom:8px; height:20px;}
        .btn-mute { background:var(--card-hover); color:var(--text-main); border:none; padding:5px 10px; border-radius:4px; cursor:pointer; width:100%;}
        .btn-mute.muted { background:var(--danger); color:white; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_display">Display DJ 🎛️</div>
     <div class="status-bar">
    <div class="status-dot dot-green" id="cnt-green">0</div>
    <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
    <div class="status-dot dot-red" id="cnt-red">0</div>
</div>
    </header>
    
    <main>
        <div class="top-ctrl">
            <button onclick="setMode('man')" id="btn-man" class="mode-btn mode-active" data-i18n="disp_run_dj">🎛️ DJ Mode</button>
            <button onclick="setMode('rand')" id="btn-rand" class="mode-btn" data-i18n="disp_run_rand">🔀 Auto Random</button>
            <button onclick="setMode('sync')" id="btn-sync" class="mode-btn" data-i18n="disp_run_sync">✨ Auto Sync</button>
        </div>
        
        <div class="dj-panel">
            <div class="panel-box">
                <div class="panel-title" data-i18n="disp_run_p1">1. Setup Parameters</div>
                
                <div class="param-row">
                    <label data-i18n="disp_run_target">Target:</label>
                    <select id="selTarget" class="target-sel">
                        <option value="-1">All Pucks</option>
                    </select>
                </div>
                
                <div class="param-row">
                    <label data-i18n="disp_run_color">Color:</label>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <input type="color" id="colPick" value="#ff0000">
                        <label><input type="checkbox" id="chkRandCol"> <span data-i18n="disp_run_rnd">Random</span></label>
                    </div>
                </div>
                
                <div class="param-row">
                    <label data-i18n="disp_run_speed">Speed:</label>
                    <div class="speed-btns">
                        <button class="speed-btn" id="spd100" onclick="setSpeed(100)" data-i18n="disp_opt_slow">Slow</button>
                        <button class="speed-btn active" id="spd40" onclick="setSpeed(40)" data-i18n="disp_opt_norm">Norm</button>
                        <button class="speed-btn" id="spd10" onclick="setSpeed(10)" data-i18n="disp_opt_fast">Fast</button>
                    </div>
                </div>
                
                <div class="param-row" style="margin-top:20px; flex-direction:column; align-items:stretch;">
                    <label><span data-i18n="disp_run_bright">Brightness:</span> <span id="briVal" style="float:right; font-weight:bold; color:var(--primary);">100%</span></label>
                    <input type="range" id="briSlider" min="10" max="255" value="200" oninput="document.getElementById('briVal').innerText = Math.round((this.value/255)*100) + '%'" style="width:100%; margin-top:5px;">
                </div>
                
                <button onclick="fetch('/api/game/action?cmd=snd_-1')" class="btn-primary" style="width:100%; margin-top:15px;" data-i18n="disp_btn_beep">🔊 Global Beep</button>
            </div>
            
            <div class="panel-box">
                <div class="panel-title" data-i18n="disp_run_p2">2. Trigger Effect</div>
                <div class="eff-grid" id="effGrid">
                    </div>
                <button onclick="triggerEff(0)" class="btn-danger" style="width:100%; margin-top:15px; padding:15px;" data-i18n="disp_btn_off">TURN OFF</button>
            </div>
        </div>
        
        <div class="panel-box" style="margin-bottom:20px;">
            <div class="panel-title" data-i18n="disp_run_mon">Live Monitor</div>
            <div id="monitorGrid" class="monitor-grid">Loading...</div>
        </div>

        <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
<script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        const EFFECTS = [
            { id: 1, name: "Static" }, { id: 2, name: "Blink" }, { id: 3, name: "Breathe" },
            { id: 6, name: "Chase" }, { id: 7, name: "Dbl Chase" }, { id: 8, name: "Split Rot" },
            { id: 9, name: "Rainbow" }, { id: 11, name: "Loading" }, { id: 14, name: "Flash" },
            { id: 15, name: "Sparkle" }, { id: 16, name: "Police" }, { id: 18, name: "Progress" },
            { id: 5, name: "Breathe x4" }, { id: 17, name: "Status" }
        ];
        
        let currentSpeed = 40;
        let isFirstLoad = true;

        let effHtml = "";
        EFFECTS.forEach(e => {
            effHtml += `<button class="btn-eff" onclick="triggerEff(${e.id})">${e.name}</button>`;
        });
        document.getElementById('effGrid').innerHTML = effHtml;
        
        document.getElementById('selTarget').innerHTML = `<option value="-1">${getTranslation('disp_run_all')}</option>`;

        function setSpeed(val) {
            currentSpeed = val;
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('spd'+val).classList.add('active');
        }

        function triggerEff(effId) {
            let target = document.getElementById('selTarget').value;
            let bri = document.getElementById('briSlider').value;
            
            let r, g, b;
            if (document.getElementById('chkRandCol').checked && effId !== 9) { 
                r = Math.floor(Math.random() * 255);
                g = Math.floor(Math.random() * 255);
                b = Math.floor(Math.random() * 255);
            } else {
                let hex = document.getElementById('colPick').value;
                r = parseInt(hex.substring(1,3), 16);
                g = parseInt(hex.substring(3,5), 16);
                b = parseInt(hex.substring(5,7), 16);
            }
            
            let cmd = `play,${target},${effId},${r},${g},${b},${currentSpeed},${bri}`;
            fetch(`/api/game/action?cmd=${cmd}`);
        }

        setInterval(update, 500);
        
        function update() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                 
                
                document.getElementById('btn-man').className = (data.mode === 0) ? "mode-btn mode-active" : "mode-btn";
                document.getElementById('btn-rand').className = (data.mode === 1) ? "mode-btn mode-active" : "mode-btn";
                document.getElementById('btn-sync').className = (data.mode === 2) ? "mode-btn mode-active" : "mode-btn";
                
                let monHtml = "";
                let sel = document.getElementById('selTarget');

                data.pucks.forEach(p => {
                    let name = sessionStorage.getItem(`p_name_${p.id}`) || `Puck ${p.id}`;
                    let effObj = EFFECTS.find(x => x.id === p.eff);
                    let effName = effObj ? effObj.name : (p.eff === 0 ? "OFF" : "ID " + p.eff);
                    
                    if (sel.options.length <= data.pucks.length && sel.querySelector(`option[value="${p.id}"]`) === null) {
                        sel.innerHTML += `<option value="${p.id}">${name}</option>`;
                    }
                    
                    monHtml += `
                    <div class="m-card" style="border-left-color:${p.col}">
                        <div class="m-name">${name}</div>
                        <div class="m-eff">${effName}</div>
                        <div style="display:flex; gap:5px;">
                            <button class="btn-mute ${p.muted?'muted':''}" onclick="fetch('/api/game/action?cmd=mute_${p.id}')">${p.muted?'🔇':'🔊'}</button>
                            <button class="btn-mute" style="border:1px solid var(--border-color);" onclick="fetch('/api/game/action?cmd=snd_${p.id}')">🎵</button>
                        </div>
                    </div>`;
                });
                
                document.getElementById('monitorGrid').innerHTML = monHtml;
            }).catch(e => {});
        }
        
        function setMode(m) { fetch('/api/game/action?cmd=mode_' + m); }
        function goHome() { fetch('/api/game/action?cmd=exit').then(() => location.href = '/'); }
    </script>
</body>
</html>
