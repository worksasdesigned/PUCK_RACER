<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Names - Bomb Squad</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .player-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background:var(--card-bg); padding:10px; border-radius:8px; border-left: 5px solid #fff;}
        .color-box { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; transition: all 0.3s;}
        input[type=text] { flex-grow: 1; padding: 12px; font-size: 1.1rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main); }
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="bomb_names_title">Names - Bomb Squad</div></header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initializing...</div>

        <div id="content" style="display:none;">
            <div class="layout-card" id="layoutCard">
                <div class="layout-header" onclick="toggleLayout()">
                    <span>Aufbau</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody">
                    <div style="text-align:center; width:100%;">
                        <div id="arenaContainer" style="overflow-x: auto;"></div>
                    </div>
                </div>
            </div>

            <div id="pickerBar" style="margin-bottom:15px;">
                <button onclick="loadFromPicker()" class="btn-primary" style="font-size:1.1rem; background:var(--card-hover); border:1px dashed var(--primary); color:var(--primary);">
                    👥 <span data-i18n="pp_load_players">Load Players from List</span>
                </button>
            </div>
            
            <div id="playerList" class="card"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="location.href='game_bomb_setup.html'" class="btn-warn" style="font-size:1.2rem;" data-i18n="btn_back">⬅ BACK</button>
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game">TO GAME 🏁</button>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="player_picker.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const COLORS = ['#0000FF', '#00FF00', '#FF0000', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#800080', '#40E0D0', '#FFC0CB', '#FFFFFF'];
        const BOMB_COORDS = ["A1", "D1", "A2", "D2", "A3", "D3", "A4", "D4", "A5", "D5"];
        
        let activePucks = parseInt(sessionStorage.getItem('bomb_pucks') || 1);
        let groupMode = parseInt(sessionStorage.getItem('bomb_group') || 0);
        let numPlayers = groupMode ? 1 : activePucks;

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initList, 500);
        });

        async function initList() {
            try {
                await fetch('/api/game/load?id=8');

                activePucks = parseInt(sessionStorage.getItem('bomb_pucks') || 1);
                let time = parseInt(sessionStorage.getItem('bomb_time') || 10);
                let diff = parseInt(sessionStorage.getItem('bomb_diff') || 1);
                let rounds = parseInt(sessionStorage.getItem('bomb_rounds') || 5);
                groupMode = parseInt(sessionStorage.getItem('bomb_group') || 0);
                numPlayers = groupMode ? 1 : activePucks;

                await fetch(`/api/game/action?cmd=cfg_pucks&val=${activePucks}`);
                await fetch(`/api/game/action?cmd=cfg_time&val=${time}`);
                await fetch(`/api/game/action?cmd=cfg_diff&val=${diff}`);
                await fetch(`/api/game/action?cmd=cfg_rounds&val=${rounds}`);
                await fetch(`/api/game/action?cmd=cfg_group&val=${groupMode}`);
                
                await fetch('/api/game/action?cmd=setup');

                // 1. Leere Tabelle generieren
                let tableHtml = `<table class="arena-table">`;
                const cols = ['A', 'B', 'C', 'D', 'E'];
                for(let r = 1; r <= 5; r++) {
                    tableHtml += `<tr>`;
                    for(let c = 0; c < 5; c++) {
                        tableHtml += `<td id="cell-${cols[c]}${r}"></td>`;
                    }
                    tableHtml += `</tr>`;
                }
                tableHtml += `</table>`;
                document.getElementById('arenaContainer').innerHTML = tableHtml;

                // 2. Pucks und Personen füllen
                for(let i = 0; i < activePucks; i++) {
                    let coord = BOMB_COORDS[i];
                    let color = COLORS[i % COLORS.length];
                    
                    let cell = document.getElementById(`cell-${coord}`);
                    if(cell) cell.innerHTML = `<div class="puck-icon" id="puck_vis_${i}" style="background:${color}">${i+1}</div>`;

                    if(coord.startsWith('A')) {
                        document.getElementById(`cell-B${coord.charAt(1)}`).innerHTML = `<div style="font-size:1.5rem">🧎</div>`;
                    } else if(coord.startsWith('D')) {
                        document.getElementById(`cell-E${coord.charAt(1)}`).innerHTML = `<div style="font-size:1.5rem">🧎</div>`;
                    }
                }

                // 3. Spielerliste generieren
                let container = document.getElementById('playerList');
                container.innerHTML = "";
                let ph = groupMode ? "Team" : "Bombe";

                for(let i=0; i<numPlayers; i++) {
                    let color = COLORS[i % COLORS.length];
                    let name = sessionStorage.getItem(`p_name_${i}`) || `${ph} ${i+1}`;
                    container.innerHTML += `
                    <div class="player-row" style="border-left-color: ${color}">
                        <div class="color-box" id="cb_${i}" style="background:${color};"></div>
                        <input type="text" id="name_${i}" value="${name}" placeholder="${ph}">
                    </div>`;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                setInterval(pollPuckEffects, 1500);

            } catch (error) {
                console.error("Fehler:", error);
            }
        }

        async function pollPuckEffects() {
            try {
                let r = await fetch('/api/effects');
                let data = await r.json();
                data.forEach(eff => {
                    const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                    
                    let cb = document.getElementById(`cb_${eff.id}`);
                    if(cb) { cb.style.background = rgb; cb.style.boxShadow = `0 0 10px ${rgb}`; }

                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        vis.className = "puck-icon";
                        if(eff.eff == 3) vis.classList.add('eff-breathe');
                        if(eff.eff == 6) vis.classList.add('eff-chase');
                        vis.style.background = rgb;
                        vis.style.boxShadow = `0 0 15px ${rgb}`;
                    }
                });
            } catch(e) {}
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }

        function loadFromPicker() {
            openPlayerPicker(numPlayers, function(selected) {
                selected.forEach((p, i) => {
                    let inp = document.getElementById('name_' + i);
                    if (inp) { inp.value = p.name; sessionStorage.setItem('p_name_' + i, p.name); }
                });
            });
        }

        function startGame() {
            for(let i=0; i<numPlayers; i++) {
                let val = document.getElementById(`name_${i}`).value;
                sessionStorage.setItem(`p_name_${i}`, val);
            }
            location.href = 'game_bomb_run.html';
        }
    </script>
</body>
</html>
