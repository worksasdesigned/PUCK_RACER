<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Layout - TTTT</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .player-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background:var(--card-bg); padding:10px; border-radius:8px; border-left: 5px solid #fff;}
        .color-box { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; transition: all 0.3s;}
        input[type=text] { flex-grow: 1; padding: 12px; font-size: 1.1rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main); }
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="g_tttt">Tactical TicTacToe</div></header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initializing...</div>
        
        <div id="content" style="display:none;">
            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span data-i18n="pm_track_layout">Streckenaufbau</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody">
                    <div style="text-align:center; width:100%;">
                        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:15px;">
                            Puck 1 (Rainbow) ist der Auswahl-Puck beim Werfer. Die anderen Pucks bilden das Spielfeld.
                        </p>
                        <div id="arenaContainer" style="overflow-x: auto; margin-bottom:20px;"></div>
                    </div>
                </div>
            </div>

            <div id="pickerBar" style="margin-bottom:15px;">
                <button onclick="loadFromPicker()" class="btn-primary" style="font-size:1.1rem; background:var(--card-hover); border:1px dashed var(--primary); color:var(--primary);">
                    👥 <span data-i18n="pp_load_players">Load Players</span>
                </button>
            </div>
            
            <div id="playerList"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="location.href='game_tttt_setup.html'" class="btn-warn" style="font-size:1.2rem;" data-i18n="btn_back">⬅ BACK</button>
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game">START GAME 🏁</button>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="player_picker.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const PLAYER_COLORS = ['#0000FF', '#FF0000', '#00FF00']; // Blau, Rot, Grün
        
        // ACHTUNG: Der Auswahlpuck ist IMMER der erste im Array (Index 0).
        const LAYOUTS = {
            4: ["B3", "D2", "D3", "D4"], // B3 = Selector
            6: ["A3", "C2", "E2", "D3", "C4", "E4"], // A3 = Selector
            7: ["A3", "D2", "E2", "D3", "E3", "D4", "E4"], // A3 = Selector
            10: ["A3", "C2", "D2", "E2", "C3", "D3", "E3", "C4", "D4", "E4"] // A3 = Selector
        };
        
        let numPlayers = parseInt(sessionStorage.getItem('tttt_ply') || 2);
        let numPucks = parseInt(sessionStorage.getItem('tttt_pucks') || 10);
        const delay = ms => new Promise(res => setTimeout(res, ms));

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initList, 500);
        });

        async function initList() {
            // Achtung: IDs verwalten. Game_TTTT z.B. ID 27! In GameManager anpassen!
            await fetch('/api/game/load?id=27'); 
            
            await fetch(`/api/game/action?cmd=cfg_ply&val=${numPlayers}`);
            await delay(100);
            await fetch(`/api/game/action?cmd=cfg_pucks&val=${numPucks}`);
            await delay(100);
            await fetch(`/api/game/action?cmd=cfg_hard&val=${sessionStorage.getItem('tttt_hard') || 0}`);
            await delay(100);
            await fetch(`/api/game/action?cmd=cfg_auto&val=${sessionStorage.getItem('tttt_auto') || 0}`);
            await delay(100);
            
            await fetch('/api/game/action?cmd=setup');
            await delay(100);
            await fetch('/api/game/action?cmd=show_layout');
            
            // 1. Tabelle generieren
            let tableHtml = `<table class="arena-table">`;
            const cols = ['A', 'B', 'C', 'D', 'E'];
            for(let r = 1; r <= 5; r++) {
                tableHtml += `<tr>`;
                for(let c = 0; c < 5; c++) { tableHtml += `<td id="cell-${cols[c]}${r}"></td>`; }
                tableHtml += `</tr>`;
            }
            tableHtml += `</table>`;
            document.getElementById('arenaContainer').innerHTML = tableHtml;

            // 2. Layout wählen
            let activeLayout = LAYOUTS[numPucks] || LAYOUTS[10];

            for(let i = 0; i < numPucks && i < activeLayout.length; i++) {
                let coord = activeLayout[i];
                let cell = document.getElementById(`cell-${coord}`);
                
                let extraHtml = (i === 0) ? `<div style="font-size:0.6rem; margin-top:-5px;">SELECT</div>` : "";
                
                if(cell) {
                    cell.innerHTML = `<div class="puck-icon" id="puck_vis_${i}">${i+1}${extraHtml}</div>`;
                }
            }

            // 3. Spielerliste
            let container = document.getElementById('playerList');
            container.innerHTML = "";
            for(let i=0; i<numPlayers; i++) {
                let name = sessionStorage.getItem(`p_name_${i}`) || `Player ${i+1}`;
                let col = PLAYER_COLORS[i];
                container.innerHTML += `
                <div class="player-row" style="border-left-color: ${col};">
                    <div class="color-box" style="background:${col}; box-shadow:0 0 10px ${col};"></div>
                    <input type="text" id="name_${i}" value="${name}" placeholder="Player ${i+1}">
                </div>`;
            }
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            setInterval(pollPuckEffects, 1500);
        }

        async function pollPuckEffects() {
            try {
                let r = await fetch('/api/effects');
                let data = await r.json();
                data.forEach(eff => {
                    const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                        if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                        if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                        if(eff.eff == 9) vis.classList.add('eff-rainbow');
                        
                        if(eff.eff == 18 || eff.eff == 8) { // Progress
                            let percent = Math.round(eff.dur / 2.55);
                            vis.style.background = `conic-gradient(${rgb} ${percent}%, var(--border-color) ${percent}%)`;
                            vis.style.border = `2px solid ${rgb}`;
                        } else if (eff.eff == 9) { // Rainbow Selector
                            vis.style.background = 'linear-gradient(45deg, red, orange, yellow, green, blue, purple)';
                            vis.style.border = `2px solid #fff`;
                        } else {
                            vis.style.background = rgb;
                            vis.style.border = `2px solid #fff`;
                        }
                        vis.style.boxShadow = (eff.eff == 9) ? `0 0 15px rgba(255,255,255,0.6)` : `0 0 15px ${rgb}`;
                    }
                });
            } catch(e) {}
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }

        function loadFromPicker() {
            openPlayerPicker(numPlayers, function(selected) {
                selected.forEach((p, i) => {
                    let inp = document.getElementById('name_' + i);
                    if (inp) { inp.value = p.name; sessionStorage.setItem('p_name_' + i, p.name); }
                });
            });
        }

        function startGame() {
            for(let i=0; i<numPlayers; i++) {
                sessionStorage.setItem(`p_name_${i}`, document.getElementById(`name_${i}`).value);
            }
            setTimeout(() => { location.href = 'game_tttt_run.html'; }, 200);
        }
    </script>
</body>
</html>
