<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuckRacer - System Busy</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .header-bar { display: flex; justify-content: flex-end; max-width: 500px; margin: 0 auto; margin-bottom: 10px; }
        .lang-btn { background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 1rem; }
        
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; border-top: 5px solid #ff4444; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #ff4444; margin-top: 0; }
        p { font-size: 1rem; line-height: 1.5; color: #aaa; margin-bottom: 10px; }
        
        .spinner { border: 3px solid #333; border-top: 3px solid #0f0; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-box { background: #111; padding: 10px; border-radius: 8px; border: 1px solid #333; margin: 20px 0; display: flex; align-items: center; justify-content: center; color: #0f0; }

        /* Simon Game CSS */
        .game-area { margin-top: 30px; border-top: 1px dashed #444; padding-top: 20px; }
        .simon-board { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 250px; margin: 20px auto; }
        .simon-btn { width: 100px; height: 100px; border-radius: 50%; cursor: pointer; opacity: 0.3; transition: opacity 0.1s, transform 0.1s; margin: 0 auto; border: 4px solid #222; }
        
        /* Die 4 Farben */
        .simon-btn.green { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .simon-btn.red { background: #ff0000; box-shadow: 0 0 10px #ff0000; }
        .simon-btn.yellow { background: #ffff00; box-shadow: 0 0 10px #ffff00; }
        .simon-btn.blue { background: #0088ff; box-shadow: 0 0 10px #0088ff; }
        
        .simon-btn.active, .simon-btn:active { opacity: 1; transform: scale(0.95); border-color: #fff; }
        
        .start-btn { background: #0088ff; color: #fff; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1rem; font-weight: bold; width: 100%; max-width: 250px; }
        .score-display { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #fff; }
    </style>
</head>
<body>
    <div class="header-bar">
        <button class="lang-btn" id="langToggle" onclick="toggleLang()">🇩🇪 DE</button>
    </div>

    <div class="card">
        <h1 id="lbl_title">⚠️ System Busy</h1>
        <p id="lbl_desc1">The PuckRacer system is currently controlled by another device.</p>
        <p id="lbl_desc2" style="font-size: 0.85rem;">To prevent input chaos, only one person can control the system at a time.</p>
        
        <div id="occupantInfo" style="margin-top:10px; font-weight:bold; color:#fa0; display:block;">
            <span id="lbl_occupied">Occupied by: </span><span id="activeDevice" style="color:#fff;">Lade...</span>
        </div>

        <div class="status-box">
            <div class="spinner"></div>
            <span id="lbl_wait">Waiting for release...</span>
        </div>

        <div class="game-area">
            <h3 id="lbl_game_title" style="margin-top:0;">Play Simon Says while you wait!</h3>
            <div class="score-display"><span id="lbl_score">Score: </span><span id="scoreVal">0</span></div>
            
            <button class="start-btn" id="btn_start" onclick="startGame()">START GAME</button>

            <div class="simon-board">
                <div class="simon-btn green" id="btn-green" onclick="handleInput('green')"></div>
                <div class="simon-btn red" id="btn-red" onclick="handleInput('red')"></div>
                <div class="simon-btn yellow" id="btn-yellow" onclick="handleInput('yellow')"></div>
                <div class="simon-btn blue" id="btn-blue" onclick="handleInput('blue')"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. INTEGRIERTES WÖRTERBUCH (Kein extra Download nötig!) ---
        const langDict = {
            en: {
                "o1d_title": "⚠️ System Busy",
                "o1d_desc1": "The PuckRacer system is currently controlled by another device.",
                "o1d_desc2": "To prevent input chaos, only one person can control the system at a time.",
                "o1d_wait": "Waiting for release...",
                "o1d_game_title": "Play Simon Says while you wait!",
                "o1d_btn_start": "START GAME",
                "o1d_score": "Score: ",
                "o1d_win": "🎉 You won! Level 20 reached!",
                "o1d_lose": "Game Over! Score: ",
                "o1d_occupied": "Occupied by: "
            },
            de: {
                "o1d_title": "⚠️ System besetzt",
                "o1d_desc1": "Das PuckRacer System wird gerade von einem anderen Gerät gesteuert.",
                "o1d_desc2": "Um Chaos bei den Eingaben zu vermeiden, kann immer nur eine Person gleichzeitig steuern.",
                "o1d_wait": "Warte auf Freigabe...",
                "o1d_game_title": "Spiel Simon Says während du wartest!",
                "o1d_btn_start": "SPIEL STARTEN",
                "o1d_score": "Punkte: ",
                "o1d_win": "🎉 Gewonnen! Level 20 erreicht!",
                "o1d_lose": "Verloren! Punkte: ",
                "o1d_occupied": "Besetzt durch: "
            }
        };

        // --- 2. LANGUAGE LOGIC ---
        let currentLang = 'en';
        try {
            if(localStorage.getItem('puck_lang')) {
                currentLang = localStorage.getItem('puck_lang');
            }
        } catch(e) {
            console.warn("Storage blockiert (Captive Portal).");
        }

        function toggleLang() {
            currentLang = (currentLang === 'en') ? 'de' : 'en';
            try { localStorage.setItem('puck_lang', currentLang); } catch(e) {}
            applyTranslations();
        }

        function applyTranslations() {
            const t = langDict[currentLang];
            document.getElementById('lbl_title').innerText = t.o1d_title;
            document.getElementById('lbl_desc1').innerText = t.o1d_desc1;
            document.getElementById('lbl_desc2').innerText = t.o1d_desc2;
            document.getElementById('lbl_wait').innerText = t.o1d_wait;
            document.getElementById('lbl_game_title').innerText = t.o1d_game_title;
            document.getElementById('btn_start').innerText = t.o1d_btn_start;
            document.getElementById('lbl_score').innerText = t.o1d_score;
            document.getElementById('lbl_occupied').innerText = t.o1d_occupied;
            document.getElementById('langToggle').innerText = (currentLang === 'en') ? '🇩🇪 DE' : '🇬🇧 EN';
        }
        applyTranslations();


        // --- 3. BACKGROUND POLLING & DEVICE INFO ---
        function fetchActiveDevice() {
            fetch('/api/who_is_active')
                .then(r => r.text())
                .then(name => {
                    document.getElementById('activeDevice').innerText = name;
                })
                .catch(e => {
                    document.getElementById('activeDevice').innerText = "Unbekannt";
                });
        }
        fetchActiveDevice();

        function checkSystemFree() {
            fetch('/api/status').then(r => {
                if(r.status === 200) location.href = '/'; 
            }).catch(e => {});
        }
        setInterval(checkSystemFree, 4000);


        // --- 4. AUDIO ENGINE ---
        let audioCtx = null;
        const tones = { 'green': 415, 'red': 310, 'yellow': 252, 'blue': 209, 'fail': 150 };

        function initAudio() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}
        }

        function playTone(color, type = 'sine', duration = 300) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = type; 
                osc.frequency.setValueAtTime(tones[color], audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration / 1000));
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + (duration / 1000));
            } catch(e) {}
        }


        // --- 5. SIMON SAYS GAME LOGIC ---
        const colors = ['green', 'red', 'yellow', 'blue'];
        let sequence = [];
        let playerStep = 0;
        let score = 0;
        let isPlaying = false;
        let waitingForInput = false;

        function startGame() {
            initAudio(); 
            checkSystemFree(); 
            sequence = [];
            score = 0;
            isPlaying = true;
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('btn_start').style.display = 'none';
            nextRound();
        }

        function nextRound() {
            playerStep = 0;
            waitingForInput = false;
            sequence.push(colors[Math.floor(Math.random() * 4)]);
            setTimeout(playSequence, 800); 
        }

        function playSequence() {
            let i = 0;
            let interval = setInterval(() => {
                flashButton(sequence[i]);
                i++;
                if (i >= sequence.length) {
                    clearInterval(interval);
                    waitingForInput = true; 
                }
            }, 600); 
        }

        function flashButton(color) {
            playTone(color); 
            let btn = document.getElementById('btn-' + color);
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 300);
        }

        function handleInput(color) {
            initAudio(); 
            checkSystemFree();

            if (!isPlaying || !waitingForInput) return;
            
            if (color !== sequence[playerStep]) {
                isPlaying = false;
                playTone('fail', 'square', 800); 
                
                let btn = document.getElementById('btn-' + color);
                btn.style.boxShadow = "0 0 20px #ff0000";
                setTimeout(() => btn.style.boxShadow = "", 500);

                setTimeout(() => {
                    alert(langDict[currentLang].o1d_lose + score);
                    document.getElementById('btn_start').style.display = 'inline-block';
                }, 100);
                return;
            }

            flashButton(color);
            playerStep++;
            
            if (playerStep === sequence.length) {
                score++;
                document.getElementById('scoreVal').innerText = score;
                waitingForInput = false;
                
                if (score >= 20) {
                    isPlaying = false;
                    setTimeout(() => {
                        alert(langDict[currentLang].o1d_win);
                        document.getElementById('btn_start').style.display = 'inline-block';
                    }, 400);
                    return;
                }
                nextRound();
            }
        }
    </script>
</body>
</html>
