<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Names - Simon Runs</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .player-row { background:var(--card-bg); padding:15px; margin-bottom:10px; border-radius:8px; border-left:5px solid var(--border-color); }
        .color-dot { display:inline-block; width:15px; height:15px; border-radius:50%; margin-right:5px; vertical-align:middle; border:1px solid #fff; transition: all 0.3s;}
        input[type=text] { flex-grow: 1; padding: 10px; font-size: 1.1rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-main); }
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="simr_names_title">Setup Teams</div></header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initializing...</div>
        
        <div id="content" style="display:none;">
            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span>Spielfeld Aufbau</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody" style="flex-direction: column; align-items: center; gap: 20px;">
                    <p style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin:0;">
                        Alle Gruppen spielen in der gleichen Arena. Der Puck mit dem 👁️ ist die Anzeige!
                    </p>
                    <div id="arenaContainer" style="overflow-x: auto;"></div>
                </div>
            </div>

            <div id="pickerBar" style="margin-bottom:15px;">
                <button onclick="loadFromPicker()" class="btn-primary" style="font-size:1.1rem; background:var(--card-hover); border:1px dashed var(--primary); color:var(--primary);">
                    👥 <span data-i18n="pp_load_players">Load Players from List</span>
                </button>
            </div>
            
            <div id="centralContainer"></div>
            <div id="playerList"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="nav('game_simonruns_setup.html')" class="btn-warn" style="font-size:1.2rem;" data-i18n="btn_back">⬅ BACK</button>
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game">START GAME 🏁</button>
            </div>
        </div>
    </main>

<script src="lang.js"></script>
    <script src="script.js"></script>
<script src="player_picker.js"></script>
<script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const COLORS = ["red", "blue", "yellow"]; 
        const HEX_COLORS = ["#FF0000", "#0000FF", "#FFFF00"];

        let numGroups = parseInt(sessionStorage.getItem('sr_groups') || 1);
        let central = parseInt(sessionStorage.getItem('sr_central') || 0);

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initList, 500);
        });

        async function initList() {
            try {
                await fetch('/api/game/load?id=6');

                numGroups = parseInt(sessionStorage.getItem('sr_groups') || 1);
                let len = parseInt(sessionStorage.getItem('sr_len') || 10);
                central = parseInt(sessionStorage.getItem('sr_central') || 0);
                let blnd = parseInt(sessionStorage.getItem('sr_blind') || 0);

                await fetch(`/api/game/action?cmd=cfg_groups&val=${numGroups}`);
                await fetch(`/api/game/action?cmd=cfg_len&val=${len}`);
                await fetch(`/api/game/action?cmd=cfg_central&val=${central}`);
                await fetch(`/api/game/action?cmd=cfg_blind&val=${blnd}`);
                await fetch('/api/game/action?cmd=setup');
                
                // Pucks abfragen
                let res = await fetch('/api/status');
                let data = await res.json();
                let pCount = data.filter(p => p.active).length;
                
                // Logik für Pucks pro Gruppe berechnen (wie im Backend)
                let displayCount = (central && numGroups > 1) ? 1 : numGroups;
                let nPpg = Math.floor((pCount - displayCount) / numGroups);

                // FIX 2: Layout Dynamisch berechnen
                let displayPucks = [];
                if (central || numGroups === 1) {
                    displayPucks = ["A3"];
                } else if (numGroups === 2) {
                    displayPucks = ["A1", "A5"];
                } else if (numGroups === 3) {
                    displayPucks = ["A1", "A3", "A5"];
                }

                let targetPucks = [];
                if (numGroups === 1) {
                    if (nPpg === 3) targetPucks = ["E2","E3","E4"];
                    else if (nPpg === 4) targetPucks = ["D2","E2","D4","E4"];
                    else if (nPpg === 5) targetPucks = ["C2","E2","D3","C4","E4"];
                    else targetPucks = ["D2","E2","D3","E3","D4","E4"]; // 6 oder mehr
                } else if (numGroups === 2) {
                    if (nPpg === 3) targetPucks = ["D1","E1","E2", "E4","D5","E5"];
                    else targetPucks = ["D1","E1","D2","E2", "D4","E4","D5","E5"]; // 4 oder mehr
                } else if (numGroups === 3) {
                    targetPucks = ["C1","D1","E1", "C3","D3","E3", "C5","D5","E5"]; // 3 oder mehr
                }

                // 1. Tabelle generieren
                let tableHtml = `<table class="arena-table">`;
                const cols = ['A', 'B', 'C', 'D', 'E'];
                for(let r = 1; r <= 5; r++) {
                    tableHtml += `<tr>`;
                    for(let c = 0; c < 5; c++) {
                        tableHtml += `<td id="cell-${cols[c]}${r}"></td>`;
                    }
                    tableHtml += `</tr>`;
                }
                tableHtml += `</table>`;
                document.getElementById('arenaContainer').innerHTML = tableHtml;

                // 2. & 3. Pucks exakt nach Backend ID Verteilung einsetzen
                let pIdx = 0;

                if (central && numGroups > 1) {
                    // Central Display (Puck 0)
                    let cell = document.getElementById(`cell-${displayPucks[0]}`);
                    if(cell) cell.innerHTML = `<div class="puck-icon" id="puck_vis_0" style="background:white; border:2px solid white;"><div style="position:absolute; top:-12px; font-size:1rem;">👁️</div>0</div>`;
                    pIdx = 1;
                    
                    // Input Pucks für alle Gruppen
                    for(let g=0; g<numGroups; g++) {
                        let hexCol = HEX_COLORS[g%3];
                        for(let p=0; p<nPpg; p++) {
                            let coordIdx = (g * nPpg) + p;
                            if (coordIdx < targetPucks.length) {
                                let coord = targetPucks[coordIdx];
                                let cell = document.getElementById(`cell-${coord}`);
                                if(cell && coord) cell.innerHTML = `<div class="puck-icon" id="puck_vis_${pIdx}" style="background:${hexCol}">${pIdx}</div>`;
                            }
                            pIdx++;
                        }
                    }
                } else {
                    // 1 Display Puck pro Gruppe
                    for(let g=0; g<numGroups; g++) {
                        let hexCol = HEX_COLORS[g%3];
                        
                        // Display Puck der Gruppe
                        if (g < displayPucks.length) {
                            let dCell = document.getElementById(`cell-${displayPucks[g]}`);
                            if(dCell) dCell.innerHTML = `<div class="puck-icon" id="puck_vis_${pIdx}" style="background:${hexCol}; border:2px solid #fff;"><div style="position:absolute; top:-12px; font-size:1rem;">👁️</div>${pIdx}</div>`;
                        }
                        pIdx++;
                        
                        // Input Pucks der Gruppe
                        for(let p=0; p<nPpg; p++) {
                            let coordIdx = (g * nPpg) + p;
                            if (coordIdx < targetPucks.length) {
                                let coord = targetPucks[coordIdx];
                                let iCell = document.getElementById(`cell-${coord}`);
                                if(iCell && coord) iCell.innerHTML = `<div class="puck-icon" id="puck_vis_${pIdx}" style="background:${hexCol}">${pIdx}</div>`;
                            }
                            pIdx++;
                        }
                    }
                }

                renderUI();
                await fetch('/api/game/action?cmd=preview');
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                setInterval(pollPuckEffects, 1500);

            } catch (e) {
                console.error(e);
            }
        }

        function renderUI() {
            let htmlC = "";
            if(central && numGroups > 1) {
                htmlC = `
                <div class="player-row" style="border-left-color:white;">
                    <h4><span class="color-dot eff-rainbow" style="background:white; border:none;"></span> ${getTranslation('simr_names_cent_t') || 'Zentrale Anzeige'}</h4>
                    <p style="color:var(--text-muted); font-size:0.9rem;">${getTranslation('simr_names_cent_d') || 'Startet das Spiel hier.'}</p>
                </div>`;
            }
            document.getElementById('centralContainer').innerHTML = htmlC;

            let htmlG = "";
            let tName = getTranslation('simr_names_team') || 'Team';
            let tLook = getTranslation('simr_names_look') || 'Achtet auf';

            for(let i=0; i<numGroups; i++) {
                let col = COLORS[i%3];
                let hexCol = HEX_COLORS[i%3];
                let savedName = sessionStorage.getItem(`p_name_${i}`) || `Team ${i+1}`;
                htmlG += `
                <div class="player-row" style="border-left-color:${hexCol};">
                    <label>${tName} (<span class="color-dot" id="cb_${i}" style="background:${hexCol};"></span>${col.toUpperCase()})</label>
                    <input type="text" id="name_${i}" value="${savedName}" 
                           oninput="saveName(${i}, this.value)" 
                           style="width:100%; margin-top:5px;">
                    <p style="color:var(--text-muted); font-size:0.8rem; margin-top:5px;">${tLook} ${col}.</p>
                </div>`;
            }
            document.getElementById('playerList').innerHTML = htmlG;
        }

        async function pollPuckEffects() {
            try {
                let r = await fetch('/api/effects');
                let data = await r.json();
                data.forEach(eff => {
                    const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                    
                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                        if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                        if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                        if(eff.eff == 9) vis.classList.add('eff-rainbow');
                        
                        if (eff.eff !== 0) vis.style.boxShadow = `0 0 15px ${rgb}`;
                        else vis.style.boxShadow = 'none';
                    }
                });
            } catch(e) {}
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }
        
        function loadFromPicker() {
            openPlayerPicker(numGroups, function(selected) {
                selected.forEach((p, i) => {
                    let inp = document.getElementById('name_' + i);
                    if (inp) { inp.value = p.name; sessionStorage.setItem('p_name_' + i, p.name); }
                });
            });
        }

        function saveName(id, val) { sessionStorage.setItem(`p_name_${id}`, val); }

        function startGame() { nav('game_simonruns_run.html'); }
    </script>
</body>
</html>
