<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Translation Editor - PuckRacer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header { padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        header h1 { margin: 0; font-size: 1.1rem; color: var(--primary); white-space: nowrap; }
        .head-controls { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar { width: 240px; min-width: 240px; background: var(--card-bg); border-right: 1px solid var(--border-color); overflow-y: auto; padding: 10px 0; }
        .cat-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; padding: 10px 16px; background: none; border: none; color: var(--text-muted); cursor: pointer; border-left: 3px solid transparent; font-size: 0.9rem; transition: 0.2s; }
        .cat-btn:hover { background: var(--card-hover); color: var(--text-main); }
        .cat-btn.active { background: var(--card-hover); border-left-color: var(--primary); color: var(--text-main); font-weight: bold; }
        .cat-count { font-size: 0.75rem; color: var(--text-muted); background: var(--bg-color); padding: 2px 8px; border-radius: 10px; }
        .cat-section { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 12px 16px 4px; font-weight: bold; }

        .editor-area { flex: 1; padding: 20px; overflow-y: auto; }

        .trans-row { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .trans-key { font-family: monospace; color: var(--primary); font-size: 0.85rem; margin-bottom: 5px; font-weight: bold; }

        .trans-cols { display: flex; gap: 20px; }
        .col { flex: 1; display: flex; flex-direction: column; }
        .col label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }

        .ref-text { background: var(--bg-color); border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; color: var(--text-muted); font-size: 0.95rem; min-height: 40px; word-wrap: break-word; }
        textarea { background: var(--card-hover); border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; color: var(--text-main); font-size: 0.95rem; font-family: inherit; resize: vertical; min-height: 40px; }
        textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 5px rgba(49, 130, 206, 0.3); }

        select { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px; border-radius: 4px; font-size: 1rem; }

        @media (max-width: 700px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; max-height: 150px; border-right: none; border-bottom: 1px solid var(--border-color); display: flex; flex-wrap: wrap; padding: 5px; gap: 4px; }
            .cat-btn { width: auto; padding: 6px 12px; font-size: 0.8rem; border-left: none; border-bottom: 2px solid transparent; }
            .cat-btn.active { border-left: none; border-bottom-color: var(--primary); }
            .cat-section { display: none; }
            .trans-cols { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌍 Translation Editor</h1>
        <div class="head-controls">
            <button class="btn-danger" id="btnReset" onclick="restoreFactory()" style="padding:6px 10px; font-size:0.8rem;" title="Requires lang.bac on the system">↺ Reset</button>
            <select id="langSelect" onchange="renderEditor()" style="font-size:0.85rem;"></select>
            <button class="btn-warn" onclick="nav('/settings.html')" style="padding:6px 10px; font-size:0.8rem;">⬅</button>
            <button class="btn-primary" id="btnSave" onclick="saveTranslations()" style="padding:6px 12px; font-size:0.8rem; font-weight:bold;">💾 SAVE</button>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar" id="sidebar"></div>
        <div class="editor-area" id="editorArea">
            <h2 id="catTitle" style="margin-top:0; color:var(--text-main);">Select a Category</h2>
            <div id="editorRows"></div>
        </div>
    </div>

    <script src="lang.js"></script>
    <script src="script.js"></script>

    <script>
        const CATEGORIES = [
            // --- System ---
            { section: "System", name: "General UI", prefixes: ["btn_", "lbl_", "loading", "conn_", "req_", "unit_", "err_", "confirm_", "alert_", "puck_"] },
            { name: "Menu & Dashboard", prefixes: ["g_", "desc_", "setup_", "ex_", "img_", "help_", "menu_", "modal_", "filter_", "ios_"] },
            { name: "Settings & Parameters", prefixes: ["settings_", "set_", "param_", "pucks_", "warn_"] },
            { name: "Player Manager", prefixes: ["pm_"] },
            { name: "Player Picker", prefixes: ["pp_"] },
            { name: "Player Stats", prefixes: ["ps_"] },
            { name: "Training Manager", prefixes: ["tm_"] },
            // --- Games ---
            { section: "Games", name: "Stopwatch", prefixes: ["sw_"] },
            { name: "Timer", prefixes: ["tmr_"] },
            { name: "Countdown", prefixes: ["cd_"] },
            { name: "Simple Counter", prefixes: ["cnt_"] },
            { name: "Shuttle Run", prefixes: ["sr_"] },
            { name: "Beep Test", prefixes: ["bp_"] },
            { name: "Simon Says", prefixes: ["sim_"] },
            { name: "Simon Runs", prefixes: ["simr_"] },
            { name: "Zombie Escape", prefixes: ["z_"] },
            { name: "Whac-A-Mole", prefixes: ["whac_"] },
            { name: "React 2-Player", prefixes: ["r2_"] },
            { name: "Target Touch", prefixes: ["tgt_"] },
            { name: "Ball Prellen", prefixes: ["bal_"] },
            { name: "Agility T-Test", prefixes: ["tt_"] },
            { name: "Domination", prefixes: ["dom_"] },
            { name: "Red Green Light", prefixes: ["rg_"] },
            { name: "Sorting Hat", prefixes: ["sort_"] },
            { name: "Bomb Squad", prefixes: ["bomb_"] },
            { name: "Pacemaker", prefixes: ["cr_"] },
            { name: "Memory Sprint", prefixes: ["mem_"] },
            { name: "Tabata", prefixes: ["tab_"] },
            { name: "Hunt!", prefixes: ["h_"] },
            { name: "Catch the Light", prefixes: ["bat_", "ctl_"] },
            { name: "Cat Reflexes", prefixes: ["cat_"] },
            { name: "Musical Chairs", prefixes: ["mus_"] },
            { name: "Tactical TicTacToe", prefixes: ["tttt_"] },
            { name: "Pitstop", prefixes: ["pit_"] },
            { name: "Display Mode", prefixes: ["disp_"] }
        ];

        let currentCatIndex = 0;
        let activeLang = 'de';

        window.onload = () => {
            initLangSelect();
            initSidebar();
            renderEditor();
        };

        function countKeys(cat) {
            var enKeys = Object.keys(TRANSLATIONS['en']);
            return enKeys.filter(k => cat.prefixes.some(p => k.startsWith(p))).length;
        }

        function countUncategorized() {
            var enKeys = Object.keys(TRANSLATIONS['en']);
            return enKeys.filter(k => !CATEGORIES.some(cat => cat.prefixes.some(p => k.startsWith(p)))).length;
        }

        function initLangSelect() {
            const select = document.getElementById('langSelect');
            select.innerHTML = '';
            for (let lang in TRANSLATIONS) {
                let opt = document.createElement('option');
                opt.value = lang;
                opt.innerText = lang.toUpperCase();
                if (lang === activeLang) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function initSidebar() {
            const sb = document.getElementById('sidebar');
            sb.innerHTML = '';

            CATEGORIES.forEach((cat, index) => {
                if (cat.section) {
                    let sec = document.createElement('div');
                    sec.className = 'cat-section';
                    sec.innerText = cat.section;
                    sb.appendChild(sec);
                }
                let btn = document.createElement('button');
                let cnt = countKeys(cat);
                btn.className = 'cat-btn' + (index === currentCatIndex ? ' active' : '');
                btn.innerHTML = '<span>' + cat.name + '</span><span class="cat-count">' + cnt + '</span>';
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCatIndex = index;
                    renderEditor();
                };
                sb.appendChild(btn);
            });

            let uncatCount = countUncategorized();
            if (uncatCount > 0) {
                let sec = document.createElement('div');
                sec.className = 'cat-section';
                sec.innerText = 'Other';
                sb.appendChild(sec);

                let btn = document.createElement('button');
                btn.className = 'cat-btn' + (CATEGORIES.length === currentCatIndex ? ' active' : '');
                btn.innerHTML = '<span>Uncategorized</span><span class="cat-count">' + uncatCount + '</span>';
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCatIndex = CATEGORIES.length;
                    renderEditor();
                };
                sb.appendChild(btn);
            }
        }

        function renderEditor() {
            activeLang = document.getElementById('langSelect').value;
            const enKeys = Object.keys(TRANSLATIONS['en']);

            let targetCategory = CATEGORIES[currentCatIndex];
            document.getElementById('catTitle').innerText = targetCategory ? targetCategory.name : "Uncategorized";

            const container = document.getElementById('editorRows');
            container.innerHTML = '';

            let matchedKeys = [];
            enKeys.forEach(key => {
                let isMatch = false;
                if (targetCategory) {
                    isMatch = targetCategory.prefixes.some(p => key.startsWith(p));
                } else {
                    isMatch = !CATEGORIES.some(cat => cat.prefixes.some(p => key.startsWith(p)));
                }
                if (isMatch) matchedKeys.push(key);
            });

            if (matchedKeys.length === 0) {
                container.innerHTML = "<p style='color:var(--text-muted);'>No translations found for this category.</p>";
                return;
            }

            matchedKeys.forEach(key => {
                let enText = TRANSLATIONS['en'][key];
                let targetText = TRANSLATIONS[activeLang][key] || "";

                let row = document.createElement('div');
                row.className = 'trans-row';

                var isEn = activeLang === 'en';
                row.innerHTML = `
                    <div class="trans-key">${key}</div>
                    <div class="trans-cols">
                        ${isEn ? '' : '<div class="col"><label>English (Reference)</label><div class="ref-text">' + enText + '</div></div>'}
                        <div class="col">
                            <label>${isEn ? 'English' : activeLang.toUpperCase() + ' Translation'}</label>
                            <textarea id="inp-${key}" onchange="updateValue('${key}', this.value)">${targetText}</textarea>
                        </div>
                    </div>
                `;
                container.appendChild(row);

                let ta = document.getElementById(`inp-${key}`);
                ta.style.height = 'auto';
                ta.style.height = (ta.scrollHeight) + 'px';
            });
        }

        function updateValue(key, value) {
            TRANSLATIONS[activeLang][key] = value;
        }

        function showCacheHint() {
            if (document.getElementById('cacheHint')) return;
            var overlay = document.createElement('div');
            overlay.id = 'cacheHint';
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:99999;display:flex;justify-content:center;align-items:center;';
            overlay.innerHTML = '<div style="background:var(--card-bg);border:2px solid var(--success);border-radius:12px;padding:30px;max-width:400px;text-align:center;">' +
                '<div style="font-size:2rem;margin-bottom:15px;">✅</div>' +
                '<h2 style="color:var(--success);margin:0 0 15px;">Saved successfully!</h2>' +
                '<p style="color:var(--text-muted);font-size:0.9rem;line-height:1.6;margin:0 0 20px;">' +
                'Your changes have been saved to the Coordinator.<br><br>' +
                '<strong style="color:var(--warning);">Important:</strong> Your browser may still show cached texts on other pages. ' +
                'Close all browser tabs and reopen the app to see your changes everywhere.</p>' +
                '<button onclick="location.reload()" class="btn-primary" style="padding:10px 30px;font-size:1rem;margin-right:10px;">OK, reload Editor</button>' +
                '<button onclick="document.getElementById(\'cacheHint\').remove()" class="btn-back" style="padding:10px 20px;font-size:0.85rem;">Continue editing</button>' +
                '</div>';
            document.body.appendChild(overlay);
        }

        async function saveTranslations() {
            let btn = document.getElementById('btnSave');
            btn.innerText = "⏳ SAVING...";
            btn.style.opacity = 0.7;
            btn.style.pointerEvents = "none";

            let jsContent = "const TRANSLATIONS = " + JSON.stringify(TRANSLATIONS, null, 4) + ";\n\n";

            jsContent += `
let currentLang = localStorage.getItem('puck_lang') || 'en';

function setLanguage(langCode) {
    currentLang = langCode;
    localStorage.setItem('puck_lang', currentLang);
    applyTranslations();
}

function getTranslation(key) {
    if (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) return TRANSLATIONS[currentLang][key];
    if (TRANSLATIONS['en'] && TRANSLATIONS['en'][key]) return TRANSLATIONS['en'][key];
    return key;
}

function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        let key = el.getAttribute('data-i18n');
        let text = getTranslation(key);
        if (el.tagName === 'INPUT' && el.hasAttribute('placeholder')) {
            el.setAttribute('placeholder', text);
        } else {
            el.innerHTML = text;
        }
    });
}

document.addEventListener('DOMContentLoaded', applyTranslations);
`;

            const file = new File([jsContent], "lang.js", { type: "application/javascript" });
            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch('/upload_file', { method: 'POST', body: formData });

                if (response.ok) {
                    btn.innerText = "✅ SAVED!";
                    btn.style.background = "var(--success)";
                    btn.style.color = "#fff";
                    setTimeout(() => { showCacheHint(); }, 1500);
                } else {
                    alert("Error saving file to ESP32!");
                    btn.innerText = "❌ ERROR";
                }
            } catch (e) {
                alert("Network error: " + e);
                btn.innerText = "❌ ERROR";
            }
        }

        async function restoreFactory() {
            if (!confirm("⚠️ WARNING: Do you really want to restore the factory settings?\n\nAll your custom translations will be permanently lost!\n(Requires a 'lang.bac' file on the ESP32)")) {
                return;
            }

            let btn = document.getElementById('btnReset');
            let oldText = btn.innerText;
            btn.innerText = "⏳ ...";
            btn.style.pointerEvents = "none";

            try {
                const resBac = await fetch('/lang.bac');
                if (!resBac.ok) {
                    alert("❌ Error: No 'lang.bac' file found on the system!\n\nPlease upload a copy of your original lang.js named 'lang.bac' via the Update Center to use this feature.");
                    btn.innerText = oldText;
                    btn.style.pointerEvents = "auto";
                    return;
                }

                const bacContent = await resBac.text();
                const file = new File([bacContent], "lang.js", { type: "application/javascript" });
                const formData = new FormData();
                formData.append("file", file);

                const resUpload = await fetch('/upload_file', { method: 'POST', body: formData });

                if (resUpload.ok) {
                    alert("✅ Factory settings successfully restored!\nThe page will now reload.");
                    location.reload();
                } else {
                    alert("❌ Failed to overwrite lang.js!");
                    btn.innerText = oldText;
                    btn.style.pointerEvents = "auto";
                }
            } catch (e) {
                alert("Network error: " + e);
                btn.innerText = oldText;
                btn.style.pointerEvents = "auto";
            }
        }
    </script>
</body>
</html>
