<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Sorting Hat Live</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .big-counter { font-size: 4rem; font-weight: bold; text-align: center; color: var(--text-main); margin-bottom: 5px; }
        .sub-counter { text-align: center; color: var(--text-muted); font-size: 1.2rem; margin-bottom: 20px; }
        
        .grp-row { 
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-hover); padding: 15px; margin-bottom: 10px; 
            border-radius: 8px; border-left: 8px solid var(--border-color);
        }
        .grp-name { font-size: 1.5rem; font-weight: bold; }
        .grp-count { font-size: 2rem; font-weight: bold; color:var(--text-main);}
        
        .balance-container { display: flex; flex-direction: column; gap: 5px; }
        .balance-hint { 
            font-size: 0.9rem; color: var(--text-main); 
            background: rgba(128,128,128,0.2); padding: 5px 10px; border-radius: 4px;
            display: flex; align-items: center; gap: 8px; width: fit-content;
        }
        .arrow { font-size: 1.2rem; }
        .target-dot { width: 15px; height: 15px; border-radius: 50%; display: inline-block; border:1px solid #fff;}
        
        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; }
        .bottom-nav { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_sorting">Sorting Hat 🎩</div>
     <div class="status-bar">
    <div class="status-dot dot-green" id="cnt-green">0</div>
    <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
    <div class="status-dot dot-red" id="cnt-red">0</div>
</div>
    </header>

    <main>
        <div class="big-counter" id="mainCnt">0</div>
        <div class="sub-counter" id="subCnt" data-i18n="loading">Waiting...</div>

        <div class="controls">
            <button onclick="goBack()" class="btn-warn btn-ctrl" data-i18n="btn_back">⬅</button>
            <button id="btnStart" onclick="doAction('start')" class="btn-primary btn-ctrl" data-i18n="btn_start">START</button>
            <button onclick="doAction('stop')" class="btn-danger btn-ctrl" data-i18n="btn_stop">STOP</button>
        </div>

        <div id="groupList"></div>

        <div class="bottom-nav">
            <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
<script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        const COLORS = ['#FF0000', '#0000FF', '#00FF00', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#FFFFFF'];
        
        let txtLeft = getTranslation('sort_run_left');
        let txtMove = getTranslation('sort_run_move');
        let txtDone = getTranslation('lbl_done');
        let txtStart = getTranslation('btn_start');
        let txtRun = getTranslation('btn_running');
        let txtRestart = getTranslation('btn_reset');

        setInterval(update, 250);

        function update() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                 
                render(data);
            }).catch(e => {});
        }

        function render(data) {
            let total = data.total;
            let done = data.done;
            let groups = data.groups; 
            
            let btn = document.getElementById('btnStart');
            if(data.state == 0) { 
                btn.innerText = txtStart; 
                btn.style.background = "var(--primary)"; 
                btn.style.color = "white";
            }
            else if(data.state == 1 || data.state == 2) { 
                btn.innerText = txtRun; 
                btn.style.background = "var(--card-hover)"; 
                btn.style.color = "var(--text-muted)";
            }
            else if(data.state == 3) { 
                btn.innerText = txtRestart; 
                btn.style.background = "var(--success)"; 
                btn.style.color = "white";
            }
            
            document.getElementById('mainCnt').innerText = done;
            document.getElementById('subCnt').innerText = (total - done) <= 0 ? txtDone : `${total - done} ${txtLeft}`;

            let balanceMoves = [];
            if ((data.state == 3) && done > 0 && done < total) {
                balanceMoves = calcBalance(groups, done);
            }

            let container = document.getElementById('groupList');

            groups.forEach((count, i) => {
                let name = getTranslation(`sort_names_${i}`);
                let col = COLORS[i];
                
                let moves = balanceMoves.filter(m => m.from === i);
                let balInfoHtml = "";
                
                if (moves.length > 0) {
                    balInfoHtml = `<div class="balance-container">`;
                    moves.forEach(m => {
                        let targetCol = COLORS[m.to];
                        balInfoHtml += `
                        <div class="balance-hint">
                            <span>${txtMove} <b>${m.amount}</b></span>
                            <span class="arrow">➡</span>
                            <div class="target-dot" style="background:${targetCol}"></div>
                        </div>`;
                    });
                    balInfoHtml += `</div>`;
                }

                let rowId = `sg-row-${i}`;
                let rowEl = document.getElementById(rowId);

                if (!rowEl) {
                    container.insertAdjacentHTML('beforeend', `
                    <div id="${rowId}" class="grp-row" style="border-left-color: ${col}">
                        <div>
                            <div class="grp-name" style="color:${col}">${name}</div>
                            <div id="bal-${i}">${balInfoHtml}</div>
                        </div>
                        <div class="grp-count" id="cnt-${i}">${count}</div>
                    </div>`);
                } else {
                    document.getElementById(`cnt-${i}`).innerText = count;
                    let balEl = document.getElementById(`bal-${i}`);
                    if (balEl.innerHTML !== balInfoHtml) balEl.innerHTML = balInfoHtml;
                }
            });
        }

        function calcBalance(groups, currentTotal) {
            let moves = [];
            let numGroups = groups.length;
            
            let baseTarget = Math.floor(currentTotal / numGroups);
            let remainder = currentTotal % numGroups;
            
            let targets = [];
            for(let i=0; i<numGroups; i++) {
                targets[i] = baseTarget + (i < remainder ? 1 : 0);
            }

            let givers = [];
            let receivers = [];

            for(let i=0; i<numGroups; i++) {
                let diff = groups[i] - targets[i];
                if(diff > 0) givers.push({id: i, amount: diff});
                if(diff < 0) receivers.push({id: i, amount: -diff}); 
            }

            givers.forEach(g => {
                while(g.amount > 0 && receivers.length > 0) {
                    let r = receivers[0];
                    let moveAmount = Math.min(g.amount, r.amount);
                    moves.push({from: g.id, to: r.id, amount: moveAmount});
                    g.amount -= moveAmount;
                    r.amount -= moveAmount;
                    if(r.amount === 0) receivers.shift(); 
                }
            });
            return moves;
        }

        function doAction(cmd) { fetch(`/api/game/action?cmd=${cmd}`); }
        function goBack() { fetch('/api/game/action?cmd=exit'); nav('game_sorting_setup.html'); }
        function goHome() { fetch('/api/game/action?cmd=exit').then(() => nav('/')); }
    </script>
</body>
</html>
