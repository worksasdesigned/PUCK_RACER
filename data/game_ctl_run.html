<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Catch the Light Live</title>
    <link rel="stylesheet" href="style.css?v=5">
    <style>
        .player-info { text-align:center; margin-bottom:15px; background:var(--card-bg); padding:15px; border-radius:8px; border:1px solid var(--border-color); }
        .top-info { position: relative; background: var(--card-bg); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 15px; border: 1px solid var(--border-color);}
        .big-time { font-size: 4rem; font-family: monospace; color: var(--text-main); font-weight: bold; line-height:1;}
        .status-txt { font-size: 1.2rem; color: var(--warning); text-transform: uppercase; margin-top:5px; font-weight:bold;}

        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; }

        .score-board { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;}
        .score-box { background: var(--bg-color); padding: 20px 10px; border-radius: 8px; text-align: center; border: 1px solid var(--border-color);}
        .score-lbl { color: var(--text-muted); font-size: 1rem; text-transform: uppercase; margin-bottom: 5px; font-weight:bold;}
        .score-val { color: var(--text-main); font-size: 4rem; font-weight: bold; font-family: monospace; line-height:1;}
        .val-hit { color: var(--success); text-shadow: 0 0 15px rgba(0,255,0,0.3);}
        .val-miss { color: var(--danger); font-size:2.5rem; }

        .avg-box { background: var(--card-hover); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--primary); margin-bottom: 20px;}
        .avg-val { font-size: 2.5rem; font-weight: bold; color: var(--primary); font-family: monospace; }

        .res-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 15px;}
        .res-card { display:flex; flex-direction:column; align-items:center; gap:5px; background:var(--card-hover); padding:10px; border-radius:8px; border:1px solid var(--border-color); width:70px;}
        
        .puck-node {
            width: 45px; height: 45px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center;
            font-size: 1.1rem; font-weight: bold; color: white; text-shadow: 1px 1px 2px #000;
        }

        .bottom-nav { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 15px; }

        /* --- HIGHSCORE STYLES --- */
        .sys-record {
            position: absolute; top: 10px; right: 10px; font-size: 0.85rem; color: var(--warning); 
            cursor: pointer; background: rgba(0,0,0,0.5); padding: 5px 10px; 
            border-radius: 6px; border: 1px solid var(--warning); transition: all 0.3s; z-index: 10;
        }
        .sys-record:hover { transform: scale(1.05); background: var(--card-hover); }
        .record-glow {
            border-color: #ff3333 !important; color: #fff !important; font-weight:bold;
            box-shadow: 0 0 15px #ff3333 !important; text-shadow: 0 0 5px #ff3333;
            background: rgba(255, 50, 50, 0.2) !important;
            animation: pulseRed 0.8s infinite alternate;
        }
        @keyframes pulseRed { 
            from { box-shadow: 0 0 10px #ff3333; } 
            to { box-shadow: 0 0 25px #ff3333, inset 0 0 10px #ff3333; } 
        }

        /* Responsive Fix für das iPhone */
        @media (max-width: 480px) {
            .hide-mobile { display: none; }
            .sys-record {
                top: auto;          /* Entfernt die Ankerung oben */
                bottom: 10px;       /* Setzt das Badge nach unten rechts */
                padding: 4px 6px;   /* Etwas schmaler */
                font-size: 0.8rem;  /* Minimale Schriftverkleinerung */
            }
        }

        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(4px); z-index:5000; display:none; align-items:center; justify-content:center; padding:15px; box-sizing:border-box; }
        .modal-overlay.show { display:flex; }
        .modal-box { background:var(--card-bg); border:1px solid var(--border-color); border-radius:12px; width:100%; max-width:350px; }
        .modal-header { padding:16px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; }
        .modal-body { padding:20px; font-size:1.1rem; line-height:1.8; }
        .hs-val { font-family:monospace; font-weight:bold; color:var(--primary); float:right; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_ctl">Catch the Light Pro ⚡</div>
        <div class="status-bar">
            <div class="status-dot dot-green" id="cnt-green">0</div>
            <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
            <div class="status-dot dot-red" id="cnt-red">0</div>
        </div>
    </header>

    <main>
        <div class="player-info">
            <div style="font-size:1.4rem; font-weight:bold; color:var(--text-main);">👤 <span id="playerNameDisplay">Spieler 1</span></div>
        </div>

        <div class="top-info">
            <div id="sysRecordBtn" class="sys-record" onclick="showRecordModal()" style="display:none;" title="All-Time Highscore">
                👑<span class="hide-mobile" data-i18n="bat_sys_record"> System Record:</span> <span id="sysRecordVal">---</span>
            </div>
            
            <div class="big-time" id="globalTime">00:00</div>
            <div class="status-txt" id="stateInfo">WAITING</div>
        </div>

        <div class="score-board">
            <div class="score-box">
                <div class="score-lbl" data-i18n="bat_run_hits">Hits</div>
                <div class="score-val val-hit" id="valHit">0</div>
            </div>
            <div class="score-box">
                <div class="score-lbl" data-i18n="bat_run_miss">Misses</div>
                <div class="score-val val-miss" id="valMiss">0</div>
            </div>
        </div>

        <div class="avg-box">
            <div style="color:var(--text-muted); font-size:0.9rem; text-transform:uppercase; margin-bottom:5px;" data-i18n="bat_run_avg">Average Reaction Time</div>
            <div class="avg-val" id="valAvg">-- ms</div>
        </div>

        <div class="controls">
            <button onclick="goBack()" class="btn-warn btn-ctrl" data-i18n="btn_back">⬅</button>
            <button onclick="doAction('start')" class="btn-primary btn-ctrl" id="btnStart" data-i18n="btn_start">START</button>
            <button onclick="doAction('stop')" class="btn-danger btn-ctrl" data-i18n="btn_stop">STOP</button>
        </div>

        <div id="resultsArea" style="display:none; background:var(--bg-color); padding:15px; border-radius:8px; border:1px solid var(--border-color);">
            <h3 style="margin:0; border-bottom:1px solid var(--border-color); padding-bottom:5px; text-align:center; color:var(--text-main);" data-i18n="bat_run_ana">Puck Analysis</h3>
            <div class="res-grid" id="resGrid"></div>
        </div>

        <div class="bottom-nav">
            <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
        </div>
    </main>

    <div class="modal-overlay" id="recordModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 style="margin:0; color:var(--warning);">👑 <span data-i18n="bat_hs_title">All-Time Highscore</span></h3>
                <button onclick="closeRecordModal()" style="background:none;border:none;color:var(--text-main);font-size:1.5rem; cursor:pointer;">✕</button>
            </div>
            <div class="modal-body" id="recordBody"></div>
        </div>
    </div>

    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        function t(key, fallback) {
            return (typeof getTranslation === 'function') ? (getTranslation(key) || fallback) : fallback;
        }

        const BLOCK_COLORS = ['#FF0000', '#0000FF', '#00FF00', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#FF1493'];
        const STATES = ["SETUP", "HOLD START!", "COUNTDOWN", "FALSE START", "RUNNING", "FINISHED"];
        const MIN_HITS_FOR_RECORD = 100;

        let savedStats = false;
        let personalBest = 99999999;
        let sessionRecords = {}; 
        
        let systemRecord = null; 
        
        let pName = sessionStorage.getItem('p_name_0') || "Spieler 1";
        document.getElementById('playerNameDisplay').innerText = pName;

        async function loadPersonalBests() {
            let pid = sessionStorage.getItem(`p_id_0`);
            if (pid && pid !== "0") {
                try {
                    // Cache-Buster hinzugefügt
                    let r = await fetch('/s_' + pid + '.csv?_t=' + Date.now());
                    if (r.ok) {
                        let text = await r.text();
                        let lines = text.split(/\r?\n/);
                        lines.forEach(line => {
                            let parts = line.split(';');
                            if (parts.length >= 4 && parts[1] === "21") { 
                                let score = parseInt(parts[2]); 
                                if (score > 0 && score < personalBest) personalBest = score;
                            }
                        });
                    }
                } catch(e) {}
            }
        }
        
        async function loadSystemRecord() {
            try {
                // Auch die JSON API vor dem Cache schützen!
                let r = await fetch('/api/highscore/get?game=21&_t=' + Date.now());
                if (r.ok) {
                    let data = await r.json();
                    if (data && data.rt) {
                        systemRecord = data;
                        document.getElementById('sysRecordVal').innerText = data.rt + "ms";
                        document.getElementById('sysRecordBtn').style.display = 'block';
                    }
                }
            } catch(e) {}
        }

        loadPersonalBests();
        loadSystemRecord();

        function savePlayerStat(avgRT, hits, miss) {
            let pid = sessionStorage.getItem(`p_id_0`);
            if (!pid || pid === "0") return;
            
            let time = sessionStorage.getItem('ctl_time') || 60;
            let diff = sessionStorage.getItem('ctl_diff') || 2;
            let pucks = sessionStorage.getItem('ctl_pucks') || 4;

            let fd = new URLSearchParams();
            fd.append('pid', pid);
            fd.append('game', 21); 
            fd.append('score', avgRT); 
            fd.append('ex1', hits); 
            fd.append('ex2', miss); 
            fd.append('ex3', time); 
            fd.append('ex4', diff); 
            fd.append('ex5', pucks); 
            fd.append('ts', Date.now());
            fetch('/api/stats/player_save', { method: 'POST', body: fd }).catch(e => console.log(e));
        }

        function playHighscoreJingle() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            
            const playTone = (freq, type, time, dur) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime + time);
                gain.gain.setValueAtTime(0.1, ctx.currentTime + time);
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + time + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + time);
                osc.stop(ctx.currentTime + time + dur);
            };
            
            playTone(523.25, 'sine', 0, 0.15);   // C5
            playTone(659.25, 'sine', 0.15, 0.15); // E5
            playTone(783.99, 'sine', 0.3, 0.15);  // G5
            playTone(1046.50, 'sine', 0.45, 0.5); // C6
        }

        function triggerNewSystemRecord(data) {
            playHighscoreJingle();
            
            let btn = document.getElementById('sysRecordBtn');
            btn.classList.add('record-glow');
            document.getElementById('sysRecordVal').innerText = data.avg + "ms"; // Ohne Leerzeichen!
            btn.style.display = 'block';
            
            let diffCfg = sessionStorage.getItem('ctl_diff') || 2;
            let puckCfg = sessionStorage.getItem('ctl_pucks') || 4;
            
            systemRecord = {
                name: pName,
                rt: data.avg,
                hits: data.hits,
                miss: data.miss,
                diff: diffCfg,
                pucks: puckCfg,
                ts: Date.now()
            };
            
            let fd = new URLSearchParams();
            fd.append('game', 21);
            fd.append('data', JSON.stringify(systemRecord));
            fetch('/api/highscore/save', { method: 'POST', body: fd });
            
            setTimeout(() => { btn.classList.remove('record-glow'); }, 8000);
        }

        setInterval(update, 150); 

        function update() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                
                if (data.st < 4) {
                    savedStats = false;
                    sessionRecords = {}; 
                }

                if (data.st === 5 && !savedStats) {
                    if (data.hits > 0 && data.avg > 0) {
                        
                        if (data.avg < personalBest) {
                            personalBest = data.avg;
                            sessionRecords[0] = true; 
                        }
                        
                        if (data.hits >= MIN_HITS_FOR_RECORD) {
                            if (!systemRecord || data.avg < systemRecord.rt) {
                                triggerNewSystemRecord(data);
                            }
                        }

                        savePlayerStat(data.avg, data.hits, data.miss);
                    }
                    savedStats = true;
                }
                render(data);
            }).catch(e => {});
        }

        function formatTime(ms) {
            let sec = Math.ceil(ms / 1000);
            let m = Math.floor(sec / 60);
            let s = sec % 60;
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function render(data) {
            document.getElementById('globalTime').innerText = formatTime(data.t);
            document.getElementById('valHit').innerText = data.hits;
            document.getElementById('valMiss').innerText = data.miss;
            
            let avgTxt = data.avg > 0 ? `${data.avg} ms` : "-- ms";
            if (sessionRecords[0]) {
                let titleNewPers = t('bat_new_pers', 'Neuer Persönlicher Rekord!');
                avgTxt += ` <span title='${titleNewPers}'>📈</span>`;
            }
            document.getElementById('valAvg').innerHTML = avgTxt;
            
            let stTxt = STATES[data.st] || "UNKNOWN";
            let stCol = "var(--warning)";
            if(data.st === 3) { stCol = "var(--danger)"; stTxt = t("sr_st_false", stTxt); }
            if(data.st === 4) { stCol = "var(--success)"; stTxt = t("btn_running", stTxt); }
            if(data.st === 5) { stCol = "gold"; stTxt = t("whac_st_5", stTxt); }
            
            let infoEl = document.getElementById('stateInfo');
            infoEl.innerText = stTxt;
            infoEl.style.color = stCol;
            
            let btn = document.getElementById('btnStart');
            if (data.st === 0 || data.st === 5 || data.st === 3) { 
                btn.innerText = (data.st === 3 || data.st === 5) ? t('btn_reset', "RESET") : t('btn_start', "START"); 
                btn.style.background = "var(--primary)"; 
                btn.setAttribute('onclick', data.st === 0 ? "doAction('start')" : "doAction('reset')");
            } else { 
                btn.innerText = t('btn_running', "RUNNING");
                btn.style.background = "var(--card-hover)"; 
                btn.removeAttribute('onclick');
            }

            let resArea = document.getElementById('resultsArea');
            let resGrid = document.getElementById('resGrid');

            if (data.st === 5 && data.pucks) {
                resArea.style.display = "block";
                data.pucks.forEach(p => {
                    let colHex = BLOCK_COLORS[Math.floor(p.id / 4) % 8];
                    let fillPercent = ((p.id % 4) + 1) * 25; 
                    
                    let bgStyle = `background: conic-gradient(${colHex} 0% ${fillPercent}%, var(--border-color) ${fillPercent}% 100%); border: 2px solid ${colHex};`;
                    if (fillPercent === 100) bgStyle = `background: ${colHex}; border: 2px solid #fff;`;
                    
                    let rt = p.a > 0 ? `${p.a}ms` : "-";
        
                    let cardId = `res-card-${p.id}`;
                    let cardEl = document.getElementById(cardId);

                    if (!cardEl) {
                        resGrid.insertAdjacentHTML('beforeend', `
                        <div id="${cardId}" class="res-card">
                            <div class="puck-node" style="${bgStyle}">${p.id + 1}</div>
                            <div style="font-size:0.8rem; color:var(--text-muted); font-weight:bold;"><span style="color:var(--success)">${p.h}</span> | <span style="color:var(--danger)">${p.m}</span></div>
                            <div style="font-family:monospace; color:var(--primary); font-weight:bold; font-size:1rem;" id="rt-${p.id}">${rt}</div>
                        </div>`);
                    } else {
                        document.getElementById(`rt-${p.id}`).innerText = rt;
                    }
                });
            } else {
                resArea.style.display = "none";
                resGrid.innerHTML = ""; 
            }
        }

        function showRecordModal() {
            if (!systemRecord) return;
            let d = new Date(systemRecord.ts);
            let dateStr = d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            
            let diffFallback = systemRecord.diff == 1 ? "Leicht" : (systemRecord.diff == 2 ? "Mittel" : "Schwer");
            let diffTxt = t(`bat_diff_${systemRecord.diff}`, diffFallback);
            
            let lblPlayer = t('bat_hs_player', "Spieler:");
            let lblRT = t('bat_hs_rt', "Ø Reaktionszeit:");
            let lblHits = t('bat_hs_hits', "Treffer:");
            let lblMiss = t('bat_hs_miss', "Fehler:");
            let lblPucks = t('bat_hs_pucks', "Pucks:");
            let lblLvl = t('bat_hs_lvl', "Level:");

            let html = `
                <div><strong>${lblPlayer}</strong> <span class="hs-val" style="color:var(--text-main);">${systemRecord.name}</span></div>
                <hr style="border-color:var(--border-color); margin:10px 0;">
                <div><strong>${lblRT}</strong> <span class="hs-val" style="color:var(--warning); font-size:1.3rem;">${systemRecord.rt} ms</span></div>
                <div><strong>${lblHits}</strong> <span class="hs-val" style="color:var(--success);">${systemRecord.hits}</span></div>
                <div><strong>${lblMiss}</strong> <span class="hs-val" style="color:var(--danger);">${systemRecord.miss}</span></div>
                <hr style="border-color:var(--border-color); margin:10px 0;">
                <div style="font-size:0.9rem; color:var(--text-muted);">
                    <div><strong>${lblPucks}</strong> <span class="hs-val">${systemRecord.pucks}</span></div>
                    <div><strong>${lblLvl}</strong> <span class="hs-val">${diffTxt}</span></div>
                    <div style="margin-top:10px; text-align:center;">${dateStr}</div>
                </div>
            `;
            document.getElementById('recordBody').innerHTML = html;
            document.getElementById('recordModal').classList.add('show');
        }

        function closeRecordModal() { document.getElementById('recordModal').classList.remove('show'); }

        function doAction(cmd) { fetch(`/api/game/action?cmd=${cmd}`); }
        function goBack() { doAction('reset'); location.href = 'game_ctl_names.html'; }
        function goHome() { fetch('/api/game/action?cmd=exit').then(() => location.href = '/'); }
    </script>
</body>
</html>
