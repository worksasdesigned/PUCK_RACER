<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <script src="tour.js?v=6" defer></script>
    <title>Players - Shuttle</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .player-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background:var(--card-bg); padding:10px; border-radius:8px; border-left:1px solid var(--border-color);}
        .color-box { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; transition: all 0.3s;}
        .puck-ids { font-size:0.8rem; color:var(--text-muted); margin-left:10px;}
        input[type=text] { flex-grow: 1; padding: 12px; font-size: 1.1rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main); min-width: 0; }
        
        /* NEU: Styling für das Statistik-Icon */
        .stat-icon { font-size: 1.3rem; opacity: 0.2; transition: all 0.3s; cursor: help; user-select: none; filter: grayscale(100%); }
        .stat-icon.active { opacity: 1; filter: none; text-shadow: 0 0 8px rgba(13, 110, 253, 0.5); }
        
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="sr_names_title">Players</div></header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Loading...</div>
        
        <div id="content" style="display:none;">
            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span>Streckenaufbau</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody" style="flex-direction: column; align-items: center; gap: 20px;">
                    <p style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin:0;">
                        Baue für jeden Spieler eine Pendel-Strecke auf.
                    </p>
                    <div id="arenaContainer" style="overflow-x: auto;"></div>
                </div>
            </div>

            <div id="pickerBar" style="margin-bottom:15px;">
                <button onclick="loadFromPicker()" class="btn-primary" style="font-size:1.1rem; background:var(--card-hover); border:1px dashed var(--primary); color:var(--primary);">
                    👥 <span data-i18n="pp_load_players">Load Players from List</span>
                </button>
            </div>

            <div id="playerList" class="card"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="location.href='game_shuttle_setup.html'" class="btn-warn" style="font-size:1.2rem;" data-i18n="btn_back">⬅ BACK</button>
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game">TO GAME 🏁</button>
            </div>
        </div>
    </main>

<script src="lang.js"></script>
<script src="player_picker.js"></script>
<script>
    if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
    const COLORS = ['#0000FF', '#00FF00', '#FF0000', '#FFFF00', '#FF00FF'];
    let numPlayers = parseInt(sessionStorage.getItem('sr_players') || 1);
    
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(initList, 500);
    });

    async function initList() {
        try {
            await fetch('/api/game/load?id=1');

            numPlayers = parseInt(sessionStorage.getItem('sr_players') || 1);
            let maxRounds = parseInt(sessionStorage.getItem('sr_rounds') || 3);

            await fetch(`/api/game/action?cmd=config_players&val=${numPlayers}`);
            await fetch(`/api/game/action?cmd=config_rounds&val=${maxRounds}`);
            await fetch('/api/game/action?cmd=setup');

            let tableHtml = `<table class="arena-table">`;
            const cols = ['A', 'B', 'C', 'D', 'E'];
            for(let r = 1; r <= numPlayers && r <= 5; r++) {
                tableHtml += `<tr>`;
                for(let c = 0; c < 5; c++) { tableHtml += `<td id="cell-${cols[c]}${r}"></td>`; }
                tableHtml += `</tr>`;
            }
            tableHtml += `</table>`;
            document.getElementById('arenaContainer').innerHTML = tableHtml;

            let container = document.getElementById('playerList');
            container.innerHTML = "";
            let puckTxt = getTranslation('sr_names_pucks') || "Pucks";

            for(let i=0; i<numPlayers; i++) {
                let color = COLORS[i % COLORS.length];
                let name = sessionStorage.getItem(`p_name_${i}`) || `Player ${i+1}`;
                let pid = sessionStorage.getItem(`p_id_${i}`);
                let puckA = i*2;
                let puckB = i*2 + 1;
                let r = i + 1;

                if(r <= 5) {
                    document.getElementById(`cell-A${r}`).innerHTML = `<div class="puck-icon" id="puck_vis_${puckA}" style="background:${color}">${puckA+1}</div>`;
                    document.getElementById(`cell-B${r}`).innerHTML = `<div style="font-size:1.5rem;">🏃‍♂️</div>`;
                    document.getElementById(`cell-C${r}`).innerHTML = `<div style="font-size:1.5rem; color:var(--text-muted);">↔️</div>`;
                    document.getElementById(`cell-E${r}`).innerHTML = `<div class="puck-icon" id="puck_vis_${puckB}" style="background:${color}">${puckB+1}</div>`;
                }
                
                // NEU: Prüfen, ob eine gültige ID da ist, um das Icon zu aktivieren
                let hasStats = (pid && pid !== "0");
                let statClass = hasStats ? "active" : "";
                let statTitle = hasStats ? "Statistik wird gespeichert" : "Gastspieler (Keine Statistik)";

                container.innerHTML += `
                <div class="player-row" style="border-left: 5px solid ${color}">
                    <div class="color-box" id="cb_${i}" style="background:${color}; box-shadow:0 0 10px ${color};"></div>
                    <input type="text" id="name_${i}" value="${name}" placeholder="Name" oninput="clearPlayerId(${i})">
                    <span class="stat-icon ${statClass}" id="stat_icon_${i}" title="${statTitle}">📊</span>
                    <div class="puck-ids">${puckTxt} ${puckA} & ${puckB}</div>
                </div>`;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            setInterval(pollPuckEffects, 1500);

        } catch (error) {
            console.error("Initialisierungsfehler:", error);
        }
    }

    // NEU: Setzt die ID auf 0 und graut das Icon aus, wenn getippt wird
    function clearPlayerId(idx) {
        sessionStorage.setItem(`p_id_${idx}`, 0);
        let icon = document.getElementById(`stat_icon_${idx}`);
        if(icon) {
            icon.classList.remove('active');
            icon.title = "Gastspieler (Keine Statistik)";
        }
    }

    async function pollPuckEffects() {
        try {
            let r = await fetch('/api/effects');
            let data = await r.json();
            data.forEach(eff => {
                const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                let pId = Math.floor(eff.id / 2);
                let cb = document.getElementById(`cb_${pId}`);
                if(cb) { cb.style.background = rgb; cb.style.boxShadow = `0 0 10px ${rgb}`; }

                let vis = document.getElementById(`puck_vis_${eff.id}`);
                if(vis) {
                    vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                    if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                    if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                    if(eff.eff == 9) vis.classList.add('eff-rainbow');
                    if(eff.eff == 18) {
                        let percent = Math.round(eff.dur / 2.55);
                        vis.style.background = `conic-gradient(${rgb} ${percent}%, var(--border-color) ${percent}%)`;
                        vis.style.border = `2px solid ${rgb}`;
                    } else {
                        vis.style.background = rgb;
                        vis.style.border = `2px solid #fff`;
                    }
                    vis.style.boxShadow = `0 0 15px ${rgb}`;
                }
            });
        } catch (e) {}
    }

    function toggleLayout() {
        document.getElementById('layoutBody').classList.toggle('hidden');
        document.getElementById('toggleIcon').classList.toggle('rotate');
    }

    function loadFromPicker() {
        openPlayerPicker(numPlayers, function(selected) {
            selected.forEach((p, i) => {
                let inp = document.getElementById('name_' + i);
                if (inp) { 
                    inp.value = p.name; 
                    sessionStorage.setItem(`p_name_${i}`, p.name); 
                    sessionStorage.setItem(`p_id_${i}`, p.id); 
                    
                    // NEU: Icon aktivieren, wenn Spieler geladen wurde
                    let icon = document.getElementById(`stat_icon_${i}`);
                    if(icon) {
                        icon.classList.add('active');
                        icon.title = "Statistik wird gespeichert";
                    }
                }
            });
        });
    }

    function startGame() {
        let inputs = document.querySelectorAll('input[type=text]');
        inputs.forEach(inp => {
            let idx = inp.id.split('_')[1];
            sessionStorage.setItem(`p_name_${idx}`, inp.value);
            if (!sessionStorage.getItem(`p_id_${idx}`)) {
                sessionStorage.setItem(`p_id_${idx}`, 0);
            }
        });
        setTimeout(() => { location.href = 'game_shuttle_run.html'; }, 200);
    }
</script>
</body>
</html>
