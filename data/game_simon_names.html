<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Names - Simon</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .player-row { 
            display: flex; align-items: center; gap: 10px; 
            margin-bottom: 10px; background:var(--card-bg); padding:10px; 
            border-radius:8px; border-left: 5px solid #fff; 
        }
        .puck-count { color:var(--text-muted); font-size:0.9rem; white-space:nowrap; }
        input[type=text] { flex-grow: 1; padding: 10px; font-size: 1.1rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-main); }
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
        
        /* Styling für das Statistik-Icon */
        .stat-icon { font-size: 1.3rem; opacity: 0.2; transition: all 0.3s; cursor: help; user-select: none; filter: grayscale(100%); }
        .stat-icon.active { opacity: 1; filter: none; text-shadow: 0 0 8px rgba(13, 110, 253, 0.5); }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="sim_names_title">Simon Players</div></header>
    <main>
        <div id="loading" style="text-align:center; padding:20px; color:var(--text-muted);" data-i18n="loading_pucks">
            Loading Pucks...
        </div>
        
        <div id="content" style="display:none;">
            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span>Aufbau pro Gruppe</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody" style="flex-direction: column; align-items: center; gap: 20px;">
                    <p style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin:0;">
                        Der Spieler kniet sich vor die Pucks und merkt sich die Farben.
                    </p>
                    <div id="arenaContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;"></div>
                </div>
            </div>

            <div id="pickerBar" style="margin-bottom:15px;">
                <button onclick="loadFromPicker()" class="btn-primary" style="font-size:1.1rem; background:var(--card-hover); border:1px dashed var(--primary); color:var(--primary);">
                    👥 <span data-i18n="pp_load_players">Load Players from List</span>
                </button>
            </div>
            
            <div id="playerList" class="card"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="location.href='game_simon_setup.html'" class="btn-warn" style="font-size:1.2rem;" data-i18n="btn_back">⬅ BACK</button>
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game">TO GAME 🏁</button>
            </div>
        </div>
    </main>

<script src="lang.js"></script>
<script src="player_picker.js"></script>
<script>
    if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
    const SIM_LAYOUTS = {
        4: ["C2","D2","C3","D3"],
        5: ["C2","D2","D3","C4","D4"],
        6: ["C2","D2","C3","D3","C4","D4"]
    };
    
    // Farben passend zum C++ Code: Rot, Blau, Gelb
    const TEAM_COLORS_HEX = ['#FF0000', '#0000FF', '#FFFF00'];
    
    let groups = parseInt(sessionStorage.getItem('sim_groups') || 1);

    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(initList, 500);
    });

    // Funktion zum manuellen Entfernen der ID, wenn Name händisch geändert wird
    function clearPlayerId(idx) {
        sessionStorage.setItem(`p_id_${idx}`, 0);
        let icon = document.getElementById(`stat_icon_${idx}`);
        if(icon) {
            icon.classList.remove('active');
            icon.title = "Gastspieler (Keine Statistik)";
        }
    }

    async function initList() {
        try {
            await fetch('/api/game/load?id=4');

            let pucksStr = sessionStorage.getItem('sim_pucks');
            let pucks = [4,4,4];
            if (pucksStr) {
                try { pucks = JSON.parse(pucksStr); } catch(e) { console.error("JSON Parse Error:", e); }
            }
            let blind = parseInt(sessionStorage.getItem('sim_blind') || 0);

            await fetch(`/api/game/action?cmd=cfg_groups&val=${groups}`);
            for(let i=0; i<groups; i++) {
                let pCount = pucks[i] || 4;
                await fetch(`/api/game/action?cmd=cfg_pucks_${i}&val=${pCount}`);
            }
            await fetch(`/api/game/action?cmd=cfg_blind&val=${blind}`);
            
            await fetch('/api/game/action?cmd=setup');
            
            let listContainer = document.getElementById('playerList');
            let arenaContainer = document.getElementById('arenaContainer');
            listContainer.innerHTML = "";
            arenaContainer.innerHTML = "";
            
            let ph = (typeof getTranslation === 'function') ? getTranslation('sim_names_ph') : "Team";
            if(!ph) ph = "Team";
            
            let globalOffset = 0;
            for(let i=0; i<groups; i++) {
                let name = sessionStorage.getItem(`p_name_${i}`) || `${ph} ${i+1}`;
                let nPpg = pucks[i] || 4;
                let ringCol = TEAM_COLORS_HEX[i % 3];

                // Statistik Check
                let pid = sessionStorage.getItem(`p_id_${i}`);
                let hasStats = (pid && pid !== "0");
                let statClass = hasStats ? "active" : "";
                let statTitle = hasStats ? "Statistik wird gespeichert" : "Gastspieler (Keine Statistik)";

                // Liste mit farbigen Balken und Stat-Icon
                listContainer.innerHTML += `
                <div class="player-row" style="border-left-color: ${ringCol};">
                    <input type="text" id="name_${i}" value="${name}" placeholder="${ph}" oninput="clearPlayerId(${i})">
                    <span class="stat-icon ${statClass}" id="stat_icon_${i}" title="${statTitle}">📊</span>
                    <span class="puck-count">${nPpg} Pucks</span>
                </div>`;

                // Arena mit farbiger Überschrift
                let tableHtml = `<div><h4 style="margin:0 0 10px 0; text-align:center; color:${ringCol};">Group ${i+1}</h4><table class="arena-table">`;
                const cols = ['A', 'B', 'C', 'D', 'E'];
                for(let r = 1; r <= 5; r++) {
                    tableHtml += `<tr>`;
                    for(let c = 0; c < 5; c++) {
                        tableHtml += `<td id="cell-${i}-${cols[c]}${r}"></td>`;
                    }
                    tableHtml += `</tr>`;
                }
                tableHtml += `</table></div>`;
                arenaContainer.innerHTML += tableHtml;

                let layoutKey = [4, 5, 6].find(n => n >= nPpg) || 6;
                let activeLayout = SIM_LAYOUTS[layoutKey];

                let cellRunner = document.getElementById(`cell-${i}-B3`);
                if(cellRunner) cellRunner.innerHTML = `<div style="font-size:1.5rem; display:inline-block; transform: scaleX(-1);">🧎‍♂️</div>`;
                
                for(let p=0; p<nPpg && p<activeLayout.length; p++) {
                    let coord = activeLayout[p];
                    let cell = document.getElementById(`cell-${i}-${coord}`);
                    if(cell) {
                        cell.innerHTML = `<div class="puck-icon" id="puck_vis_${globalOffset + p}" style="background:#444">${p+1}</div>`;
                    }
                }
                globalOffset += nPpg;
            }
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            
            setInterval(pollPuckEffects, 1500);

        } catch (error) {
            console.error("Initialisierungsfehler:", error);
            alert("Fehler beim Laden. Bitte stelle sicher, dass die Configs im Setup richtig gespeichert wurden.");
        }
    }

    async function pollPuckEffects() {
        try {
            let r = await fetch('/api/effects');
            let data = await r.json();
            data.forEach(eff => {
                let vis = document.getElementById(`puck_vis_${eff.id}`);
                if(vis) {
                    const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                    vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                    if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                    if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                    if(eff.eff == 9) vis.classList.add('eff-rainbow');
                    
                    vis.style.background = rgb;
                    vis.style.boxShadow = `0 0 15px ${rgb}`;
                    vis.style.border = (eff.r===0 && eff.g===0 && eff.b===0) ? "2px solid #444" : "2px solid #fff";
                }
            });
        } catch (e) { console.error(e); }
    }

    function toggleLayout() {
        document.getElementById('layoutBody').classList.toggle('hidden');
        document.getElementById('toggleIcon').classList.toggle('rotate');
    }

    function loadFromPicker() {
        openPlayerPicker(groups, function(selected) {
            selected.forEach((p, i) => {
                let inp = document.getElementById('name_' + i);
                if (inp) { 
                    inp.value = p.name; 
                    sessionStorage.setItem('p_name_' + i, p.name); 
                }
                // ID sichern und Icon aktivieren
                sessionStorage.setItem(`p_id_${i}`, p.id); 
                let icon = document.getElementById(`stat_icon_${i}`);
                if(icon) { 
                    icon.classList.add('active'); 
                    icon.title = "Statistik wird gespeichert"; 
                }
            });
        });
    }

    async function startGame() {
        for(let i=0; i<groups; i++) {
            let val = document.getElementById(`name_${i}`).value;
            sessionStorage.setItem(`p_name_${i}`, val);
        }
        
        let len = sessionStorage.getItem('sim_len') || 5;
        let spd = sessionStorage.getItem('sim_spd') || 1000;
        let auto = sessionStorage.getItem('sim_auto') || 0;
        let snd = sessionStorage.getItem('sim_sound') || 1;

        await fetch(`/api/game/action?cmd=cfg_len&val=${len}`);
        await fetch(`/api/game/action?cmd=cfg_speed&val=${spd}`);
        await fetch(`/api/game/action?cmd=cfg_auto&val=${auto}`);
        await fetch(`/api/game/action?cmd=cfg_sound&val=${snd}`);

        setTimeout(() => { location.href = 'game_simon_run.html'; }, 200);
    }
</script>
</body>
</html>
