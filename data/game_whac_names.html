<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Targets - Whac-A-Mole</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .grp-card { background:var(--card-bg); padding:15px; border-radius:8px; border-left:5px solid #fff; margin-bottom:15px;}
        .grp-title { display:flex; align-items:center; gap:10px; font-weight:bold; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #fff; display:inline-block; vertical-align:middle; transition: all 0.3s;}
        input[type=text] { flex-grow: 1; padding: 10px; font-size: 1.1rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-main); }
        .color-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top:20px;}
        .color-node {
            width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; font-weight: bold; color: white; text-shadow: 1px 1px 2px #000;
            cursor: pointer; border: 3px solid var(--border-color); opacity: 0.4; transition: 0.2s;
        }
        .color-node.active { opacity: 1; border: 3px solid #fff; box-shadow: 0 0 15px rgba(255,255,255,0.5); transform: scale(1.1); }
        .color-node.disabled { cursor: not-allowed; filter: grayscale(100%); }
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="whac_names_title">Whac-A-Mole</div></header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initializing...</div>
        
        <div id="content" style="display:none;">
            <div class="card" style="text-align:center; margin-bottom:20px;">
                <h3 data-i18n="whac_sel_title">Select Hit-Colors</h3>
                <p style="font-size:0.9rem; color:var(--text-muted);" id="selSub"></p>
                <div class="color-grid" id="colorPicker"></div>
            </div>

            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span>Aufbau pro Gruppe</span>
                    <span id="toggleIcon" class="rotate">▼</span>
                </div>
                <div class="layout-body hidden" id="layoutBody" style="flex-direction: column; align-items: center; gap: 20px;">
                    <p style="font-size:0.85rem; color:var(--text-muted); text-align:center; margin:0;">
                        Der Werfer positioniert sich im Zentrum der Base-Pucks.
                    </p>
                    <div id="arenaContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;"></div>
                </div>
            </div>

            <div id="pickerBar" style="margin-bottom:15px;">
                <button onclick="loadFromPicker()" class="btn-primary" style="font-size:1.1rem; background:var(--card-hover); border:1px dashed var(--primary); color:var(--primary);">
                    👥 <span data-i18n="pp_load_players">Load Teams</span>
                </button>
            </div>

            <div id="groupList"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="location.href='game_whac_setup.html'" class="btn-warn" style="font-size:1.2rem;" data-i18n="btn_back">⬅ BACK</button>
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game" id="btnStart" disabled>START GAME 🏁</button>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="player_picker.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const GRP_COLORS = ['#800080', '#40E0D0', '#FF7F50', '#7FFFD4', '#9370DB'];
        const HIT_COLORS = ['#FF0000', '#0000FF', '#00FF00', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#FFFFFF'];
        const WHAC_LAYOUTS = {
            3: ["C2","C3","C4"],
            4: ["C1","C2","C3","C4"],
            5: ["B1","C2","C3","C4","B5"],
            6: ["C2","D2","C3","D3","C4","D4"],
            7: ["B1","C2","D2","D3","C4","D4","B5"],
            8: ["C1","C2","D2","C3","D3","C4","D4","C5"],
            9: ["C1","B2","C2","D2","C3","D3","B4","C4","D4"],
            10: ["C1","B2","C2","D2","C3","D3","B4","C4","D4","C5"]
        };
        
        let nGrp = parseInt(sessionStorage.getItem('whac_grp') || 1);
        let nPpg = parseInt(sessionStorage.getItem('whac_ppg') || 3);
        let numColors = parseInt(sessionStorage.getItem('whac_col') || 4);
        
        let maxTargets = Math.ceil(numColors / 2) || 1; 

        let selectedMask = 0;
        let selectedCount = 0;

        // Hilfsfunktion: Zwingt JS zu warten, damit der ESP32 Request-Ressourcen freigeben kann
        const delay = ms => new Promise(res => setTimeout(res, ms));

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initList, 500);
        });

        async function initList() {
            try {
                await fetch('/api/game/load?id=24');
                await delay(100);
                await fetch(`/api/game/action?cmd=cfg_grp&val=${nGrp}`);
                await delay(100);
                await fetch(`/api/game/action?cmd=cfg_ppg&val=${nPpg}`);
                await delay(100);
                await fetch('/api/game/action?cmd=setup');
                await delay(100);
                await fetch('/api/game/action?cmd=show_layout'); 

                document.getElementById('selSub').innerHTML = `Select exactly ${maxTargets} colors to hit.`;
                
                let cHtml = "";
                for(let i=0; i<numColors; i++) {
                    cHtml += `<div class="color-node" id="cn-${i}" style="background:${HIT_COLORS[i]}" onclick="toggleColor(${i})">${i+1}</div>`;
                }
                document.getElementById('colorPicker').innerHTML = cHtml;

                let layoutKey = [3, 4, 5, 6, 7, 8, 9, 10].find(n => n >= nPpg) || 10;
                let activeLayout = WHAC_LAYOUTS[layoutKey];

                let listContainer = document.getElementById('groupList');
                let arenaContainer = document.getElementById('arenaContainer');
                listContainer.innerHTML = "";
                arenaContainer.innerHTML = "";
                
                for(let i=0; i<nGrp; i++) {
                    let name = sessionStorage.getItem(`whac_aname_${i}`) || `Group ${i+1}`;
                    let col = GRP_COLORS[i % GRP_COLORS.length];

                    listContainer.innerHTML += `
                    <div class="grp-card" style="border-left-color:${col}">
                        <div class="grp-title">
                            <div class="color-dot" id="cb_${i}" style="background:${col}; box-shadow:0 0 10px ${col}"></div>
                            <input type="text" id="aname_${i}" value="${name}" placeholder="Group Name">
                        </div>
                    </div>`;
                    
                    let tableHtml = `<div><h4 style="margin:0 0 10px 0; text-align:center; color:${col}">Group ${i+1}</h4><table class="arena-table">`;
                    const cols = ['A', 'B', 'C', 'D', 'E'];
                    for(let r = 1; r <= 5; r++) {
                        tableHtml += `<tr>`;
                        for(let c = 0; c < 5; c++) {
                            tableHtml += `<td id="cell-${i}-${cols[c]}${r}"></td>`;
                        }
                        tableHtml += `</tr>`;
                    }
                    tableHtml += `</table></div>`;
                    arenaContainer.innerHTML += tableHtml;

                    let cellThrower = document.getElementById(`cell-${i}-B3`);
                    if(cellThrower) cellThrower.innerHTML = `<div style="font-size:1.5rem; display:inline-block; transform: scaleX(-1);">🤾</div>`;

                    for(let p = 0; p < nPpg && p < activeLayout.length; p++) {
                        let coord = activeLayout[p];
                        let cell = document.getElementById(`cell-${i}-${coord}`);
                        let globalIdx = (i * nPpg) + p;
                        if(cell) {
                            cell.innerHTML = `<div class="puck-icon" id="puck_vis_${globalIdx}" style="background:${col}">${p+1}</div>`;
                        }
                    }
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                setInterval(pollPuckEffects, 1500);
            } catch(e) { console.error(e); }
        }

        // NEU: Funktion zum Laden der Teams/Spieler
        function loadFromPicker() {
            openPlayerPicker(nGrp, function(selected) {
                selected.forEach((p, i) => {
                    let inp = document.getElementById('aname_' + i);
                    if (inp) { 
                        inp.value = p.name; 
                        sessionStorage.setItem('whac_aname_' + i, p.name); 
                    }
                });
            });
        }

        function toggleColor(idx) {
            let maskBit = (1 << idx);
            let isSelected = (selectedMask & maskBit) > 0;
            
            if (isSelected) {
                selectedMask &= ~maskBit;
                selectedCount--;
                document.getElementById(`cn-${idx}`).classList.remove('active');
            } else {
                if (selectedCount >= maxTargets) return;
                selectedMask |= maskBit;
                selectedCount++;
                document.getElementById(`cn-${idx}`).classList.add('active');
            }
            updateUI();
        }
        
        function updateUI() {
            let limitReached = (selectedCount >= maxTargets);
            document.getElementById('btnStart').disabled = !limitReached;
            
            for(let i=0; i<numColors; i++) {
                let node = document.getElementById(`cn-${i}`);
                let isSelected = (selectedMask & (1 << i)) > 0;
                if (!isSelected) {
                    if (limitReached) node.classList.add('disabled');
                    else node.classList.remove('disabled');
                }
            }
        }

        async function pollPuckEffects() {
            try {
                let r = await fetch('/api/effects');
                let data = await r.json();
                data.forEach(eff => {
                    const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                        if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                        if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                        if(eff.eff == 9) vis.classList.add('eff-rainbow');
                        
                        vis.style.background = rgb;
                        vis.style.boxShadow = `0 0 15px ${rgb}`;
                        vis.style.border = (eff.r===0 && eff.g===0 && eff.b===0) ? "2px solid #444" : "2px solid #fff";
                    }
                    
                    let pId = Math.floor(eff.id / nPpg);
                    let cb = document.getElementById(`cb_${pId}`);
                    if(cb && eff.eff !== 0) { 
                        cb.style.background = rgb;
                        cb.style.boxShadow = `0 0 10px ${rgb}`; 
                    }
                });
            } catch(e) {}
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }

        async function startGame() {
            try {
                for(let i=0; i<nGrp; i++) {
                    sessionStorage.setItem(`whac_aname_${i}`, document.getElementById(`aname_${i}`).value);
                }
                sessionStorage.setItem('whac_tgt_mask', selectedMask);

                await fetch(`/api/game/action?cmd=cfg_time&val=${sessionStorage.getItem('whac_time')}`);
                await delay(100);
                await fetch(`/api/game/action?cmd=cfg_diff&val=${sessionStorage.getItem('whac_diff')}`);
                await delay(100);
                await fetch(`/api/game/action?cmd=cfg_col&val=${numColors}`);
                await delay(100);
                await fetch(`/api/game/action?cmd=cfg_snd&val=${sessionStorage.getItem('whac_snd')}`);
                await delay(100);
                await fetch(`/api/game/action?cmd=cfg_shw&val=${sessionStorage.getItem('whac_shw')}`);
                await delay(100);
                await fetch(`/api/game/action?cmd=cfg_tgt&val=${selectedMask}`);
                await delay(100);
                
                await fetch('/api/game/action?cmd=setup');
                
                setTimeout(() => { location.href = 'game_whac_run.html'; }, 200);
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
