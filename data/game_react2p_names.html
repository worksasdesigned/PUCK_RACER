<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Names - React 2P</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .grp-card { background:var(--card-bg); padding:15px; border-radius:8px; border-left:5px solid #fff; margin-bottom:15px;}
        .grp-title { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-weight:bold; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #fff; display:inline-block; vertical-align:middle; transition: all 0.3s;}
        .p-row { display:flex; align-items:center; gap:10px; margin-bottom:5px; }
        input[type=text] { flex-grow: 1; padding: 10px; font-size: 1rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-main); }
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="r2_names_title">Setup Players</div></header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initializing...</div>
        
        <div id="content" style="display:none;">
            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span>Duell Aufbau</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody" style="flex-direction: column; align-items: center; gap: 20px;">
                    <p style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin:0;">
                        Die Spieler stehen sich gegenüber. Baue die Pucks in der Mitte auf.
                    </p>
                    <div id="arenaContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;"></div>
                </div>
            </div>

            <div id="groupList"></div>

            <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem; margin-top:20px;" data-i18n="btn_start_game">TO GAME 🏁</button>
            <button onclick="location.href='game_react2p_setup.html'" class="btn-back" style="margin-top:10px;" data-i18n="btn_back">⬅ BACK</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        const GRP_COLORS = ['#800080', '#40E0D0', '#FF7F50', '#7FFFD4', '#9370DB'];
        const REACT_LAYOUTS = {
            3: ["C2","C3","C4"],
            4: ["C2","C3","C4","C5"],
            5: ["C1","C2","C3","C4","C5"]
        };

        fetch('/api/game/load?id=13').then(() => { setTimeout(initList, 500); });

        async function initList() {
            let nGrp = parseInt(sessionStorage.getItem('r2_groups') || 1);
            let nPucks = parseInt(sessionStorage.getItem('r2_pucks') || 3);
            
            await fetch(`/api/game/action?cmd=cfg_groups&val=${nGrp}`);
            await fetch(`/api/game/action?cmd=cfg_pucks&val=${nPucks}`);
            await fetch(`/api/game/action?cmd=cfg_time&val=${sessionStorage.getItem('r2_time')}`);
            await fetch(`/api/game/action?cmd=cfg_colors&val=${sessionStorage.getItem('r2_cols')}`);
            await fetch(`/api/game/action?cmd=cfg_fake&val=${sessionStorage.getItem('r2_fake')}`);
            
            await fetch('/api/game/action?cmd=setup'); 
            
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                let listContainer = document.getElementById('groupList');
                let arenaContainer = document.getElementById('arenaContainer');
                listContainer.innerHTML = "";
                arenaContainer.innerHTML = "";
                
                let phGrp = getTranslation('r2_names_grp');
                let phP1 = getTranslation('r2_names_p1');
                let phP2 = getTranslation('r2_names_p2');

                let layoutKey = [3, 4, 5].find(n => n >= nPucks) || 5;
                let activeLayout = REACT_LAYOUTS[layoutKey];

                data.groups.forEach((g, i) => {
                    // 1. Liste aufbauen
                    let gName = sessionStorage.getItem(`r2_gname_${i}`) || `${phGrp} ${i+1}`;
                    let p1Name = sessionStorage.getItem(`r2_p1name_${i}`) || `${phP1}`;
                    let p2Name = sessionStorage.getItem(`r2_p2name_${i}`) || `${phP2}`;
                    
                    let p1ColsHtml = g.p1c.map(c => `<div class="color-dot" style="background:${c}; box-shadow:0 0 5px ${c}"></div>`).join('');
                    let p2ColsHtml = g.p2c.map(c => `<div class="color-dot" style="background:${c}; box-shadow:0 0 5px ${c}"></div>`).join('');
                    
                    listContainer.innerHTML += `
                    <div class="grp-card" style="border-left-color:${GRP_COLORS[i]}">
                        <div class="grp-title">
                            <div class="color-dot" style="background:${GRP_COLORS[i]}"></div>
                            <input type="text" id="gname_${i}" value="${gName}" placeholder="${phGrp} Name">
                        </div>
                        <div class="p-row">
                            <input type="text" id="p1name_${i}" value="${p1Name}" placeholder="${phP1} Name">
                            <div style="display:flex; gap:5px;">${p1ColsHtml}</div>
                        </div>
                        <div class="p-row">
                            <input type="text" id="p2name_${i}" value="${p2Name}" placeholder="${phP2} Name">
                            <div style="display:flex; gap:5px;">${p2ColsHtml}</div>
                        </div>
                    </div>`;

                    // 2. Arena aufbauen
                    let tableHtml = `<div><h4 style="margin:0 0 10px 0; text-align:center; color:${GRP_COLORS[i]}">Duell ${i+1}</h4><table class="arena-table">`;
                    const cols = ['A', 'B', 'C', 'D', 'E'];
                    for(let r = 1; r <= 5; r++) {
                        tableHtml += `<tr>`;
                        for(let c = 0; c < 5; c++) {
                            tableHtml += `<td id="cell-${i}-${cols[c]}${r}"></td>`;
                        }
                        tableHtml += `</tr>`;
                    }
                    tableHtml += `</table></div>`;
                    arenaContainer.innerHTML += tableHtml;
                });

                // 3. Pucks & Spieler in Arenen einsetzen
                for(let i=0; i<nGrp; i++) {
                    // Pucks
                    for(let p = 0; p < nPucks && p < activeLayout.length; p++) {
                        let coord = activeLayout[p];
                        let cell = document.getElementById(`cell-${i}-${coord}`);
                        let globalIdx = (i * nPucks) + p; 
                        if(cell) {
                            cell.innerHTML = `<div class="puck-icon" id="puck_vis_${globalIdx}" style="background:${GRP_COLORS[i]}">${p+1}</div>`;
                        }
                    }
                    // Spieler (B3 gespiegelt, D3 normal)
                    let cellP1 = document.getElementById(`cell-${i}-B3`);
                    let cellP2 = document.getElementById(`cell-${i}-D3`);
                    if(cellP1) cellP1.innerHTML = `<div style="font-size:1.5rem; display:inline-block; transform: scaleX(-1);">🧎</div>`;
                    if(cellP2) cellP2.innerHTML = `<div style="font-size:1.5rem; display:inline-block;">🧎</div>`;
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                setInterval(pollPuckEffects, 1500);
            });
        }

        function pollPuckEffects() {
            fetch('/api/effects').then(r => r.json()).then(data => {
                data.forEach(eff => {
                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                        vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                        if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                        if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                        if(eff.eff == 9) vis.classList.add('eff-rainbow');
                        
                        if(eff.eff == 18) {
                            let percent = Math.round(eff.dur / 2.55);
                            vis.style.background = `conic-gradient(${rgb} ${percent}%, var(--border-color) ${percent}%)`;
                            vis.style.border = `2px solid ${rgb}`;
                        } else {
                            vis.style.background = rgb;
                            vis.style.border = `2px solid #fff`;
                        }
                        vis.style.boxShadow = `0 0 15px ${rgb}`;
                    }
                });
            });
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }

        function startGame() {
            let nGrp = sessionStorage.getItem('r2_groups') || 1;
            for(let i=0; i<nGrp; i++) {
                sessionStorage.setItem(`r2_gname_${i}`, document.getElementById(`gname_${i}`).value);
                sessionStorage.setItem(`r2_p1name_${i}`, document.getElementById(`p1name_${i}`).value);
                sessionStorage.setItem(`r2_p2name_${i}`, document.getElementById(`p2name_${i}`).value);
            }
            setTimeout(() => { location.href = 'game_react2p_run.html'; }, 200);
        }
    </script>
</body>
</html>
