<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Layout - Memory</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="mem_names_title">Setup Layout</div></header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initializing...</div>
        
        <div id="content" style="display:none;">
            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span data-i18n="mem_names_head">Spread them out!</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody">
                    <div style="text-align:center; width:100%;">
                        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;" id="descTxt" data-i18n="mem_names_desc">
                            Scatter the active pucks across a large area.
                        </p>
                        <div id="arenaContainer" style="overflow-x: auto;"></div>
                    </div>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game">TO GAME 🏁</button>
                <button onclick="nav('game_memory_setup.html')" class="btn-back" data-i18n="btn_back">⬅ BACK</button>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const MEM_LAYOUTS = {
            10: ["D1","E1","D2","E2","D3","E3","D4","E4","D5","E5"],
            8:  ["D1","D2","E2","D3","E3","D4","E4","E5"],
            6:  ["D2","E2","D3","E3","D4","E4"],
            4:  ["D3","E3","D4","E4"]
        };

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initList, 500);
        });

        async function initList() {
            // 1. ESP Laden
            await fetch('/api/game/load?id=19');
            
            let nPucks = parseInt(sessionStorage.getItem('mem_pucks') || 4);
            await fetch(`/api/game/action?cmd=cfg_pucks&val=${nPucks}`);
            await fetch(`/api/game/action?cmd=cfg_speed&val=${sessionStorage.getItem('mem_speed')}`);
            await fetch(`/api/game/action?cmd=cfg_auto&val=${sessionStorage.getItem('mem_auto')}`);
            await fetch(`/api/game/action?cmd=cfg_search&val=${sessionStorage.getItem('mem_search')}`);
            
            await fetch('/api/game/action?cmd=setup');
            
            // 2. Tabelle generieren
            let tableHtml = `<table class="arena-table">`;
            const cols = ['A', 'B', 'C', 'D', 'E'];
            for(let r = 1; r <= 5; r++) {
                tableHtml += `<tr>`;
                for(let c = 0; c < 5; c++) {
                    tableHtml += `<td id="cell-${cols[c]}${r}"></td>`;
                }
                tableHtml += `</tr>`;
            }
            tableHtml += `</table>`;
            document.getElementById('arenaContainer').innerHTML = tableHtml;
            
            // 3. Pucks und Läufer setzen
            let layoutKey = [4, 6, 8, 10].find(n => n >= nPucks) || 10;
            let activeLayout = MEM_LAYOUTS[layoutKey];

            for(let i = 0; i < nPucks && i < activeLayout.length; i++) {
                let coord = activeLayout[i];
                let cell = document.getElementById(`cell-${coord}`);
                if(cell) {
                    cell.innerHTML = `<div class="puck-icon" id="puck_vis_${i}">${i+1}</div>`;
                }
            }
            
            // Hunter Zentrum (Immer A3)
            let centerCell = document.getElementById('cell-A3');
            if(centerCell) centerCell.innerHTML = `<div style="font-size:1.5rem; white-space:nowrap;">🏃‍♂️</div>`;
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            setInterval(pollPuckEffects, 1500);
        }

        async function pollPuckEffects() {
            try {
                let r = await fetch('/api/effects');
                let data = await r.json();
                data.forEach(eff => {
                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                        vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                        if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                        if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                        if(eff.eff == 9) vis.classList.add('eff-rainbow');
                        
                        if(eff.eff == 18) {
                            let percent = Math.round(eff.dur / 2.55);
                            vis.style.background = `conic-gradient(${rgb} ${percent}%, var(--border-color) ${percent}%)`;
                            vis.style.border = `2px solid ${rgb}`;
                        } else {
                            vis.style.background = rgb;
                            vis.style.border = `2px solid #fff`;
                        }
                        vis.style.boxShadow = `0 0 15px ${rgb}`;
                    }
                });
            } catch(e) {}
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }

        function startGame() {
            setTimeout(() => { nav('game_memory_run.html'); }, 200);
        }
    </script>
</body>
</html>
