<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>RUN - Countdown</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .timer-box { text-align: center; margin-bottom: 20px; }
        .big-time { font-size: 5rem; font-weight: bold; color: var(--text-main); font-family: 'Courier New', monospace; line-height: 1; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .target-time { color: var(--text-muted); font-size: 1.2rem; margin-top: 5px; }
        
        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; height: 100%; }
        
        .score-row { display: flex; align-items: center; justify-content: space-between; background: var(--card-hover); margin-bottom: 8px; padding: 10px 15px; border-radius: 8px; border-left: 10px solid var(--border-color); transition: transform 0.2s, opacity 0.2s;}
        .score-val { font-size: 1.5rem; font-weight: bold; color: var(--text-main); text-align:right; }
        .score-sub { font-size: 0.8rem; color: var(--text-muted); display:block; text-transform:uppercase; }
        .score-name { font-size: 1.2rem; color: var(--text-main); }
        .rank { font-size: 1.5rem; margin-right: 10px; width: 30px; text-align:center;}
        .diff-time { color: var(--danger); font-size: 0.9rem; }
        
        #scoreboard { display: flex; flex-direction: column; }
        .bottom-nav { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_countdown">Countdown</div>
     <div class="status-bar">
    <div class="status-dot dot-green" id="cnt-green">0</div>
    <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
    <div class="status-dot dot-red" id="cnt-red">0</div>
</div>
    </header>

    <main>
        <div class="timer-box">
            <div class="big-time" id="timer">00:00.0</div>
            <div class="target-time" id="targetInfo" data-i18n="cnt_run_limit">Limit: ∞</div>
        </div>

        <div class="controls">
            <button onclick="doAction('reset')" class="btn-warn btn-ctrl" data-i18n="btn_back">BACK</button>
            <button onclick="doAction('start')" class="btn-primary btn-ctrl" id="btnStart" data-i18n="btn_start">START</button>
            <button onclick="doAction('stop')" class="btn-danger btn-ctrl" data-i18n="btn_stop">STOP</button>
        </div>

        <div id="scoreboard">
            <div id="loadingTxt" style="text-align:center; color:var(--text-muted); padding:20px;" data-i18n="cnt_run_wait">Loading Scores...</div>
        </div>

        <div class="bottom-nav">
            <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
<script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        const COLORS = ['#0000FF', '#00FF00', '#FF0000', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#800080', '#40E0D0', '#FFC0CB', '#FFFFFF', '#00FF00'];
        const MEDALS = ['🥇','🥈','🥉'];
        
        let targetTime = parseInt(sessionStorage.getItem('cd_time') || 0);
        document.addEventListener('DOMContentLoaded', () => {
            if(targetTime > 0) {
                document.getElementById('targetInfo').innerText = `Limit: ${formatTime(targetTime*1000)}`;
            }
        });

        setInterval(updateStatus, 400);

        function updateStatus() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                 
                document.getElementById('timer').innerText = formatTime(data.time || 0);
                
                let btnStart = document.getElementById('btnStart');
                if (data.state == 2) btnStart.innerText = "RUNNING"; 
                else if (data.state == 3) btnStart.innerText = getTranslation('btn_reset'); 
                else btnStart.innerText = getTranslation('btn_start');

                if(data.scores && Array.isArray(data.scores)) {
                    renderScores(data.scores, data.winnerTime);
                }
            }).catch(e => {
                document.getElementById('conn-stat').style.opacity = 0.2;
            });
        }

        function renderScores(scores, winnerTime) {
            let container = document.getElementById('scoreboard');
            let loadingTxt = document.getElementById('loadingTxt');
            if (loadingTxt) loadingTxt.style.display = 'none';
            if (scores.length === 0) return;

            let sortedScores = [...scores].sort((a, b) => {
                if (a.sc === 0 && b.sc === 0) return a.ft - b.ft;
                if (a.sc === 0) return -1;
                if (b.sc === 0) return 1; 
                return a.sc - b.sc;
            });
            
            let rankCounter = 1;

            sortedScores.forEach((s, idx) => {
                let name = sessionStorage.getItem(`p_name_${s.id}`) || `Player ${s.id+1}`;
                let color = COLORS[s.id % COLORS.length];
                let rank = rankCounter + '.';
                
                let valHtml = "";
                let subHtml = "Remaining";
                let rowOpacity = "1";

                if (s.sc === 0) {
                    if (rankCounter === 1) rank = MEDALS[0];
                    else if (rankCounter === 2) rank = MEDALS[1];
                    else if (rankCounter === 3) rank = MEDALS[2];
                    
                    let timeStr = formatTime(s.ft);
                    
                    if (winnerTime > 0 && s.ft > winnerTime) {
                        let diff = s.ft - winnerTime;
                        let diffStr = (diff / 1000).toFixed(2);
                        valHtml = `${timeStr} <span class="diff-time">+${diffStr}s</span>`;
                    } else {
                        valHtml = timeStr;
                    }
                    subHtml = "FINISHED";
                    rowOpacity = "0.7"; 
                    rankCounter++;
                } else {
                    rank = ""; 
                    valHtml = s.sc;
                }

                let rowId = `score-row-${s.id}`;
                let rowEl = document.getElementById(rowId);

                if (!rowEl) {
                    container.insertAdjacentHTML('beforeend', `
                    <div id="${rowId}" class="score-row" style="border-left-color: ${color}; order: ${idx}; opacity: ${rowOpacity};">
                        <div style="display:flex; align-items:center;">
                            <span class="rank" id="rank-${s.id}">${rank}</span>
                            <span class="score-name">${name}</span>
                        </div>
                        <div>
                            <span class="score-sub" id="sub-${s.id}">${subHtml}</span>
                            <div class="score-val" id="val-${s.id}">${valHtml}</div>
                        </div>
                    </div>`);
                } else {
                    rowEl.style.order = idx;
                    rowEl.style.opacity = rowOpacity;
                    document.getElementById(`rank-${s.id}`).innerText = rank;
                    document.getElementById(`sub-${s.id}`).innerText = subHtml;
                    document.getElementById(`val-${s.id}`).innerHTML = valHtml;
                }
            });
        }

        function doAction(act) {
            if(act === 'reset') {
                fetch(`/api/game/action?cmd=reset`);
                location.href = 'game_countdown_names.html'; 
            } else {
                fetch(`/api/game/action?cmd=${act}`);
            }
        }

        function goHome() {
            fetch('/api/game/action?cmd=exit')
                .then(() => location.href = '/')
                .catch(() => location.href = '/');
        }

        function formatTime(ms) {
            let totalSec = Math.floor(ms / 1000);
            let m = Math.floor(totalSec / 60);
            let s = totalSec % 60;
            let z = Math.floor((ms % 1000) / 100); 
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${z}`;
        }
    </script>
</body>
</html>
