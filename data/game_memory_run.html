<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Sprint Live</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-info { background: var(--card-bg); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px; border: 1px solid var(--border-color);}
        .status-txt { font-size: 1.5rem; color: var(--warning); text-transform: uppercase; font-weight:bold;}

        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;}
        .stat-box { background: var(--bg-color); padding: 20px; border-radius: 8px; text-align: center; border: 1px solid var(--border-color);}
        .stat-lbl { color: var(--text-muted); font-size: 1rem; text-transform: uppercase; margin-bottom: 5px; font-weight:bold;}
        .stat-val { color: var(--text-main); font-size: 3rem; font-weight: bold; font-family: monospace; line-height:1;}
        .stat-val.success { color: var(--success); text-shadow: 0 0 10px rgba(0,255,0,0.3);}
        .stat-val.error { color: var(--danger); }
        
        .btn-reveal { background: #6f42c1; color: white; width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.1s;}
        .btn-reveal:active { transform: scale(0.95); background: #5a32a3; }
        .btn-reveal:disabled { opacity: 0.5; cursor: not-allowed; }

        .bottom-nav { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_memory">Memory Sprint 🧠🏃</div>
     <div class="status-bar">
    <div class="status-dot dot-green" id="cnt-green">0</div>
    <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
    <div class="status-dot dot-red" id="cnt-red">0</div>
</div>
    </header>

    <main>
        <div class="top-info">
            <div class="status-txt" id="stateInfo">WAITING...</div>
        </div>

        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-lbl" data-i18n="mem_run_found">Pairs Found</div>
                <div class="stat-val success" id="valFound">0 / 0</div>
            </div>
            <div class="stat-box">
                <div class="stat-lbl" data-i18n="mem_run_miss">Mismatches</div>
                <div class="stat-val error" id="valErr">0</div>
            </div>
        </div>

        <div class="controls">
            <button onclick="goBack()" class="btn-warn btn-ctrl" data-i18n="btn_back">⬅</button>
            <button onclick="doAction('start')" class="btn-primary btn-ctrl" id="btnStart" data-i18n="btn_start">START</button>
            <button onclick="doAction('stop')" class="btn-danger btn-ctrl" data-i18n="btn_stop">STOP</button>
        </div>

        <button id="btnReveal" class="btn-reveal" onclick="doAction('reveal')" data-i18n="mem_btn_reveal">👁️ REVEAL COLORS (2s)</button>

        <div class="bottom-nav">
            <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
<script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');

        setInterval(update, 500); 

        function update() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                 
                render(data);
            }).catch(e => {});
        }

        function render(data) {
            let stTxt = getTranslation(`mem_st_${data.st}`) || "UNKNOWN";
            let stCol = "var(--warning)";
            if(data.st === 3) stCol = "var(--success)"; // Running
            if(data.st === 4) stCol = "var(--text-main)"; // Eval
            if(data.st === 6) stCol = "gold"; // Finished
            
            let infoEl = document.getElementById('stateInfo');
            if (infoEl.innerText !== stTxt) infoEl.innerText = stTxt;
            if (infoEl.style.color !== stCol) infoEl.style.color = stCol;
            
            document.getElementById('valFound').innerText = `${data.pf} / ${data.tot}`;
            document.getElementById('valErr').innerText = data.err;
            
            let btn = document.getElementById('btnStart');
            if (data.st === 0 || data.st === 7 || data.st === 6) { 
                btn.innerText = getTranslation('btn_start'); 
                btn.style.background = "var(--primary)"; 
            } else { 
                btn.innerText = getTranslation('btn_reset'); 
                btn.style.background = "var(--success)"; 
            }
            
            let btnRev = document.getElementById('btnReveal');
            btnRev.disabled = (data.st !== 3);
        }

        function doAction(cmd) { fetch(`/api/game/action?cmd=${cmd}`); }
        function goBack() { doAction('reset'); location.href = 'game_memory_names.html'; }
        function goHome() { fetch('/api/game/action?cmd=exit').then(() => location.href = '/'); }
    </script>
</body>
</html>
