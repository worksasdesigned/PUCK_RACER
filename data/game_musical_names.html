<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Layout - Musical Chairs</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <header><div class="logo" data-i18n="g_musical">Reise nach Jerusalem</div></header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initializing...</div>
        
        <div id="content" style="display:none;">
            
            <div class="card" style="background:rgba(13,110,253,0.1); border-color:var(--primary); text-align:center;">
                <h3>🔊 Audio Hint</h3>
                <p style="font-size:0.9rem; color:var(--text-main);">
                    Connect your Tablet/Smartphone to a <b>Bluetooth Speaker</b> for the best musical experience!
                </p>
            </div>

            <div class="layout-card">
                <div class="layout-header">
                    <span>Streckenaufbau</span>
                </div>
                <div class="layout-body" id="layoutBody">
                    <div style="text-align:center; width:100%;">
                        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;">
                            Verteile die aktiv leuchtenden Pucks im Raum. Die genaue Reihenfolge ist egal.
                        </p>
                        <div id="arenaContainer" style="overflow-x: auto; margin-bottom:20px;"></div>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="location.href='game_musical_setup.html'" class="btn-warn" style="font-size:1.2rem;" data-i18n="btn_back">⬅ BACK</button>
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game">START GAME 🏁</button>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const MUS_LAYOUTS = {
            4: ["A1","E1","A5","E5"],
            5: ["C1","A3","E3","B5","D5"],
            7: ["B1","D1","A3","E3","B5","D5"],
            9: ["C1","B2","D2","A3","E3","B4","D4","C5"],
            11: ["B1","D1","A2","E2","A3","E3","A4","E4","B5","D5"],
            12: ["B1","C1","D1","A2","E2","A3","E3","A4","E4","B5","C5","D5"]
        };
        
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initList, 500);
        });

        async function initList() {
            // Achtung: IDs verwalten. Du hast 25 Spiele in der GameManager.cpp. Ich nehme mal 26.
            // Du musst Game_Musical in GameManager als z.B. 26 einfügen!
            await fetch('/api/game/load?id=26'); 

            let ply = sessionStorage.getItem('mus_ply') || 5;
            let bs = sessionStorage.getItem('mus_base') || 10;
            let vr = sessionStorage.getItem('mus_var') || 1;
            let ps = sessionStorage.getItem('mus_pause') || 5;

            await fetch(`/api/game/action?cmd=cfg_ply&val=${ply}`);
            await fetch(`/api/game/action?cmd=cfg_base&val=${bs}`);
            await fetch(`/api/game/action?cmd=cfg_var&val=${vr}`);
            await fetch(`/api/game/action?cmd=cfg_pause&val=${ps}`);
            await fetch('/api/game/action?cmd=setup');
            
            let res = await fetch('/api/status');
            let data = await res.json();
            let pCount = data.filter(p => p.active).length;
            let activeReq = ply - 1;
            
            // Layout generieren
            let tableHtml = `<table class="arena-table">`;
            const cols = ['A', 'B', 'C', 'D', 'E'];
            for(let r = 1; r <= 5; r++) {
                tableHtml += `<tr>`;
                for(let c = 0; c < 5; c++) { tableHtml += `<td id="cell-${cols[c]}${r}"></td>`; }
                tableHtml += `</tr>`;
            }
            tableHtml += `</table>`;
            document.getElementById('arenaContainer').innerHTML = tableHtml;

            let layoutKey = [4, 5, 7, 9, 11, 12].find(n => n >= pCount) || 12;
            let activeLayout = MUS_LAYOUTS[layoutKey];

            for(let i = 0; i < pCount && i < activeLayout.length; i++) {
                let coord = activeLayout[i];
                let cell = document.getElementById(`cell-${coord}`);
                let col = (i < activeReq) ? '#007bff' : '#444'; // Blau für aktiv
                if(cell) {
                    cell.innerHTML = `<div class="puck-icon" style="background:${col}">${i+1}</div>`;
                }
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }

        function startGame() {
            setTimeout(() => { location.href = 'game_musical_run.html'; }, 200);
        }
    </script>
</body>
</html>
