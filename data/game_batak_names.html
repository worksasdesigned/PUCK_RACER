<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batak Aufbau - PuckRacer</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="bat_names_title">Batak Pro</div>
    </header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initialisierung...</div>
        
        <div id="content" style="display:none;">
            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span data-i18n="bat_layout_title">Puck-Wandaufbau</span>
                    <span id="toggleIcon">▼</span>
                </div>
                
                <div class="layout-body" id="layoutBody">
                    <div style="text-align:center; width:100%;">
                        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;" data-i18n="bat_layout_desc">
                            Befestige die Pucks im angezeigten Muster an der Wand.
                        </p>
                        <div id="arenaContainer" style="overflow-x: auto;"></div>
                    </div>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game">START 🏁</button>
                <button onclick="location.href='game_batak_setup.html'" class="btn-back" data-i18n="btn_back">⬅ ZURÜCK</button>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script>
        const LAYOUTS = {
            12: ["A1","C1","E1","B2","D2","A3","E3","B4","D4","A5","C5","E5"],
            10: ["A1","C1","E1","B2","D2","A3","E3","A5","C5","E5"],
            9:  ["A1","C1","E1","A3","C3","E3","A5","C5","E5"],
            8:  ["A1","C1","E1","A3","E3","A5","C5","E5"],
            7:  ["A1","C1","E1","C3","A5","C5","E5"],
            6:  ["A1","C1","E1","A5","C5","E5"],
            5:  ["A1","E1","C3","A5","E5"], 
            4:  ["A1","E1","A5","E5"],
            3:  ["A3","C3","E3"]
        };

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initList, 500);
        });

        async function initList() {
            if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
            
            await fetch('/api/game/load?id=21');

            let numPucks = parseInt(sessionStorage.getItem('batak_pucks') || 4);
            let holdStart = sessionStorage.getItem('batak_hold') == '1';
            
            await fetch(`/api/game/action?cmd=cfg_pucks&val=${numPucks}`);
            await fetch(`/api/game/action?cmd=cfg_time&val=${sessionStorage.getItem('batak_time')}`);
            await fetch(`/api/game/action?cmd=cfg_diff&val=${sessionStorage.getItem('batak_diff')}`);
            await fetch(`/api/game/action?cmd=cfg_hold&val=${holdStart ? 1 : 0}`);
            await fetch(`/api/game/action?cmd=cfg_speedup&val=${sessionStorage.getItem('batak_speedup') || '1'}`);
            await fetch(`/api/game/action?cmd=cfg_color&val=${sessionStorage.getItem('batak_color') || '2'}`);
            await fetch(`/api/game/action?cmd=cfg_sound&val=${sessionStorage.getItem('batak_sound') || '1'}`);
            await fetch(`/api/game/action?cmd=cfg_fake&val=${sessionStorage.getItem('batak_fake') || '0'}`);
            
            await fetch('/api/game/action?cmd=setup'); 
            await fetch('/api/game/action?cmd=show_layout'); 

            let tableHtml = `<table class="arena-table">`;
            const cols = ['A', 'B', 'C', 'D', 'E'];
            for(let r = 1; r <= 5; r++) {
                tableHtml += `<tr>`;
                for(let c = 0; c < 5; c++) {
                    tableHtml += `<td id="cell-${cols[c]}${r}"></td>`;
                }
                tableHtml += `</tr>`;
            }
            tableHtml += `</table>`;
            document.getElementById('arenaContainer').innerHTML = tableHtml;

            let layoutKey = [3, 4, 5, 6, 7, 8, 9, 10, 12].find(n => n >= numPucks) || 12;
            let activeLayout = LAYOUTS[layoutKey];

            for(let i = 0; i < numPucks; i++) {
                let coord = activeLayout[i] || "C3"; 
                let startHtml = (i === 0 && holdStart) ? `<div class="start-badge" style="position: absolute; top: -15px; background: #fff; color: #000; font-size: 0.7rem; padding: 2px 5px; border-radius: 4px; font-weight:bold; z-index:10;">START</div>` : "";
                let targetCell = document.getElementById(`cell-${coord}`);
                if(targetCell) {
                    targetCell.innerHTML = `<div class="puck-icon" id="puck_vis_${i}">${startHtml}${i+1}</div>`;
                }
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            setInterval(pollPuckEffects, 1500);
        }

        async function pollPuckEffects() {
            try {
                let r = await fetch('/api/effects');
                let data = await r.json();
                data.forEach(eff => {
                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                        vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                        if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                        if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                        if(eff.eff == 9) vis.classList.add('eff-rainbow');
                        
                        if(eff.eff == 18) {
                            let percent = Math.round(eff.dur / 2.55);
                            vis.style.background = `conic-gradient(${rgb} ${percent}%, var(--border-color) ${percent}%)`;
                            vis.style.border = `2px solid ${rgb}`;
                        } else {
                            vis.style.background = rgb;
                            vis.style.border = `2px solid #fff`;
                        }
                        vis.style.boxShadow = `0 0 15px ${rgb}`;
                    }
                });
            } catch(e) {}
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }

        function startGame() { 
            setTimeout(() => { location.href = 'game_batak_run.html'; }, 200);
        }
    </script>
</body>
</html>
