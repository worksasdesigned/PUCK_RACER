<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Countdown Names</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .player-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background:var(--card-bg); padding:10px; border-radius:8px; border-left: 5px solid #fff;}
        .color-box { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; flex-shrink: 0; transition: all 0.3s;}
        input[type=text] { flex-grow: 1; padding: 12px; font-size: 1.1rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main); }
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
        
        .stat-icon { font-size: 1.3rem; opacity: 0.2; transition: all 0.3s; cursor: help; user-select: none; filter: grayscale(100%); margin-left: 5px; }
        .stat-icon.active { opacity: 1; filter: none; text-shadow: 0 0 8px rgba(13, 110, 253, 0.5); }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="cd_names_title">Players - Countdown</div></header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initializing...</div>

        <div id="content" style="display:none;">
            <div class="layout-card" id="layoutCard">
                <div class="layout-header" onclick="toggleLayout()">
                    <span data-i18n="cd_layout_title">Aufbau</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody" style="flex-direction: column; align-items: center; gap: 15px;">
                    <p style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin:0;" data-i18n="puck_per_player">
                        1 Puck pro Spieler verteilen.
                    </p>
                    <div style="text-align:center; width:100%;">
                        <div id="arenaContainer" style="overflow-x: auto;"></div>
                    </div>
                </div>
            </div>

            <div id="pickerBar" style="margin-bottom:15px;">
                <button onclick="loadFromPicker()" class="btn-primary" style="font-size:1.1rem; background:var(--card-hover); border:1px dashed var(--primary); color:var(--primary);" data-i18n="pp_load_players">
                    👥 Load Players
                </button>
            </div>
            
            <div id="playerList" class="card"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="location.href='game_countdown_setup.html'" class="btn-warn" style="font-size:1.2rem;" data-i18n="btn_back">⬅ BACK</button>
                <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem;" data-i18n="btn_start_game">TO GAME 🏁</button>
            </div>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="player_picker.js"></script>
<script>
    if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
    const COLORS = ['#0000FF', '#00FF00', '#FF0000', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#800080', '#40E0D0', '#FFC0CB', '#FFFFFF', '#32CD32'];
    let numPlayers = 1;

    // Feste Anordnungen für eine schöne Kreis/Reihen-Verteilung im Raster
    const LAYOUTS = {
        1: ["C3"], 2: ["B3","D3"], 3: ["B2","D2","C4"], 4: ["B2","D2","B4","D4"],
        5: ["B2","D2","C3","B4","D4"], 6: ["B2","C2","D2","B4","C4","D4"],
        7: ["B2","C2","D2","C3","B4","C4","D4"], 8: ["A2","C2","E2","A3","E3","A4","C4","E4"],
        9: ["A2","C2","E2","A3","C3","E3","A4","C4","E4"],
        10: ["A1","C1","E1","A3","E3","A5","C5","E5","B4","D4"],
        11: ["A1","C1","E1","A3","C3","E3","A5","C5","E5","B4","D4"],
        12: ["A1","C1","E1","B2","D2","A3","E3","B4","D4","A5","C5","E5"]
    };

    const delay = ms => new Promise(res => setTimeout(res, ms));

    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(initList, 500);
    });

    function clearPlayerId(idx) {
        sessionStorage.setItem(`p_id_${idx}`, 0);
        let icon = document.getElementById(`stat_icon_${idx}`);
        if(icon) {
            icon.classList.remove('active');
            icon.title = "Gastspieler (Keine Statistik)";
        }
    }

    async function initList() {
        try {
            await fetch('/api/game/load?id=3');

            numPlayers = parseInt(sessionStorage.getItem('cd_players') || 1);
            let countVal = parseInt(sessionStorage.getItem('cd_count') || 10);
            let timeVal = parseInt(sessionStorage.getItem('cd_time') || 0);
            let warnVal = parseInt(sessionStorage.getItem('cd_warn') || 0);
            let stopWinVal = parseInt(sessionStorage.getItem('cd_stopwin') || 0);

            await fetch(`/api/game/action?cmd=config_players&val=${numPlayers}`);
            await delay(50); 
            await fetch(`/api/game/action?cmd=config_count&val=${countVal}`);
            await delay(50);
            await fetch(`/api/game/action?cmd=config_time&val=${timeVal}`);
            await delay(50);
            await fetch(`/api/game/action?cmd=config_warn&val=${warnVal}`);
            await delay(50);
            await fetch(`/api/game/action?cmd=config_stopwin&val=${stopWinVal}`);
            await delay(50);
            await fetch('/api/game/action?cmd=setup');

            // Arena aufbauen
            let tableHtml = `<table class="arena-table">`;
            const cols = ['A', 'B', 'C', 'D', 'E'];
            for(let r = 1; r <= 5; r++) {
                tableHtml += `<tr>`;
                for(let c = 0; c < 5; c++) {
                    tableHtml += `<td id="cell-${cols[c]}${r}"></td>`;
                }
                tableHtml += `</tr>`;
            }
            tableHtml += `</table>`;
            document.getElementById('arenaContainer').innerHTML = tableHtml;

            let layoutKey = Object.keys(LAYOUTS).find(k => parseInt(k) >= numPlayers) || 12;
            let activeLayout = LAYOUTS[layoutKey];

            for(let i = 0; i < numPlayers; i++) {
                let coord = activeLayout[i];
                let color = COLORS[i % COLORS.length];
                let cell = document.getElementById(`cell-${coord}`);
                if(cell) cell.innerHTML = `<div class="puck-icon" id="puck_vis_${i}" style="background:${color}">${i+1}</div>`;
            }

            // Spielerliste
            let container = document.getElementById('playerList');
            container.innerHTML = "";
            let ph = (typeof getTranslation === 'function') ? getTranslation('cd_ph_player') : "Spieler";
            if(!ph) ph = "Spieler";

            for(let i=0; i<numPlayers; i++) {
                let color = COLORS[i % COLORS.length];
                let name = sessionStorage.getItem(`p_name_${i}`) || `${ph} ${i+1}`;
                
                let pid = sessionStorage.getItem(`p_id_${i}`);
                let hasStats = (pid && pid !== "0");
                let statClass = hasStats ? "active" : "";
                let statTitle = hasStats ? "Statistik wird gespeichert" : "Gastspieler (Keine Statistik)";

                container.innerHTML += `
                <div class="player-row" style="border-left-color: ${color}">
                    <div class="color-box" id="cb_${i}" style="background:${color}; box-shadow:0 0 10px ${color}"></div>
                    <input type="text" id="name_${i}" value="${name}" placeholder="${ph}" oninput="clearPlayerId(${i})">
                    <span class="stat-icon ${statClass}" id="stat_icon_${i}" title="${statTitle}">📊</span>
                </div>`;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            setInterval(pollPuckEffects, 1500);

        } catch (error) {
            console.error("Initialisierungsfehler:", error);
        }
    }

    async function pollPuckEffects() {
        try {
            let r = await fetch('/api/effects');
            let data = await r.json();
            data.forEach(eff => {
                let cb = document.getElementById(`cb_${eff.id}`);
                if(cb) {
                    const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                    cb.style.background = rgb; 
                    cb.style.boxShadow = `0 0 10px ${rgb}`;
                }
                let vis = document.getElementById(`puck_vis_${eff.id}`);
                if(vis) {
                    const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                    vis.classList.remove('eff-breathe', 'eff-chase');
                    if(eff.eff == 3) vis.classList.add('eff-breathe');
                    if(eff.eff == 6) vis.classList.add('eff-chase');
                    vis.style.background = rgb;
                    vis.style.boxShadow = `0 0 15px ${rgb}`;
                }
            });
        } catch(e) {}
    }

    function toggleLayout() {
        document.getElementById('layoutBody').classList.toggle('hidden');
        document.getElementById('toggleIcon').classList.toggle('rotate');
    }

    function loadFromPicker() {
        openPlayerPicker(numPlayers, function(selected) {
            selected.forEach((p, i) => {
                let inp = document.getElementById('name_' + i);
                if (inp) { 
                    inp.value = p.name; 
                    sessionStorage.setItem('p_name_' + i, p.name); 
                }
                sessionStorage.setItem(`p_id_${i}`, p.id); 
                let icon = document.getElementById(`stat_icon_${i}`);
                if(icon) { 
                    icon.classList.add('active'); 
                    icon.title = "Statistik wird gespeichert"; 
                }
            });
        });
    }

    function startGame() {
        for(let i=0; i<numPlayers; i++) {
            let val = document.getElementById(`name_${i}`).value;
            sessionStorage.setItem(`p_name_${i}`, val);
        }
        location.href = 'game_countdown_run.html';
    }
</script>
</body>
</html>
