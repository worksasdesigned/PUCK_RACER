<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview - Sorting Hat</title>
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .preview-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .p-badge { padding: 10px 20px; border-radius: 20px; background: var(--bg-color); border: 2px solid var(--border-color); font-weight: bold; }
        .hidden { display: none; }
        #toggleIcon { transition: transform 0.3s; display: inline-block; }
        .rotate { transform: rotate(-90deg); }
    </style>
</head>
<body>
    <header><div class="logo" data-i18n="sort_prev_title">Preview</div></header>
    <main>
        <div id="loading" style="text-align:center; color:var(--text-muted);" data-i18n="loading">Initializing...</div>
        
        <div id="content" style="display:none;">
            <div class="layout-card">
                <div class="layout-header" onclick="toggleLayout()">
                    <span>Aufbau: Der Sprechende Hut</span>
                    <span id="toggleIcon">▼</span>
                </div>
                <div class="layout-body" id="layoutBody" style="flex-direction: column; align-items: center; gap: 20px;">
                    <p style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin:0;">
                        Tippe den Puck an, um in ein Haus eingeteilt zu werden!
                    </p>
                    <div id="arenaContainer" style="overflow-x: auto;"></div>
                </div>
            </div>

            <div class="card" style="text-align:center;">
                <h3 data-i18n="sort_prev_houses">The Houses</h3>
                <div id="houseList" class="preview-list"></div>
                <p id="distInfo" style="margin-top:20px; color:var(--text-muted);"></p>
            </div>

            <button onclick="startGame()" class="btn-primary" style="font-size:1.5rem; margin-top:20px;" data-i18n="btn_start_game">START GAME 🏁</button>
            <button onclick="location.href='game_sorting_setup.html'" class="btn-back" style="margin-top:20px;" data-i18n="btn_back">⬅ BACK</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const COLORS = ['#FF0000', '#0000FF', '#00FF00', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#FFFFFF'];
        const SORT_LAYOUTS = { 1: ["C3"], 2: ["C3", "C4"], 3: ["C2", "C3", "C4"] };

        // Hilfsfunktion: Zwingt JS zu warten, damit der ESP32 Request-Ressourcen freigeben kann
        const delay = ms => new Promise(res => setTimeout(res, ms));

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(initList, 500);
        });

        async function initList() {
            try {
                await fetch('/api/game/load?id=7');

                let groups = parseInt(sessionStorage.getItem('sort_grp') || 2);
                let players = parseInt(sessionStorage.getItem('sort_plr') || 20);
                let pucks = parseInt(sessionStorage.getItem('sort_puck') || 1);

                // Delays hinzugefügt, um Socket-Überlastung am ESP32 zu vermeiden
                await fetch(`/api/game/action?cmd=cfg_groups&val=${groups}`);
                await delay(100);
                await fetch(`/api/game/action?cmd=cfg_players&val=${players}`);
                await delay(100);
                await fetch(`/api/game/action?cmd=cfg_pucks&val=${pucks}`);
                await delay(100);
                await fetch('/api/game/action?cmd=setup');
                await delay(100);
                await fetch('/api/game/action?cmd=preview');
                
                // 1. Tabelle generieren
                let tableHtml = `<table class="arena-table">`;
                const cols = ['A', 'B', 'C', 'D', 'E'];
                for(let r = 1; r <= 5; r++) {
                    tableHtml += `<tr>`;
                    for(let c = 0; c < 5; c++) {
                        tableHtml += `<td id="cell-${cols[c]}${r}"></td>`;
                    }
                    tableHtml += `</tr>`;
                }
                tableHtml += `</table>`;
                document.getElementById('arenaContainer').innerHTML = tableHtml;

                // 2. Statische Emojis setzen
                let eGrp = `<div style="font-size:1.5rem; white-space:nowrap; margin-left:-10px;">👬👭</div>`;
                let cA2 = document.getElementById('cell-A2'); if(cA2) cA2.innerHTML = eGrp;
                let cA3 = document.getElementById('cell-A3'); if(cA3) cA3.innerHTML = eGrp;
				let cA4 = document.getElementById('cell-A4'); if(cA4) cA4.innerHTML = eGrp;
                
                let cD2 = document.getElementById('cell-D2'); if(cD2) cD2.innerHTML = `<div style="font-size:1.5rem;">↗️</div>`;
                let cD3 = document.getElementById('cell-D3'); if(cD3) cD3.innerHTML = `<div style="font-size:1.5rem;">➡️</div>`;
                let cD4 = document.getElementById('cell-D4'); if(cD4) cD4.innerHTML = `<div style="font-size:1.5rem;">↘️</div>`;

                // 3. Pucks setzen
                let layoutKey = [1, 2, 3].find(n => n >= pucks) || 3;
                let activeLayout = SORT_LAYOUTS[layoutKey];

                for(let i=0; i<pucks && i<activeLayout.length; i++) {
                    let coord = activeLayout[i];
                    let cell = document.getElementById(`cell-${coord}`);
                    if(cell) {
                        cell.innerHTML = `<div class="puck-icon" id="puck_vis_${i}" style="background:#444">${i+1}</div>`;
                    }
                }

                // 4. Häuser UI generieren
                let html = "";
                for(let i=0; i<groups; i++) {
                    let name = (typeof getTranslation === 'function') ? getTranslation(`sort_names_${i}`) : `Team ${i+1}`;
                    if(!name) name = `Team ${i+1}`;
                    html += `<div class="p-badge" style="border-color:${COLORS[i]}; color:${COLORS[i]}">${name}</div>`;
                }
                document.getElementById('houseList').innerHTML = html;

                let perGroup = Math.floor(players / groups);
                let remainder = players % groups;
                
                let txt = (typeof getTranslation === 'function') ? getTranslation('sort_prev_base') : "{0} Spieler pro Haus";
                if(txt) txt = txt.replace('{0}', perGroup);

                if(remainder > 0) {
                    let rTxt = (typeof getTranslation === 'function') ? getTranslation('sort_prev_rem') : "+ {0} Rest";
                    if(rTxt) txt += `<br>` + rTxt.replace('{0}', remainder);
                }
                document.getElementById('distInfo').innerHTML = txt;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                setInterval(pollPuckEffects, 1500);
            } catch (e) { console.error(e); }
        }

        async function pollPuckEffects() {
            try {
                let r = await fetch('/api/effects');
                let data = await r.json();
                data.forEach(eff => {
                    let vis = document.getElementById(`puck_vis_${eff.id}`);
                    if(vis) {
                        const rgb = `rgb(${eff.r}, ${eff.g}, ${eff.b})`;
                        
                        // Zuerst alle bestehenden CSS-Effektklassen bereinigen
                        vis.classList.remove('eff-breathe', 'eff-chase', 'eff-rainbow');
                        
                        if(eff.eff == 3 || eff.eff == 4 || eff.eff == 5) vis.classList.add('eff-breathe');
                        if(eff.eff == 6 || eff.eff == 7) vis.classList.add('eff-chase');
                        
                        // Sonderbehandlung für den Rainbow-Effekt (eff.eff == 9)
                        if(eff.eff == 9) {
                            vis.classList.add('eff-rainbow');
                            // Überschreibe das Schwarz(0,0,0) mit einem CSS-Farbverlauf
                            vis.style.background = 'linear-gradient(45deg, red, orange, yellow, green, blue, purple)';
                            vis.style.boxShadow = '0 0 15px rgba(255, 255, 255, 0.6)';
                            vis.style.border = "2px solid #fff";
                        } else {
                            // Standardverhalten für alle anderen Farben
                            vis.style.background = rgb;
                            vis.style.boxShadow = `0 0 15px ${rgb}`;
                            vis.style.border = (eff.r===0 && eff.g===0 && eff.b===0) ? "2px solid #444" : "2px solid #fff";
                        }
                    }
                });
            } catch(e) {}
        }

        function toggleLayout() {
            document.getElementById('layoutBody').classList.toggle('hidden');
            document.getElementById('toggleIcon').classList.toggle('rotate');
        }

        function startGame() {
            fetch('/api/game/action?cmd=start');
            setTimeout(() => { location.href = 'game_sorting_run.html'; }, 200);
        }
    </script>
</body>
</html>
