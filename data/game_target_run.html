<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuckRacer">
    <title>Target Touch Live</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-info { background: var(--card-bg); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px; border: 1px solid var(--border-color);}
        .big-time { font-size: 4rem; font-family: monospace; color: var(--text-main); font-weight: bold; line-height:1;}
        .target-time { color: var(--text-muted); font-size: 1.2rem; margin-top: 5px; font-weight:normal; }

        .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-ctrl { padding: 15px; font-size: 1.2rem; font-weight: bold; }

        .grp-box { background: var(--card-hover); border-radius: 8px; margin-bottom: 15px; padding: 12px; border-left: 8px solid var(--border-color); transition: background 0.3s, border-color 0.2s;}
        .grp-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .g-name { font-size:1.3rem; font-weight:bold; color:var(--text-main); }
        
        .run-stats { display: flex; justify-content: space-between; align-items: center; background:var(--bg-color); padding:15px; border-radius:6px; margin-bottom:10px;}
        .stat-col { text-align:center; }
        .stat-lbl { font-size:0.9rem; color:var(--text-muted); text-transform:uppercase; }
        .stat-val { font-family:monospace; font-size:2rem; font-weight:bold; color:var(--text-main); }
        .stat-val.score { color: gold; }
        
        .g-status { font-size: 2rem; margin-right:10px;}
        .row-fail { border-color: var(--danger) !important; background: rgba(220, 53, 69, 0.2); }

        .action-btns { display: flex; gap: 10px;}
        .btn-action { flex:1; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-action:active { transform: scale(0.95); }
        .btn-stop { background: var(--danger); color: white; }
        .btn-start { background: var(--success); color: black; }
        
        .bottom-nav { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="logo" data-i18n="g_target">Target Touch 🎯</div>
        <div class="status-bar">
            <div class="status-dot dot-green" id="cnt-green">0</div>
            <div class="status-dot dot-yellow" id="cnt-yellow">0</div>
            <div class="status-dot dot-red" id="cnt-red">0</div>
        </div>
    </header>

    <main>
        <div class="top-info">
            <div class="big-time" id="globalTime">00:00.0</div>
            <div class="target-time" id="globalTarget">Loading...</div>
        </div>

        <div class="controls">
            <button onclick="goBack()" class="btn-warn btn-ctrl" data-i18n="btn_back">⬅</button>
            <button onclick="doAction('start')" class="btn-primary btn-ctrl" id="btnStart" data-i18n="btn_start_all">START ALL</button>
            <button onclick="doAction('stop')" class="btn-danger btn-ctrl" data-i18n="btn_stop_all">STOP ALL</button>
        </div>

        <div id="gameBoard"></div>

        <div class="bottom-nav">
            <button onclick="goHome()" class="btn-back" style="width:100%;" data-i18n="btn_home">🏠 Home</button>
        </div>
    </main>

    <script src="lang.js"></script>
    <script src="script.js"></script>
    <script>startStatusLoop();</script>
    <script>
        if(localStorage.getItem('puck_theme') === 'light') document.body.classList.add('theme-light');
        const GRP_COLORS = ['#FF00FF', '#00FFFF', '#FFFF00', '#00FF00', '#FF1493'];
        
        function t(key, fallback) {
            if (typeof getTranslation !== 'function') return fallback;
            let val = getTranslation(key);
            return (val && val !== key) ? val : fallback;
        }

        // STATS LOGIK
        let groupSaved = {};

        function savePlayerStat(idx, hits, timeMs) {
            let pid = sessionStorage.getItem(`p_id_${idx}`);
            if (!pid || pid === "0") return;
            let fd = new URLSearchParams();
            fd.append('pid', pid);
            fd.append('game', 15); 
            fd.append('score', hits); 
            fd.append('ex1', timeMs); 
            fd.append('ts', Date.now());
            fetch('/api/stats/player_save', { method: 'POST', body: fd }).catch(e => console.log(e));
        }

        document.getElementById('gameBoard').addEventListener('click', function(e) {
            let btn = e.target.closest('.action-btn');
            if(btn) {
                let cmd = btn.getAttribute('data-cmd');
                if(cmd) doAction(cmd);
            }
        });

        setInterval(updateStatus, 400); 

        function updateStatus() {
            fetch('/api/game/status').then(r=>r.json()).then(data => {
                 
                let maxTime = 0;
                if (data.groups) {
                    data.groups.forEach(g => {
                        if (g.time > maxTime) maxTime = g.time;
                    });
                }
                document.getElementById('globalTime').innerText = formatTimeBig(maxTime);

                if (data.mode === 0) {
                    let m = Math.floor(data.lim / 60000);
                    let s = Math.floor((data.lim % 60000) / 1000);
                    document.getElementById('globalTarget').innerText = `${t('lbl_time_limit', 'Limit:')} ${m}m ${s.toString().padStart(2,'0')}s`;
                } else {
                    document.getElementById('globalTarget').innerText = `${t('tgt_run_target', 'Target:')} ${data.lim}`;
                }

                // Statistiken prüfen & mit Warteschlange (Queue) speichern
                if (data.groups) {
                    let saveQueueDelay = 0;
                    data.groups.forEach((g, i) => {
                        // Zurücksetzen, wenn die Gruppe wieder bei 0 anfängt
                        if (g.st < 4) {
                            groupSaved[i] = false;
                        }
                        
                        // Wenn Gruppe fertig ist und noch nicht gespeichert wurde
                        if (g.st === 5 && !groupSaved[i]) {
                            // Speichern, sobald Score ODER Zeit größer 0 ist
                            if (g.sc > 0 || g.time > 0) { 
                                setTimeout(() => savePlayerStat(i, g.sc, g.time), saveQueueDelay);
                                saveQueueDelay += 200; // 200ms Atempause für den ESP32
                            }
                            groupSaved[i] = true;
                        }
                    });
                }

                renderTable(data.groups);
            }).catch(e => {});
        }

        function formatTimeBig(ms) {
            let totalSec = Math.floor(ms / 1000);
            let m = Math.floor(totalSec / 60);
            let s = totalSec % 60;
            let z = Math.floor((ms % 1000) / 100); 
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${z}`;
        }

        function formatTime(ms) {
            let tVal = Math.floor(ms / 1000);
            let m = Math.floor(tVal / 60);
            let s = tVal % 60;
            let dec = Math.floor((ms % 1000) / 100);
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${dec}`;
        }

        function renderTable(groups) {
            let container = document.getElementById('gameBoard');
            if (!groups) return;

            let tScore = t('tgt_run_score', 'Score');
            let tTime = t('tgt_run_time', 'Time');
            let tRestart = t('tgt_btn_restart', 'RESTART');
            let tStop = t('tgt_btn_stop', 'STOP');

            groups.forEach((g, i) => {
                let rowId = `tg-grp-${i}`;
                let rowEl = document.getElementById(rowId);
                
                let gName = sessionStorage.getItem(`p_name_${i}`) || `Player ${i+1}`;
                let color = GRP_COLORS[i];
                let rowClass = "grp-box";
                
                let icon = "";
                if (g.st === 0) icon = "💤";
                else if (g.st === 1 || g.st === 2) icon = g.hld ? "🖐️" : "⌛";
                else if (g.st === 3) { icon = "⚠️"; rowClass += " row-fail"; }
                else if (g.st === 4) icon = "🎯";
                else if (g.st === 5) icon = "🏁";

                if (!rowEl) {
                    container.insertAdjacentHTML('beforeend', `
                    <div id="${rowId}" class="${rowClass}" style="border-left-color: ${color}">
                        <div class="grp-head">
                            <span class="g-name">${gName}</span>
                            <span id="st-icon-${i}" class="g-status">${icon}</span>
                        </div>
                        <div class="run-stats">
                            <div class="stat-col">
                                <div class="stat-lbl" id="lbl-time-${i}">${tTime}</div>
                                <div id="time-${i}" class="stat-val">00:00.0</div>
                            </div>
                            <div class="stat-col">
                                <div class="stat-lbl" id="lbl-score-${i}">${tScore}</div>
                                <div id="score-${i}" class="stat-val score">${g.sc}</div>
                            </div>
                        </div>
                        <div class="action-btns">
                            <button id="btn-start-${i}" class="btn-action btn-start action-btn" data-cmd="grp_start_${i}">${tRestart}</button>
                            <button id="btn-stop-${i}" class="btn-action btn-stop action-btn" data-cmd="grp_stop_${i}">${tStop}</button>
                        </div>
                    </div>`);
                } else {
                    if (rowEl.className !== rowClass) rowEl.className = rowClass;
                    
                    let iconEl = document.getElementById(`st-icon-${i}`);
                    if (iconEl.innerText !== icon) iconEl.innerText = icon;

                    document.getElementById(`lbl-time-${i}`).innerText = tTime;
                    document.getElementById(`lbl-score-${i}`).innerText = tScore;

                    document.getElementById(`time-${i}`).innerText = formatTime(g.time);
                    document.getElementById(`score-${i}`).innerText = g.sc;
                    
                    let btnStart = document.getElementById(`btn-start-${i}`);
                    let btnStop = document.getElementById(`btn-stop-${i}`);
                    
                    btnStart.innerText = tRestart;
                    btnStop.innerText = tStop;
                    
                    if (btnStart.style.opacity === "0.5") btnStart.style.opacity = "1";
                    if (btnStop.style.opacity === "0.5") btnStop.style.opacity = "1";
                }
            });
        }

        function doAction(act) { 
            if (act.startsWith('grp_start')) document.getElementById(`btn-start-${act.split('_')[2]}`).style.opacity = "0.5";
            if (act.startsWith('grp_stop')) document.getElementById(`btn-stop-${act.split('_')[2]}`).style.opacity = "0.5";
            fetch(`/api/game/action?cmd=${act}`); 
        }
        function goBack() { doAction('reset'); nav('game_target_names.html'); }
        function goHome() { fetch('/api/game/action?cmd=exit').then(() => nav('/')); }
    </script>
</body>
</html>
